  const w = cnv.width, h = cnv.height;
  if (!w || !h) return;
  const g = cnv.getContext('2d');
  const id = g.getImageData(0, 0, w, h);
  const d = id.data;
  const lo = 255 - tol;
  const seen = new Uint8Array(w * h);
  // Стартуем со всей рамки pickup'а, стек плоский (x, y, x, y, ...).
  const stack = [];
  for (let x = 0; x < w; x++) stack.push(x, 0, x, h - 1);
  for (let y = 0; y < h; y++) stack.push(0, y, w - 1, y);
  while (stack.length) {
    const cy = stack.pop();
    const cx = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const s = cy * w + cx;
    if (seen[s]) continue;
    seen[s] = 1;
    const i = s * 4;
    if (d[i + 3] === 0) continue; // уже прозрачный - дальше не идём
    if (d[i] < lo || d[i + 1] < lo || d[i + 2] < lo) continue; // край рисунка
    d[i + 3] = 0;
    stack.push(cx + 1, cy, cx - 1, cy, cx, cy + 1, cx, cy - 1);
  }
  g.putImageData(id, 0, 0);
}

function promoteSelectionToFloating(opts) {
  opts = opts || {};
  const eraseBbox = opts.eraseBbox !== false;
  if (!state.selection) return null;
  const s = state.selection;
  if (s.w < 2 || s.h < 2) return null;
  const pickup = document.createElement('canvas');
  pickup.width = Math.round(s.w);
  pickup.height = Math.round(s.h);
  pickup.getContext('2d').drawImage(canvas, s.x, s.y, s.w, s.h, 0, 0, pickup.width, pickup.height);
  // Прямоугольное выделение поднимаем «без белого»: фон становится прозрачным.
  // Для quad (eraseBbox=false) форму задаёт сам полигон-клип, кеинг не нужен.
  if (eraseBbox) keyOutWhite(pickup);
  const backup = ctx.getImageData(0, 0, canvas.width, canvas.height);
  if (eraseBbox) {
    ctx.fillStyle = 'white';
    ctx.fillRect(s.x, s.y, s.w, s.h);
  }
  state.floating = {
    type: 'image',
    canvas: pickup,
    x: s.x, y: s.y, w: s.w, h: s.h,
    naturalW: pickup.width, naturalH: pickup.height,
    rotation: 0,
    quad: null,
    preCanvas: backup
  };
  hideSelection();
  rememberFloatingOrigin(state.floating);
  renderFloating();
  return state.floating;
}

// Рисует pickup-картинку, обрезанную полигоном из 4 точек.
// Pickup рисуется в (drawX, drawY) размером (drawW, drawH) и НЕ деформируется под
// форму quad'а — quad работает как clip-маска. Однако drawW/drawH позволяют scale
// (через resize-handles bbox'а), а rotation — равномерно повернуть pickup вокруг
// центра bbox. Так resize/rotate действуют на pickup ВМЕСТЕ с маской, а drag
// одного quad-corner — только на маску.
function drawClippedQuad(g, img, quad, drawX, drawY, drawW, drawH, rotation) {
  g.save();
  g.beginPath();
  g.moveTo(quad[0].x, quad[0].y);
  g.lineTo(quad[1].x, quad[1].y);
  g.lineTo(quad[2].x, quad[2].y);
  g.lineTo(quad[3].x, quad[3].y);
  g.closePath();
  g.clip();
  if (rotation) {
    const cx = drawX + drawW / 2;
    const cy = drawY + drawH / 2;
    g.translate(cx, cy);
    g.rotate(rotation);
    g.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    g.drawImage(img, drawX, drawY, drawW, drawH);
  }
  g.restore();
}

// Нарисовать текущий floating в произвольный контекст в координатах холста -
// ровно так, как его видит пользователь (с поворотом и клипом по quad).
// Один общий рендер на все места: превью, фиксацию, пипетку и копирование.
// Пока эти три ветки были скопированы по коду, о повороте забывали то в одной,
// то в другой.
function drawFloatingOnto(g) {
  const f = state.floating;
  if (!f) return;
  if (f.quad) {
    drawClippedQuad(g, f.canvas, f.quad, f.x, f.y, f.w, f.h, f.rotation || 0);
  } else if (f.rotation) {
    g.save();
    g.translate(f.x + f.w / 2, f.y + f.h / 2);
    g.rotate(f.rotation);
    g.drawImage(f.canvas, -f.w / 2, -f.h / 2, f.w, f.h);
    g.restore();
  } else {
    g.drawImage(f.canvas, f.x, f.y, f.w, f.h);
  }
}

// Габарит того, что реально нарисовано, в координатах холста. Это не bbox
// (f.x/f.y/f.w/f.h): у повёрнутого прямоугольника углы вылезают за него,
// а quad, наоборот, бывает уже. Нужен при копировании, чтобы не срезать края.
function floatingBounds(f) {
  let pts;
  if (f.quad) {
    pts = f.quad;
  } else {
    pts = [
      { x: f.x, y: f.y }, { x: f.x + f.w, y: f.y },
      { x: f.x + f.w, y: f.y + f.h }, { x: f.x, y: f.y + f.h }
    ];
    if (f.rotation) {
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      const c = Math.cos(f.rotation), s = Math.sin(f.rotation);
      pts = pts.map(p => ({
        x: cx + c * (p.x - cx) - s * (p.y - cy),
        y: cy + s * (p.x - cx) + c * (p.y - cy)
      }));
    }
  }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  return { x: minX, y: minY, w: Math.max(...xs) - minX, h: Math.max(...ys) - minY };
}

function renderFloating() {
  // previewCanvas делят мазок и плавающий объект: без сброса объект унаследовал бы
  // прозрачность недорисованного мазка.
  previewCanvas.style.opacity = '';
  if (!state.floating) {
    floatingFrame.classList.remove('active', 'quad-mode');
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    hideQuadControls();
    return;
  }
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  drawFloatingOnto(previewCtx);
  updateFloatingFrame();
}

function updateFloatingFrame() {
  if (!state.floating) {
    floatingFrame.classList.remove('active', 'quad-mode');
    hideQuadControls();
    return;
  }
  const f = state.floating;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;

  // Общая часть: позиция и размер bbox + опциональный CSS-поворот рамки.
  // Resize-handles и rotate-handle висят внутри frame'а и поворачиваются вместе с ним.
  const wPx = f.w * scaleX;
  const hPx = f.h * scaleY;
  floatingFrame.classList.add('active');
  floatingFrame.classList.toggle('quad-mode', !!f.quad);
  floatingFrame.classList.toggle('rotated', !!f.rotation);
  floatingFrame.classList.toggle('small-x', wPx < 50);
  floatingFrame.classList.toggle('small-y', hPx < 50);
  floatingFrame.style.left = (f.x * scaleX) + 'px';
  floatingFrame.style.top = (f.y * scaleY) + 'px';
  floatingFrame.style.width = wPx + 'px';
  floatingFrame.style.height = hPx + 'px';
  floatingFrame.style.transformOrigin = '50% 50%';
  floatingFrame.style.transform = f.rotation ? `rotate(${f.rotation}rad)` : '';

  if (f.quad) {
    showQuadControls(f.quad, scaleX, scaleY);
  } else {
    hideQuadControls();
  }
}

function showQuadControls(quad, scaleX, scaleY) {
  // Перерисовать SVG-контур и позиции точек. SVG растягиваем под canvas (в screen-px).
  const rect = canvas.getBoundingClientRect();
  quadOutline.classList.add('active');
  quadOutline.setAttribute('width', rect.width);
  quadOutline.setAttribute('height', rect.height);
  quadOutline.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  quadOutline.style.width = rect.width + 'px';
  quadOutline.style.height = rect.height + 'px';
  const pts = quad.map(p => `${p.x * scaleX},${p.y * scaleY}`).join(' ');
  quadOutlinePoly.setAttribute('points', pts);
  quadCornerEls.forEach((el, i) => {
    el.classList.add('active');
    el.style.left = (quad[i].x * scaleX) + 'px';
    el.style.top = (quad[i].y * scaleY) + 'px';
  });
}

function hideQuadControls() {
  quadOutline.classList.remove('active');
  quadCornerEls.forEach(el => el.classList.remove('active'));
}

// Стереть исходную область quad на main canvas. Lazy: вызывается при первом
// translate/scale/rotate. Snapshot ТЕКУЩЕЙ формы quad сохраняется в originalQuad,
// и стирается именно она (не bbox!). Так пользователь может corner-drag'ом сделать
// треугольник, затем move — и на canvas останется "всё минус треугольник", а не
// "всё минус прямоугольник bbox".
function ensureOriginalQuadErased() {
  const f = state.floating;
  if (!f || !f.quad || f.originalQuadErased) return;
  // Snapshot текущей формы quad как originalQuad — стираем именно её
  f.originalQuad = f.quad.map(p => ({ x: p.x, y: p.y }));
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(f.originalQuad[0].x, f.originalQuad[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(f.originalQuad[i].x, f.originalQuad[i].y);
  ctx.closePath();
  ctx.fillStyle = 'white';
  ctx.fill();
  ctx.restore();
  f.originalQuadErased = true;
}

// Снимок положения пикапа сразу после подъёма. Нужен, чтобы отличить «подняли и
// положили обратно, не сдвинув» от настоящего перемещения.
function rememberFloatingOrigin(f) {
  if (!f) return;
  f.origin = {
    x: f.x, y: f.y, w: f.w, h: f.h,
    rotation: f.rotation || 0,
    quad: f.quad ? f.quad.map(p => ({ x: p.x, y: p.y })) : null
  };
}

// Сдвинулся ли пикап хоть как-нибудь с момента подъёма. Сравниваем геометрию, а не
// ставим флаг в пяти обработчиках drag'а: флаг забыть легко, а забытый - значит
// молча потерянная запись в истории.
function floatingMoved(f) {
  if (!f.preCanvas) return true;   // вставка или открытая картинка: пиксели новые
  const o = f.origin;
  if (!o) return true;
  if (f.x !== o.x || f.y !== o.y || f.w !== o.w || f.h !== o.h) return true;
  if ((f.rotation || 0) !== o.rotation) return true;
  const q = f.quad, oq = o.quad;
  if (!!q !== !!oq) return true;
  if (q && oq) {
    for (let i = 0; i < q.length; i++) {
      if (q[i].x !== oq[i].x || q[i].y !== oq[i].y) return true;
    }
  }
  return false;
}

function commitFloating() {
  if (!state.floating) return;
  const f = state.floating;
  // Подняли и положили обратно, не сдвинув: клик внутрь выделения и клик мимо.
  // Холст обязан остаться прежним до пикселя, а в истории и в признаке
  // несохранённой работы такому событию делать нечего. cancelFloating
  // возвращает preCanvas, то есть ровно дополитное состояние.
  if (!floatingMoved(f)) {
    cancelFloating();
    return;
  }
  // Для quad: гарантируем что текущая shape стёрта (если был idle commit без translate).
  // Если квад был перенесён/изменён до commit — стирание уже произошло раньше.
  if (f.quad) ensureOriginalQuadErased();
  ctx.save();
  ctx.globalAlpha = 1;
  drawFloatingOnto(ctx);
  ctx.restore();
  state.floating = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  floatingFrame.classList.remove('active', 'quad-mode');
  floatingFrame.style.transform = '';
  hideQuadControls();
  saveHistory('Перемещение');
}

function cancelFloating() {
  // Если есть backup (promote из selection) — возвращаем canvas в дополитное состояние
  if (state.floating && state.floating.preCanvas) {
    ctx.putImageData(state.floating.preCanvas, 0, 0);
  }
  state.floating = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  floatingFrame.classList.remove('active', 'quad-mode');
  floatingFrame.style.transform = '';
  hideQuadControls();
}

// Убрать floating, НЕ возвращая пиксели на место: то, что было под ним,
// остаётся стёртым. Этим отличается от cancelFloating, который делает ровно
// обратное - откатывает подъём. Возвращает true, если холст при этом
// изменился, то есть нужна запись в историю (у только что вставленной
// картинки под ней ничего не стиралось, и писать нечего).
function deleteFloating() {
  const f = state.floating;
  if (!f) return false;
  const hadQuad = !!f.quad;
  // Форма quad стирается лениво, при первом перемещении. Если его не было -
  // стираем сейчас, иначе «вырезать» оставило бы полигон на холсте.
  if (hadQuad) ensureOriginalQuadErased();
  const changed = !!f.preCanvas || hadQuad;
  f.preCanvas = null; // подавляем restore внутри cancelFloating
  cancelFloating();
  return changed;
}

// Проверка, попал ли клик в floating (с учётом rotation и quad).
function hitFloating(x, y) {
  if (!state.floating) return null;
  const f = state.floating;
  if (f.quad) {
    return pointInPolygon(x, y, f.quad) ? 'body' : null;
  }
  if (!f.rotation) {
    return (x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h) ? 'body' : null;
  }
  // Поворачиваем точку в локальную систему floating
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  const cos = Math.cos(-f.rotation), sin = Math.sin(-f.rotation);
  const lx = cos * (x - cx) - sin * (y - cy) + f.w / 2;
  const ly = sin * (x - cx) + cos * (y - cy) + f.h / 2;
  return (lx >= 0 && lx <= f.w && ly >= 0 && ly <= f.h) ? 'body' : null;
}

// Ray casting test для произвольного polygon
function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// ============ RESIZE FLOATING ============
// Anchor-based math: противоположная ручке точка фиксирована в мировой системе,
// мышь приводится к локальной системе (-rotation), считаются новые w/h, центр
// возвращается обратно в мир (+rotation). Это работает для любого угла поворота
// и для quad — точки масштабируются вокруг того же якоря.

function resizeFloating(x, y) {
  const f = state.floating;
  const h = state.resizeHandle;
  if (!f || !h) return;

  const orig = state.floatingOriginal;
  const shift = state.shiftKey || false;
  const rot = orig.rotation || 0;
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  const cosNeg = Math.cos(-rot), sinNeg = Math.sin(-rot);

  // 1) anchor в локальной системе bbox: противоположная ручке точка
  let axL, ayL;
  if (h.includes('w')) axL = orig.w; else if (h.includes('e')) axL = 0; else axL = orig.w / 2;
  if (h.includes('n')) ayL = orig.h; else if (h.includes('s')) ayL = 0; else ayL = orig.h / 2;

  // 2) anchor в мировой системе: поворачиваем вектор от центра bbox
  const origCx = orig.x + orig.w / 2;
  const origCy = orig.y + orig.h / 2;
  const vx = axL - orig.w / 2;
  const vy = ayL - orig.h / 2;
  const axW = origCx + cosR * vx - sinR * vy;
  const ayW = origCy + sinR * vx + cosR * vy;

  // 3) локальная позиция мыши относительно anchor (поворот -rot)
  const dxW = x - axW;
  const dyW = y - ayW;
  const lx = cosNeg * dxW - sinNeg * dyW;
  const ly = sinNeg * dxW + cosNeg * dyW;

  // 4) новые размеры в локальной системе (знак зависит от того, по какую сторону anchor)
  let newW, newH;
  if (h.includes('w')) newW = Math.max(10, -lx);
  else if (h.includes('e')) newW = Math.max(10, lx);
  else newW = orig.w;
  if (h.includes('n')) newH = Math.max(10, -ly);
  else if (h.includes('s')) newH = Math.max(10, ly);
  else newH = orig.h;

  // 5) shift = пропорция (для угловых ручек)
  if (shift && h.length === 2) {
    const ratio = orig.w / orig.h;
    if (newW / newH > ratio) newW = newH * ratio;
    else newH = newW / ratio;
  }

  // 6) новый центр floating в мире: anchor + повернутый локальный вектор к центру
  let lcx, lcy;
  if (h.includes('w')) lcx = -newW / 2;
  else if (h.includes('e')) lcx = newW / 2;
  else lcx = 0;
  if (h.includes('n')) lcy = -newH / 2;
  else if (h.includes('s')) lcy = newH / 2;
  else lcy = 0;
  const newCx = axW + cosR * lcx - sinR * lcy;
  const newCy = ayW + sinR * lcx + cosR * lcy;

  // 7) если quad — scale 4 точки относительно anchor world (в локальной системе)
  if (orig.quad) {
    const sx = newW / orig.w;
    const sy = newH / orig.h;
    f.quad = orig.quad.map(p => {
      const px = p.x - axW;
      const py = p.y - ayW;
      const plx = cosNeg * px - sinNeg * py;
      const ply = sinNeg * px + cosNeg * py;
      const splx = plx * sx;
      const sply = ply * sy;
      const wx = cosR * splx - sinR * sply;
      const wy = sinR * splx + cosR * sply;
      return { x: axW + wx, y: ayW + wy };
    });
  }

  f.x = newCx - newW / 2;
  f.y = newCy - newH / 2;
  f.w = newW;
  f.h = newH;
  renderFloating();
}

// Обработчики ручек resize — только во floating-frame (на selection-overlay их нет,
// чтобы не перехватывать клик пользователя по canvas при создании нового выделения).
// Для resize обычного select сначала нажимай rotate-handle (promote → floating),
// и дальше уже full pixel-resize.
document.querySelectorAll('.resize-handle').forEach(h => {
  h.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    // Handle на selection-overlay: сначала promote во floating (без вращения),
    // потом стартуем обычный resize. Это и есть «масштабирование выделения».
    if (h.dataset.on === 'selection' && !state.floating) {
      if (!state.selection || !state.selectionData) return;
      const f = promoteSelectionToFloating();
      if (!f) return;
    }
    if (!state.floating) return;
    ensureOriginalQuadErased();
    state.resizingFloating = true;
    state.resizeHandle = h.dataset.handle;
    state.floatingOriginal = {
      x: state.floating.x, y: state.floating.y,
      w: state.floating.w, h: state.floating.h,
      rotation: state.floating.rotation || 0,
      quad: state.floating.quad ? state.floating.quad.map(p => ({ x: p.x, y: p.y })) : null
    };
  });
});

// Обработчик rotate handle на floating-frame
floatingRotateHandle.addEventListener('mousedown', (e) => {
  if (!state.floating) return;
  e.stopPropagation();
  e.preventDefault();
  startRotateDrag(e);
});

// Обработчик rotate handle на selection-overlay: если есть только selection (без floating),
// поднимаем её во floating и начинаем поворот сразу.
selectionRotateHandle.addEventListener('mousedown', (e) => {
  e.stopPropagation();
  e.preventDefault();
  if (!state.floating) {
    if (!state.selection || !state.selectionData) return;
    const f = promoteSelectionToFloating();
    if (!f) return;
  }
  startRotateDrag(e);
});


function startRotateDrag(e) {
  ensureOriginalQuadErased();
  const f = state.floating;
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  const { x, y } = getPos(e);
  state.rotatingFloating = true;
  state.rotationStart = {
    initialMouseAngle: Math.atan2(y - cy, x - cx),
    initialRotation: f.rotation || 0,
    centerX: cx,
    centerY: cy,
    // Запоминаем исходные quad-точки для поворота от того же центра без накопления ошибок
    origQuad: f.quad ? f.quad.map(p => ({ x: p.x, y: p.y })) : null
  };
}

// Drag угловой точки quad. НЕ стираем оригинал — corner-drag меняет форму clip-маски,
// но pickup остаётся на месте, и canvas под ним нетронут. Стирание происходит только
// при translate/scale/rotate (operations что реально двигают/трансформируют pickup).
quadCornerEls.forEach(el => {
  el.addEventListener('mousedown', (e) => {
    if (!state.floating || !state.floating.quad) return;
    e.stopPropagation();
    e.preventDefault();
    state.warpingQuad = true;
    state.warpCornerIdx = parseInt(el.dataset.corner, 10);
  });
});

// Глобальные mousemove/mouseup для всех drag-операций над floating
document.addEventListener('mousemove', (e) => {
  if (state.resizingFloating) {
    const { x, y } = getPos(e);
    state.shiftKey = e.shiftKey;
    resizeFloating(x, y);
    return;
  }
  if (state.rotatingFloating && state.floating) {
    const f = state.floating;
    const rs = state.rotationStart;
    const cx = rs.centerX, cy = rs.centerY;
    const { x, y } = getPos(e);
    const angle = Math.atan2(y - cy, x - cx);
    let next = rs.initialRotation + (angle - rs.initialMouseAngle);
    if (e.shiftKey) {
      const step = Math.PI / 12;
      next = Math.round(next / step) * step;
    }
    f.rotation = next;
    // Если активен quad — поворачиваем 4 точки от исходных позиций вокруг (cx,cy)
    if (rs.origQuad) {
      const delta = next - rs.initialRotation;
      const c = Math.cos(delta), s = Math.sin(delta);
      f.quad = rs.origQuad.map(p => ({
        x: cx + c * (p.x - cx) - s * (p.y - cy),
        y: cy + s * (p.x - cx) + c * (p.y - cy)
      }));
    }
    renderFloating();
    return;
  }
  if (state.warpingQuad && state.floating && state.floating.quad) {
    const { x, y } = getPos(e);
    state.floating.quad[state.warpCornerIdx] = { x, y };
    renderFloating();
    return;
  }
});
document.addEventListener('mouseup', () => {
  if (state.resizingFloating) {
    state.resizingFloating = false;
    state.resizeHandle = null;
  }
  if (state.rotatingFloating) {
    state.rotatingFloating = false;
    state.rotationStart = null;
  }
  if (state.warpingQuad) {
    state.warpingQuad = false;
    state.warpCornerIdx = null;
  }
  if (state.draggingFloating) {
    state.draggingFloating = false;
  }
});

// ============ ТЕКСТОВЫЙ РЕДАКТОР ============

let currentTextX = 0, currentTextY = 0;

function startTextEdit(x, y) {
  currentTextX = x;
  currentTextY = y;

  textEditor.innerHTML = '';
  textEditor.style.display = 'block';
  positionTextEditor();
  textEditor.style.color = state.color;
  textEditor.style.opacity = state.opacity;
  const fontSize = clampTextSize(document.getElementById('text-size').value);
  textEditor.style.fontSize = fontSize + 'px';
  textEditor.style.fontFamily = document.getElementById('text-font').value;
  textEditor.style.minWidth = '80px';
  textEditor.style.minHeight = (fontSize * 1.3) + 'px';

  // Применяем активные стили
  document.querySelectorAll('#text-bold, #text-italic, #text-underline').forEach(b => {
    textEditor.style[b.id === 'text-bold' ? 'fontWeight' : b.id === 'text-italic' ? 'fontStyle' : 'textDecoration'] =
      b.classList.contains('active') ?
        (b.id === 'text-bold' ? 'bold' : b.id === 'text-italic' ? 'italic' : 'underline') :
        'normal';
  });

  // Показываем тулбар
  textToolbar.classList.add('active');
  positionTextToolbar();

  // Фокус
  setTimeout(() => textEditor.focus(), 10);
}

// Редактор задаёт размеры в пикселях холста, а живёт в экранных. Позицию раньше
// умножали на зум, а размер шрифта - нет: на масштабе 200% буквы в рамке были
// вдвое мельче тех, что ложились на холст, а смена зума оставляла рамку на старом
// месте. Масштабируем элемент целиком одним transform - тогда и padding, по
// которому commitText считает смещение, остаётся в координатах холста.
function positionTextEditor() {
  const rect = canvas.getBoundingClientRect();
  const z = rect.width / canvas.width;
  textEditor.style.transformOrigin = '0 0';
  textEditor.style.transform = `scale(${z})`;
  textEditor.style.left = (currentTextX * z) + 'px';
  textEditor.style.top = (currentTextY * z) + 'px';
}

// Рамка и её тулбар держатся за одну точку холста, значит двигаются вместе.
function positionTextOverlay() {
  if (textEditor.style.display !== 'block') return;
  positionTextEditor();
  positionTextToolbar();
}

function positionTextToolbar() {
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  textToolbar.style.left = (currentTextX * scaleX) + 'px';
  textToolbar.style.top = Math.max(0, currentTextY * scaleY - 50) + 'px';
}

function commitText() {
  if (textEditor.style.display !== 'block') return;
  const text = textEditor.innerText.trim();
  if (text) {
    const fontSize = clampTextSize(document.getElementById('text-size').value);
    const fontFamily = document.getElementById('text-font').value;
    const bold = document.getElementById('text-bold').classList.contains('active');
    const italic = document.getElementById('text-italic').classList.contains('active');
    const underline = document.getElementById('text-underline').classList.contains('active');

    let fontStr = '';
    if (italic) fontStr += 'italic ';
    if (bold) fontStr += 'bold ';
    fontStr += fontSize + 'px ' + fontFamily;

    ctx.save();
    ctx.font = fontStr;
    ctx.fillStyle = state.color;
    ctx.globalAlpha = state.opacity;
    ctx.textBaseline = 'top';

    // Многострочный текст
    const lines = text.split('\n');
    const lineHeight = fontSize * 1.2;
    // textEditor padding = 4 6
    const offX = 6;
    const offY = 4;
    lines.forEach((line, i) => {
      ctx.fillText(line, currentTextX + offX, currentTextY + offY + i * lineHeight);
      if (underline) {
        const metrics = ctx.measureText(line);
        const yLine = currentTextY + offY + i * lineHeight + fontSize + 2;
        ctx.fillRect(currentTextX + offX, yLine, metrics.width, Math.max(1, fontSize / 20));
      }
    });
    ctx.restore();
    saveHistory('Текст');
  }
  textEditor.style.display = 'none';
  textEditor.innerHTML = '';
  textToolbar.classList.remove('active');
}

function toggleTextStyle(style) {
  const btn = document.getElementById('text-' + style);
  btn.classList.toggle('active');
  if (textEditor.style.display === 'block') {
    const active = btn.classList.contains('active');
    if (style === 'bold') textEditor.style.fontWeight = active ? 'bold' : 'normal';
    if (style === 'italic') textEditor.style.fontStyle = active ? 'italic' : 'normal';
    if (style === 'underline') textEditor.style.textDecoration = active ? 'underline' : 'none';
    textEditor.focus();
  }
}

// Динамическое обновление стилей во время редактирования
document.getElementById('text-font').addEventListener('change', (e) => {
  if (textEditor.style.display === 'block') {
    textEditor.style.fontFamily = e.target.value;
    textEditor.focus();
  }
});
// Зажимаем введённый размер в [8..200]. На 'input' применяем превью без записи
// обратно в поле (иначе пользователь не сможет дотипить "12": первый "1"
// мгновенно расширится до 8). На 'change' (blur/Enter) - пишем клампленное
// значение обратно в поле, чтобы оно совпадало с фактически применённым.
const TEXT_SIZE_MIN = 8;
const TEXT_SIZE_MAX = 200;
function clampTextSize(raw) {
  let v = parseInt(raw, 10);
  if (!Number.isFinite(v) || v < TEXT_SIZE_MIN) v = TEXT_SIZE_MIN;
  if (v > TEXT_SIZE_MAX) v = TEXT_SIZE_MAX;
  return v;
}
const textSizeInput = document.getElementById('text-size');
textSizeInput.addEventListener('input', (e) => {
  const v = clampTextSize(e.target.value);
  if (textEditor.style.display === 'block') {
    textEditor.style.fontSize = v + 'px';
    textEditor.focus();
  }
});
textSizeInput.addEventListener('change', (e) => {
  e.target.value = clampTextSize(e.target.value);
});

// Enter без Shift добавляет перенос строки, Escape отменяет, клик вне = применить
textEditor.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Escape') {
    e.preventDefault();
    textEditor.style.display = 'none';
    textEditor.innerHTML = '';
    textToolbar.classList.remove('active');
  }
});

// Клик вне редактора = применить текст
// e.target !== canvas: canvas onDown сам обрабатывает commit/start логику для text tool;
// без этого исключения document-level listener срабатывает после bubbling и сразу закрывает только что открытый редактор.
document.addEventListener('mousedown', (e) => {
  if (textEditor.style.display === 'block' &&
      !textEditor.contains(e.target) &&
      !textToolbar.contains(e.target) &&
      e.target !== canvas) {
    commitText();
  }
});


// Копирование выделенной области (с прозрачностью)
function copySelection() {
  // Если активен floating - копируем его. Именно в том виде, в каком он на
  // экране: через общий рендер и по фактическому габариту, иначе у повёрнутого
  // объекта в буфер уходил исходный неповёрнутый прямоугольник.
  if (state.floating) {
    const b = floatingBounds(state.floating);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(b.w));
    c.height = Math.max(1, Math.round(b.h));
    const g = c.getContext('2d');
    // drawFloatingOnto рисует в координатах холста, поэтому сдвигаем начало
    // координат в левый верхний угол габарита.
    g.translate(-b.x, -b.y);
    drawFloatingOnto(g);
    state.clipboard = c;
    return true;
  }
  if (!state.selection || state.selection.w < 2 || state.selection.h < 2) return false;
  const s = state.selection;
  // Копируем область с холста в отдельный canvas (с прозрачностью)
  const c = document.createElement('canvas');
  c.width = Math.round(s.w);
  c.height = Math.round(s.h);
  c.getContext('2d').drawImage(canvas, s.x, s.y, s.w, s.h, 0, 0, s.w, s.h);
  state.clipboard = c;
  return true;
}

// Вырезание
function cutSelection() {
  if (state.floating) {
    copySelection();
    // Именно deleteFloating: cancelFloating вернул бы пиксели на место, и
    // «вырезание» не вырезало бы ничего - объект просто прыгал обратно.
    if (deleteFloating()) saveHistory('Вырезание');
    return;
  }
  if (!copySelection()) return;
  const s = state.selection;
  // Очищаем область - прозрачность
  ctx.clearRect(s.x, s.y, s.w, s.h);
  // Восстанавливаем белый фон под вырезанным
  ctx.fillStyle = 'white';
  ctx.fillRect(s.x, s.y, s.w, s.h);
  hideSelection();
  saveHistory('Вырезание');
}

// Вставка из внутреннего буфера
function pasteFromClipboard() {
  if (!state.clipboard) return false;
  // Создаём копию, чтобы можно было вставлять многократно
  const c = document.createElement('canvas');
  c.width = state.clipboard.width;
  c.height = state.clipboard.height;
  c.getContext('2d').drawImage(state.clipboard, 0, 0);

  createFloatingFromCanvas(c, 20, 20);
  return true;
}

// Вставка из системного буфера обмена (файлы, скриншоты)
document.addEventListener('paste', (e) => {
  // Если курсор в текстовом редакторе - не перехватываем
  if (document.activeElement === textEditor) return;

  const items = e.clipboardData ? e.clipboardData.items : [];
  let handled = false;
  for (let item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          createFloatingFromImage(img, 20, 20);
          // Запомним в clipboard тоже
          const c = document.createElement('canvas');
          c.width = img.width;
          c.height = img.height;
          c.getContext('2d').drawImage(img, 0, 0);
          state.clipboard = c;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(blob);
      handled = true;
      break;
    }
  }
  if (!handled) {
    pasteFromClipboard();
  }
});

// Версия приходит из package.json через main-процесс - другого источника нет.
// Раньше «1.0» было вписано руками в статусбар и в «О программе», и к 1.6.0 оба
// места отстали на шесть релизов. В браузере без Electron версии просто нет.
let appVersion = '';

async function loadAppVersion() {
  if (!window.electronAPI || !window.electronAPI.getVersion) return;
  appVersion = await window.electronAPI.getVersion();
  const el = document.getElementById('app-version');
  if (el) el.textContent = 'Paint Pro ' + appVersion;
}

function showAbout() {
  alert('Paint Pro' + (appVersion ? ' ' + appVersion : '')
      + '\nГрафический редактор на HTML5 Canvas.');
}

function newCanvas() {
  if (!confirm('Создать новый холст? Несохранённые изменения будут потеряны.')) return;
  // Плавающий объект живёт на previewCanvas поверх холста - без сброса он
  // остался бы висеть над новым чистым листом. preCanvas обнуляем: возвращать
  // дыру некуда, холст всё равно перезаливается.
  if (state.floating) {
    state.floating.preCanvas = null;
    cancelFloating();
  }
  if (textEditor.style.display === 'block') {
    textEditor.style.display = 'none';
    textEditor.innerHTML = '';
    textToolbar.classList.remove('active');
  }
  hideSelection();
  fillWhite();
  // Новый холст - это уже не тот файл. Забываем путь и здесь, и в main-процессе,
  // иначе Ctrl+S молча перезапишет ранее открытую картинку чистым листом.
  state.currentFileName = null;
  document.title = 'Paint Pro';
  if (window.electronAPI && window.electronAPI.clearSavePath) window.electronAPI.clearSavePath();
  saveHistory('Новый холст');
  state.savedHistoryIndex = state.historyIndex;
}

// MIME-тип и качество по расширению файла. toDataURL молча падает обратно на PNG
// для неизвестного типа, поэтому список ровно тот, что Chromium умеет кодировать.
function encoderFor(filePath) {
  const ext = (filePath.match(/\.[^.\\/]*$/) || [''])[0].toLowerCase();
  if (ext === '.jpg' || ext === '.jpeg') return { mime: 'image/jpeg', quality: 0.92 };
  if (ext === '.webp') return { mime: 'image/webp', quality: 0.92 };
  return { mime: 'image/png', quality: undefined };
}

// Возвращает true, если файл действительно записан. По этому диалог закрытия
// решает, отпускать окно или оставить.
async function saveCanvas(saveAs = false) {
  // Плавающий объект живёт на previewCanvas, текст - в contenteditable поверх
  // холста. canvas.toDataURL не видит ни того, ни другого, а pick-save-path без
  // saveAs пишет в открытый файл не спрашивая: Ctrl+S сразу после «Открыть»
  // клал поверх фотографии чистый белый лист.
  if (textEditor.style.display === 'block') commitText();
  if (state.floating) commitFloating();
  const defaultName = state.currentFileName || 'paint-pro-' + Date.now() + '.png';

  // Electron: сначала спрашиваем путь, потом кодируем под его расширение.
  if (window.electronAPI) {
    const target = await window.electronAPI.pickSavePath(defaultName, saveAs);
    if (!target || target.canceled || !target.filePath) return false;
    if (target.changed) {
      alert('Этот формат записывать нельзя, файл сохранён как PNG:\n' + target.filePath);
    }
    const { mime, quality } = encoderFor(target.filePath);
    const dataUrl = canvas.toDataURL(mime, quality);
    const result = await window.electronAPI.writeImage(target.filePath, dataUrl);
    if (result && result.success) {
      state.currentFileName = result.filePath.split(/[\\/]/).pop();
      document.title = 'Paint Pro — ' + state.currentFileName;
      state.savedHistoryIndex = state.historyIndex;
      return true;
    }
    if (result && result.error) alert('Ошибка сохранения: ' + result.error);
    return false;
  }

  // Браузер: классическое скачивание
  const link = document.createElement('a');
  link.download = defaultName;
  link.href = canvas.toDataURL('image/png');
  link.click();
  state.savedHistoryIndex = state.historyIndex;
  return true;
}

// ============ НЕСОХРАНЁННАЯ РАБОТА ============
// Закрытие окна молча теряло рисунок: в WPF-версии вопрос появился ещё в 1.2.0,
// сюда правка не доехала. Признак изменений живёт здесь, а не копией в
// main-процессе - иначе его пришлось бы синхронизировать из десятка мест.
function isDirty() {
  return state.historyIndex !== state.savedHistoryIndex
      || !!state.floating
      // Именно набранный текст, а не открытая рамка: клик инструментом «Текст»
      // открывает пустой редактор, и сам по себе он ничего не меняет.
      || (textEditor.style.display === 'block' && textEditor.innerText.trim() !== '');
}

// Ответ на запрос закрытия от main-процесса.
async function handleCloseRequest() {
  if (!isDirty()) { window.electronAPI.confirmClose(); return; }
  // Три кнопки вместо confirm(): «не сохранять» и «отмена» - разные вещи.
  const answer = await window.electronAPI.askUnsaved();
  if (answer === 2) return;                                  // отмена
  if (answer === 1) { window.electronAPI.confirmClose(); return; }  // не сохранять
  if (await saveCanvas(false)) window.electronAPI.confirmClose();
}

function clearCanvas() {
  if (!confirm('Очистить холст?')) return;
  // Сначала сбрасываем floating — иначе очистка визуально не сработает: он живёт
  // на previewCanvas поверх холста и через fillWhite не убирается. Именно
  // deleteFloating, а не commitFloating: применять pickup перед заливкой белым
  // бессмысленно, а cancelFloating вернул бы стёртое обратно.
  deleteFloating();
  hideSelection();
  fillWhite();
  saveHistory('Очистка холста');
}

function resizeCanvas() {
  const w = parseInt(document.getElementById('width-input').value);
  const h = parseInt(document.getElementById('height-input').value);
  if (!w || !h || w < 10 || h < 10) return;
  if (!canvasSizeAllowed(w, h)) {
    alert('Размер должен быть от 10 до ' + MAX_CANVAS_SIDE + ' по каждой стороне\n'
        + 'и не больше ' + (MAX_CANVAS_PIXELS / 1000000) + ' млн пикселей всего.');
    updateCanvasInfo();
    return;
  }
  if (state.floating) commitFloating();
  hideSelection();
  const old = document.createElement('canvas');
  old.width = canvas.width;
  old.height = canvas.height;
  old.getContext('2d').drawImage(canvas, 0, 0);
  setCanvasSize(w, h);
  fillWhite();
  ctx.drawImage(old, 0, 0);
  updateCanvasInfo();
  saveHistory('Размер холста');
}

function rotateCanvas() {
  if (state.floating) commitFloating();
  // Рамка выделения осталась бы висеть на старом месте, а selectionData
  // указывал бы на пиксели, которых там уже нет.
  hideSelection();
  const tmp = document.createElement('canvas');
  tmp.width = canvas.height;
  tmp.height = canvas.width;
  const tctx = tmp.getContext('2d');
  tctx.translate(tmp.width / 2, tmp.height / 2);
  tctx.rotate(Math.PI / 2);
  tctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  setCanvasSize(tmp.width, tmp.height);
  ctx.drawImage(tmp, 0, 0);
  updateCanvasInfo();
  saveHistory('Поворот 90°');
}

function flipH() {
  if (state.floating) commitFloating();
  // Рамка выделения осталась бы висеть на старом месте, а selectionData
  // указывал бы на пиксели, которых там уже нет.
  hideSelection();
  // Снимок текущего холста в офскрин, потом рисуем его зеркально обратно.
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width;
  tmp.height = canvas.height;
  tmp.getContext('2d').drawImage(canvas, 0, 0);
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(tmp, 0, 0);
  ctx.restore();
  saveHistory('Отражение ↔');
}

function flipV() {
  if (state.floating) commitFloating();
  // Рамка выделения осталась бы висеть на старом месте, а selectionData
  // указывал бы на пиксели, которых там уже нет.
  hideSelection();
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width;
  tmp.height = canvas.height;
  tmp.getContext('2d').drawImage(canvas, 0, 0);
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.translate(0, canvas.height);
  ctx.scale(1, -1);
  ctx.drawImage(tmp, 0, 0);
  ctx.restore();
  saveHistory('Отражение ↕');
}

// «Выделить всё». Одна функция на три вызова: пункт меню, Ctrl+A и действие из
// main-процесса — раньше это был трижды скопированный кусок, и правки в него
// приходилось вносить в три места.
function selectAll() {
  document.querySelector('[data-tool="select"]').click();
  commitSelection();
  state.selection = { x: 0, y: 0, w: canvas.width, h: canvas.height };
  state.selectionData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  updateSelectionOverlay();
  document.getElementById('sel-size').textContent = `${canvas.width} × ${canvas.height}`;
}

function updateCanvasInfo() {
  document.getElementById('info-width').textContent = canvas.width + ' px';
  document.getElementById('info-height').textContent = canvas.height + ' px';
  document.getElementById('width-input').value = canvas.width;
  document.getElementById('height-input').value = canvas.height;
}

// Горячие клавиши
document.addEventListener('keydown', (e) => {
  // Не только INPUT: выпадающий список шрифта - это SELECT, и нажатие "e" в нём
  // переключало инструмент на ластик вместо выбора шрифта на букву "e".
  const tn = e.target.tagName;
  if (tn === 'INPUT' || tn === 'SELECT' || tn === 'TEXTAREA' || e.target.isContentEditable) return;
  // Не перехватываем хоткеи при редактировании текста
  if (e.target === textEditor || textEditor.contains(e.target)) {
    // Разрешаем только Escape - он обработан в keydown самого редактора
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    // С зажатым Shift e.key приходит заглавной. Сравнение с маленькой буквой
    // убивало все шифтованные сочетания: «Сохранить как… Ctrl ⇧ S» стояло в меню,
    // но не работало. Ctrl+N там же стоял и не был заведён вовсе.
    const k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (k === 'y') { e.preventDefault(); redo(); }
    else if (k === 's') { e.preventDefault(); saveCanvas(e.shiftKey); }
    else if (k === 'n') { e.preventDefault(); newCanvas(); }
    else if (k === 'c') {
      if ((state.selection || state.floating) && copySelection()) e.preventDefault();
    }
    else if (k === 'x') {
      if (state.selection || state.floating) { e.preventDefault(); cutSelection(); }
    }
    else if (k === 'a') { e.preventDefault(); selectAll(); }
    else if (k === '=' || k === '+') { e.preventDefault(); zoomIn(); }
    else if (k === '-' || k === '_') { e.preventDefault(); zoomOut(); }
    else if (k === '0') { e.preventDefault(); zoomReset(); }
    return;
  }
  const map = {s:'select', h:'hand', p:'pencil', b:'brush', m:'marker', e:'eraser', g:'fill', i:'picker', t:'text', q:'quad'};
  if (map[e.key.toLowerCase()]) {
    document.querySelector(`[data-tool="${map[e.key.toLowerCase()]}"]`).click();
  }
  // [ / ] — поворот выделения на ±90° (Shift = ±15°). Если есть selection — поднимаем в floating.
  // Для quad-полигона поворачиваем и f.rotation (для pickup), и 4 точки вокруг центра bbox.
  if (e.key === '[' || e.key === ']') {
    if (!state.floating && state.selection && state.selectionData) {
      promoteSelectionToFloating();
    }
    if (state.floating) {
      e.preventDefault();
      ensureOriginalQuadErased();
      const f = state.floating;
      const step = e.shiftKey ? Math.PI / 12 : Math.PI / 2;
      const delta = (e.key === ']' ? step : -step);
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      f.rotation = (f.rotation || 0) + delta;
      if (f.quad) {
        const c = Math.cos(delta), s = Math.sin(delta);
        f.quad = f.quad.map(p => ({
          x: cx + c * (p.x - cx) - s * (p.y - cy),
          y: cy + s * (p.x - cx) + c * (p.y - cy)
        }));
      }
      renderFloating();
    }
  }
  if (e.key === 'Delete') {
    if (state.floating) {
      // Удаление должно оставить дыру, а не вернуть объект на место:
      // cancelFloating откатывал подъём, и Delete визуально не делал ничего.
      e.preventDefault();
      if (deleteFloating()) saveHistory('Удаление');
      return;
    }
    if (state.selection) {
      ctx.fillStyle = 'white';
      ctx.fillRect(state.selection.x, state.selection.y, state.selection.w, state.selection.h);
      hideSelection();
      saveHistory('Удаление');
    }
  }
  if (e.key === 'Escape') {
    if (state.floating) {
      // Escape отменяет подъём и возвращает пиксели на место, применяет Enter.
      // Раньше Escape тоже применял: способа отказаться от подъёма не было вовсе,
      // хотя cancelFloating для этого и написан. В WPF-версии Escape отменяет
      // с самого начала (инвариант 11 в README).
      e.preventDefault();
      cancelFloating();
      return;
    }
    commitSelection();
    hideSelection();
    cropControls.style.display = 'none';
    state.cropping = false;
    if (textEditor.style.display === 'block') {
      textEditor.style.display = 'none';
      textEditor.innerHTML = '';
      textToolbar.classList.remove('active');
    }
  }
  if (e.key === 'Enter' && state.floating && !e.ctrlKey) {
    // Enter при плавающем = применить
    if (document.activeElement !== textEditor) {
      commitFloating();
    }
  }
});

// Перемасштабирование overlay при скролле
document.getElementById('canvas-area').addEventListener('scroll', updateOverlays);
window.addEventListener('resize', updateOverlays);

// ============ МАСШТАБИРОВАНИЕ ХОЛСТА (RESIZE) ============
// Перетаскивание правой/нижней/угловой ручки меняет размер холста визуально.
// Контент сохраняется, пустое добавленное пространство заливается белым.

const resizePreview = document.getElementById('resize-preview');
const resizeTooltip = document.getElementById('resize-tooltip');

let canvasResizeState = null;

function startCanvasResize(direction, e) {
  e.preventDefault();
  e.stopPropagation();
  // Применить floating и текст, если активны
  if (state.floating) commitFloating();
  if (textEditor.style.display === 'block') commitText();

  canvasResizeState = {
    direction: direction,
    startMouseX: e.clientX,
    startMouseY: e.clientY,
    startW: canvas.width,
    startH: canvas.height,
    curW: canvas.width,
    curH: canvas.height
  };

  // Показываем превью - размер текущего холста
  const rect = canvas.getBoundingClientRect();
  resizePreview.style.display = 'block';
  resizePreview.style.width = rect.width + 'px';
  resizePreview.style.height = rect.height + 'px';

  resizeTooltip.style.display = 'block';
  updateResizeTooltip(e, canvas.width, canvas.height);

  document.body.style.cursor = direction === 'right' ? 'ew-resize' :
                                direction === 'bottom' ? 'ns-resize' : 'nwse-resize';
}

function onCanvasResizeMove(e) {
  if (!canvasResizeState) return;
  e.preventDefault();

  const dx = e.clientX - canvasResizeState.startMouseX;
  const dy = e.clientY - canvasResizeState.startMouseY;
  // Учитываем текущий zoom - тянем в "экранных" пикселях, но меняем реальный размер холста
  const scale = state.zoom || 1;

  let newW = canvasResizeState.startW;
  let newH = canvasResizeState.startH;

  if (canvasResizeState.direction === 'right' || canvasResizeState.direction === 'corner') {
    newW = Math.max(50, Math.round(canvasResizeState.startW + dx / scale));
  }
  if (canvasResizeState.direction === 'bottom' || canvasResizeState.direction === 'corner') {
    newH = Math.max(50, Math.round(canvasResizeState.startH + dy / scale));
  }

  // Shift = пропорции
  if (e.shiftKey && canvasResizeState.direction === 'corner') {
    const ratio = canvasResizeState.startW / canvasResizeState.startH;
    if (newW / newH > ratio) newW = Math.round(newH * ratio);
    else newH = Math.round(newW / ratio);
  }

  ({ w: newW, h: newH } = clampCanvasSize(newW, newH));

  canvasResizeState.curW = newW;
  canvasResizeState.curH = newH;

  // Обновляем превью-рамку (в экранных пикселях)
  resizePreview.style.width = (newW * scale) + 'px';
  resizePreview.style.height = (newH * scale) + 'px';

  updateResizeTooltip(e, newW, newH);
}

function updateResizeTooltip(e, w, h) {
  resizeTooltip.textContent = `${w} × ${h} px`;
  resizeTooltip.style.left = (e.clientX + 16) + 'px';
  resizeTooltip.style.top = (e.clientY + 16) + 'px';
}

function finishCanvasResize() {
  if (!canvasResizeState) return;
  const newW = canvasResizeState.curW;
  const newH = canvasResizeState.curH;
  const oldW = canvasResizeState.startW;
  const oldH = canvasResizeState.startH;

  if (newW !== oldW || newH !== oldH) {
    // Сохраняем текущий контент
    const old = document.createElement('canvas');
    old.width = oldW;
    old.height = oldH;
    old.getContext('2d').drawImage(canvas, 0, 0);

    setCanvasSize(newW, newH);

    // Заливаем белым (новое пространство)
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, newW, newH);
    // Рисуем старый контент поверх (если уменьшили - обрежется)
    ctx.drawImage(old, 0, 0);

    updateCanvasInfo();
    saveHistory('Размер холста');
  }

  canvasResizeState = null;
  resizePreview.style.display = 'none';
  resizeTooltip.style.display = 'none';
  document.body.style.cursor = '';
  applyZoom();
}

// Навешиваем обработчики на три ручки
['right', 'bottom', 'corner'].forEach(dir => {
  const el = document.getElementById('canvas-handle-' + dir);
  el.addEventListener('mousedown', (e) => startCanvasResize(dir, e));
});

document.addEventListener('mousemove', onCanvasResizeMove);
document.addEventListener('mouseup', finishCanvasResize);

// ============ HAND TOOL (перетаскивание холста) ============
state.panX = 0;
state.panY = 0;

function applyPan() {
  wrapper.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
  updateOverlays();
}

function resetPan() {
  state.panX = 0;
  state.panY = 0;
  applyPan();
}

(function() {
  const area = document.getElementById('canvas-area');
  let panning = false;
  let startMouseX = 0, startMouseY = 0;
  let startPanX = 0, startPanY = 0;
  let startScrollX = 0, startScrollY = 0;

  area.addEventListener('mousedown', (e) => {
    if (state.tool !== 'hand') return;
    if (e.button !== 0) return;
    panning = true;
    startMouseX = e.clientX;
    startMouseY = e.clientY;
    startPanX = state.panX;
    startPanY = state.panY;
    startScrollX = area.scrollLeft;
    startScrollY = area.scrollTop;
    canvas.classList.add('panning');
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!panning) return;
    const dx = e.clientX - startMouseX;
    const dy = e.clientY - startMouseY;
    // Сначала пытаемся прокрутить — если есть overflow
    const maxScrollX = area.scrollWidth - area.clientWidth;
    const maxScrollY = area.scrollHeight - area.clientHeight;
    let newScrollX = startScrollX - dx;
    let newScrollY = startScrollY - dy;
    let clampedX = Math.max(0, Math.min(maxScrollX, newScrollX));
    let clampedY = Math.max(0, Math.min(maxScrollY, newScrollY));
    area.scrollLeft = clampedX;
    area.scrollTop  = clampedY;
    // Остаток — двигаем через transform
    const overshootX = newScrollX - clampedX; // отрицательное если ушли влево, положительное если вправо
    const overshootY = newScrollY - clampedY;
    state.panX = startPanX - overshootX;
    state.panY = startPanY - overshootY;
    applyPan();
  });

  document.addEventListener('mouseup', () => {
    if (!panning) return;
    panning = false;
    canvas.classList.remove('panning');
  });
})();

// ============ ZOOM (масштаб отображения холста) ============
// Меняет CSS transform canvas-wrapper, не трогает реальные размеры

state.zoom = 1;
const ZOOM_STEPS = [0.1, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4, 6, 8];

function applyZoom() {
  // setCanvasSize зовёт applyZoom и может сработать раньше, чем ниже по файлу
  // выставится state.zoom — без запасной единицы размеры ушли бы в NaN.
  const z = state.zoom || 1;
  // Используем transform: scale на canvas и preview-canvas, но wrapper "рос бы" размером
  // Проще - меняем CSS ширину/высоту canvas элементов
  canvas.style.width = (canvas.width * z) + 'px';
  canvas.style.height = (canvas.height * z) + 'px';
  previewCanvas.style.width = (canvas.width * z) + 'px';
  previewCanvas.style.height = (canvas.height * z) + 'px';
  document.getElementById('zoom-display').textContent = Math.round(z * 100) + '%';
  updateOverlays();
  // Курсор-кружок зависит от зума (пиксели холста × зум = пиксели экрана)
  if (typeof updateBrushCursor === 'function') updateBrushCursor();
}

function zoomIn() {
  const cur = state.zoom;
  const next = ZOOM_STEPS.find(s => s > cur + 0.001);
  if (next) { state.zoom = next; applyZoom(); }
}

function zoomOut() {
  const cur = state.zoom;
  const reversed = [...ZOOM_STEPS].reverse();
  const next = reversed.find(s => s < cur - 0.001);
  if (next) { state.zoom = next; applyZoom(); }
}

function zoomReset() {
  state.zoom = 1;
  applyZoom();
}

// Ctrl + колёсико мыши = зум
document.getElementById('canvas-area').addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
  }
}, { passive: false });

// ============ ИНТЕГРАЦИЯ С ELECTRON ============
if (window.electronAPI) {
  // Загружаем изображение из dataUrl (при открытии через меню, ассоциацию, drag&drop)
  function loadImageFromDataUrl(dataUrl, fileName) {
    const img = new Image();
    img.onload = () => {
      // Если картинка больше холста - расширяем. Прежний код сразу заливал
      // всё белым, и уже нарисованное пропадало молча и безвозвратно: записи
      // в историю на это не было. Переносим старое содержимое, как это делает
      // ветка загрузки через <input type=file>.
      if (img.width > canvas.width || img.height > canvas.height) {
        const old = document.createElement('canvas');
        old.width = canvas.width;
        old.height = canvas.height;
        old.getContext('2d').drawImage(canvas, 0, 0);
        setCanvasSize(Math.max(canvas.width, img.width), Math.max(canvas.height, img.height));
        fillWhite();
        ctx.drawImage(old, 0, 0);
        updateCanvasInfo();
        saveHistory('Расширение холста');
      }
      createFloatingFromImage(img, 20, 20);
      if (fileName) {
        state.currentFileName = fileName;
        document.title = 'Paint Pro — ' + fileName;
      }
    };
    img.src = dataUrl;
  }

  // Получаем файл через меню "Файл → Открыть"
  window.electronAPI.onOpenFile((data) => {
    if (data && data.dataUrl) {
      loadImageFromDataUrl(data.dataUrl, data.fileName);
    }
  });

  // Обрабатываем действия нативного меню
  window.electronAPI.onMenuAction((action) => {
    switch (action) {
      case 'new': newCanvas(); break;
      case 'save': saveCanvas(false); break;
      case 'save-as': saveCanvas(true); break;
      case 'undo': undo(); break;
      case 'redo': redo(); break;
      case 'copy':
        if (state.selection || state.floating) copySelection();
        break;
      case 'cut':
        if (state.selection || state.floating) cutSelection();
        break;
      case 'paste':
        pasteFromClipboard();
        break;
      case 'select-all': selectAll(); break;
      case 'request-close': handleCloseRequest(); break;
      case 'zoom-in': zoomIn(); break;
      case 'zoom-out': zoomOut(); break;
      case 'zoom-reset': zoomReset(); break;
    }
  });

  // Drag & Drop файлов из проводника.
  // dragenter/dragleave стреляют и при переходе между дочерними элементами, а не
  // только на границе окна. Поэтому считаем глубину вложенности: рамка гаснет,
  // когда счётчик вернулся в ноль, а не на первом же dragleave над кнопкой.
  let dragDepth = 0;
  function showDropHint() {
    document.body.style.outline = '3px dashed var(--accent)';
    document.body.style.outlineOffset = '-6px';
  }
  function hideDropHint() {
    dragDepth = 0;
    document.body.style.outline = '';
  }

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    showDropHint();
  });

  document.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    showDropHint();
  });

  document.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) hideDropHint();
  });

  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    hideDropHint();

    const files = Array.from(e.dataTransfer.files || []);
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      const filePath = window.electronAPI.getFilePath(file);
      if (filePath) {
        const result = await window.electronAPI.readDroppedFile(filePath);
        if (result && result.dataUrl) {
          loadImageFromDataUrl(result.dataUrl, result.fileName);
          break; // Открываем только первый файл
        }
      } else {
        // Fallback через FileReader
        const reader = new FileReader();
        reader.onload = (ev) => loadImageFromDataUrl(ev.target.result, file.name);
        reader.readAsDataURL(file);
        break;
      }
    }
  });

  // Убираем обычное поведение Ctrl+O (браузерный диалог) - заменяем на Electron
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      window.electronAPI.openFileDialog().then(data => {
        if (data && data.dataUrl) loadImageFromDataUrl(data.dataUrl, data.fileName);
      });
    }
  });

  // Перекрываем пункт «Открыть…» в меню «Файл»
  const openBtn = document.querySelector('.mb-dd-item[onclick*="file-input"]');
  if (openBtn) {
    openBtn.onclick = async () => {
      const data = await window.electronAPI.openFileDialog();
      if (data && data.dataUrl) loadImageFromDataUrl(data.dataUrl, data.fileName);
    };
  }
}

setColor('#000000');
applyZoom();
loadAppVersion();
// Начальный инструмент - карандаш (выставлен в HTML через class="active"),
// показываем соответствующий курсор-круг.
canvas.className = 'tool-' + state.tool;
updateBrushCursor();

// ============ macOS MENU BAR — DROPDOWNS + ЧАСЫ ============
(function setupMenuBar() {
  const menus = document.querySelectorAll('.mb-menu');
  if (!menus.length) return;

  function closeAll() {
    menus.forEach(m => m.classList.remove('open'));
  }

  menus.forEach(menu => {
    const btn = menu.querySelector('.mb-item');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = menu.classList.contains('open');
      closeAll();
      if (!wasOpen) menu.classList.add('open');
    });
    btn.addEventListener('mouseenter', () => {
      // Если уже открыто другое меню — переключаемся, как в macOS
      const anyOpen = document.querySelector('.mb-menu.open');
      if (anyOpen && anyOpen !== menu) {
        closeAll();
        menu.classList.add('open');
      }
    });
  });

  // Клик по пункту dropdown — закрыть
  document.querySelectorAll('.mb-dd-item').forEach(it => {
    it.addEventListener('click', () => setTimeout(closeAll, 0));
  });

  // Клик вне меню / Escape — закрыть
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.mb-menu')) closeAll();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAll();
  });

  // Часы справа
  const timeEl = document.getElementById('mb-time');
  function tick() {
    if (!timeEl) return;
    const d = new Date();
    const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    timeEl.textContent = `${days[d.getDay()]}  ${hh}:${mm}`;
  }
  tick();
  setInterval(tick, 30000);
})();

// ============ RIPPLE НА КНОПКАХ ============
(function setupRipples() {
  function spawnRipple(target, clientX, clientY) {
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.4;
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    r.style.left = (clientX - rect.left) + 'px';
    r.style.top  = (clientY - rect.top)  + 'px';
    // НЕ ставим overflow:hidden на target — это бы обрезало тултипы (.tool::after).
    // Ripple имеет мягкий radial-fade, лёгкий выход за края выглядит как glow.
    const prevPos = target.style.position;
    if (getComputedStyle(target).position === 'static') target.style.position = 'relative';
    target.appendChild(r);

    setTimeout(() => {
      if (r.parentNode) r.remove();
      if (prevPos === '') target.style.position = prevPos;
    }, 700);
  }

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const t = e.target.closest('.tool, .zoom-btn, .sidebar button, .text-toolbar button, .crop-controls button, .mb-dd-item, .menu-btn, .mb-item');
    if (!t) return;
    // Не даём кнопкам забирать фокус — иначе горячие клавиши уходят на нажатую
    // ранее кнопку и не доходят до document-level обработчика.
    e.preventDefault();
    spawnRipple(t, e.clientX, e.clientY);
  });
})();

// ============ ТУЛТИПЫ (data-tip) ============
(function setupTooltips() {
  const tip = document.getElementById('tip');
  if (!tip) return;
  let current = null;

  function show(target) {
    const text = target.getAttribute('data-tip');
    if (!text) return;
    current = target;
    tip.textContent = text;
    tip.classList.add('show');
    position(target);
  }
  function position(target) {
    const r = target.getBoundingClientRect();
    const left = r.left + r.width / 2;
    const top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hide() {
    current = null;
    tip.classList.remove('show');
  }

  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-tip]');
    if (!t) return;
    if (t === current) return;
    show(t);
  });
  document.addEventListener('mouseout', (e) => {
    const t = e.target.closest('[data-tip]');
    if (!t) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]');
    if (to === t) return;
    hide();
  });
  // Прячем при кликах/прокрутке/смене окна — чтобы не «висел» над открытым меню
  document.addEventListener('mousedown', hide, true);
  window.addEventListener('scroll', hide, true);
  window.addEventListener('blur', hide);
})();
</script>
