<!-- Общий тултип (рендерится на body, не упирается в z-index панелей) -->
<div id="tip"></div>

<script>
const canvas = document.getElementById('canvas');
// ВНИМАНИЕ: ctx - это контекст ВИДИМОГО холста, то есть СБОРКИ слоёв. Рисовать в него
// нельзя: следующая же сборка сотрёт нарисованное. Инструменты рисуют в lctx() - контекст
// активного слоя. Читать из ctx можно и нужно: пипетка, статусбар и лента смотрят именно
// на то, что видит пользователь.
const ctx = canvas.getContext('2d');
const previewCanvas = document.getElementById('preview-canvas');
const previewCtx = previewCanvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');
const selOverlay = document.getElementById('selection-overlay');
const cropControls = document.getElementById('crop-controls');
const floatingFrame = document.getElementById('floating-frame');
const floatingRotateHandle = document.getElementById('floating-rotate');
const selectionRotateHandle = document.getElementById('selection-rotate');
const quadOutline = document.getElementById('quad-outline');
const quadOutlinePoly = quadOutline.querySelector('polygon');
const quadCornerEls = [0,1,2,3].map(i => document.getElementById('quad-corner-' + i));
const textEditor = document.getElementById('text-editor');
const textToolbar = document.getElementById('text-toolbar');

// Состояние
let state = {
  tool: 'pencil',
  color: '#000000',
  size: 4,
  brushSize: 4,
  eraserSize: 20,
  opacity: 1,
  fillMode: 'outline',
  drawing: false,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  // Стопка слоёв и номер активного. [0] - бумага документа.
  layers: [],
  activeLayer: 0,
  // Слой, на котором НАЧАЛСЯ текущий жест. Жест начинается на mousedown, а исполняется
  // на mouseup, и между этими мгновениями слой успевает смениться: панель под рукой всё
  // время, а у окна ввода текста между кликом и ответом проходит сколько угодно.
  // В WPF-версии это чинили в 1.17.0.
  strokeLayerId: null,
  // Точки текущего жеста в координатах холста. Нужны, чтобы правку можно было
  // ПОВТОРИТЬ, а не только отменить: на этом стоит выключатель записи в ленте.
  strokePoints: null,
  // Размер у каждой точки штриха: колесо меняет его посреди штриха (1.17.0).
  strokeSizes: null,
  strokeSeed: null,       // зерно пучка ворсинок текущего мазка кисти
  strokeBristles: null,
  nextBrushSeed: null,    // для проверок: зерно следующего мазка кисти
  // Слой, под который сейчас подкладывается превью мазка (см. composite).
  previewLayerId: null,
  history: [],
  historyIndex: -1,
  // Позиция в истории на момент последнего сохранения. Сравнение с historyIndex
  // и даёт признак несохранённой работы - см. isDirty().
  savedHistoryIndex: 0,
  // Набор выключенных записей на момент сохранения - см. isDirty().
  savedDisabledKey: '',
  // Кадр истории грузится через img.onload, то есть асинхронно: между Ctrl+Z и
  // появлением картинки на холсте лежат пиксели прежнего состояния - см. restoreHistory().
  restoring: false,
  selection: null, // {x, y, w, h}
  // Признак «рамка дорисована и годится для перемещения», а НЕ пиксели. Когда-то здесь
  // лежал ImageData, потом читать его перестали - а снимать не перестали: «Выделить всё»
  // копировало под этот признак весь холст, обычное выделение - свою область. Замер
  // расхода это и показал; чтением кода такое почти не видно.
  selectionReady: false,
  cropping: false,
  cropRect: null,
  clipboard: null,
  // Плавающий объект на холсте (картинка или текст) - поддерживает прозрачность
  // {type: 'image'|'text', canvas: HTMLCanvasElement, x, y, w, h, ...textProps}
  floating: null,
  draggingFloating: false,
  resizingFloating: false,
  resizeHandle: null,
  dragOffsetX: 0,
  dragOffsetY: 0,
  // Поворот floating-объекта: угол в радианах живёт прямо в state.floating.rotation,
  // здесь только эпhemerа сессии drag'а: исходные углы и rotation на момент mousedown.
  rotatingFloating: false,
  rotationStart: null, // {initialMouseAngle, initialRotation}
  // Quad-warp (perspective): state.floating.quad === [{x,y}×4] в координатах канваса,
  // tl/tr/br/bl (по часовой). Если quad != null — floating рендерится с clip-маской.
  warpingQuad: false,
  warpCornerIdx: null,
  warpStart: null,
  // Двухфазный quad-инструмент: phase 1 — рисуем bbox прямоугольником, phase 2 — таскаем углы.
  quadPhase: 'idle' // 'idle' | 'drawing' | 'warping'
};

// Стойкий номер записи ленты. Место в ленте не годится: переполнение выбрасывает начало,
// и все места съезжают - см. disabledKey().
let historySeq = 0;

// Глубина истории отмен. Снимки — полные PNG холста, поэтому не задираем до тысяч,
// но 150 шагов — это «намного длиннее» прежних 50.
const MAX_HISTORY = 150;

// Потолок памяти под историю. Одной глубины мало: снимок холста 4000×3000 - это
// единицы мегабайт в base64, и полтораста таких кадров кладут вкладку задолго до
// того, как счётчик шагов дойдёт до 150. В WPF-версии такой потолок есть с самого
// начала (HistoryManager.MaxBytes), сюда он не доехал.
const MAX_HISTORY_BYTES = 512 * 1024 * 1024;

// Размер чистого листа. Новый документ - это чистый лист, а не старый, залитый белым:
// после фотографии 4000x3000 «Создать» давал такой же огромный лист, а после кадрирования
// до марки - лоскут в полсотни пикселей. В WPF-версии это починено в 1.18.0.
const DEFAULT_CANVAS_W = 900;
const DEFAULT_CANVAS_H = 600;

// ============ СЛОИ ============
// Слой - это отдельный холст того же размера, что документ. Видимый холст - их сборка,
// и рисовать в него нельзя (см. оговорку у ctx). Слой номер ноль - БУМАГА документа:
// на ней ластик красит белым, а не вычитает, ей достаётся фон при смене размера, и
// удалить её нельзя. На этом держится с полдюжины правил, как и в WPF-версии.

let layerSeq = 0;

function makeLayerCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function makeLayer(name, w, h) {
  return {
    id: ++layerSeq,
    // Номер в имени берём из счётчика, а не из числа слоёв: число уменьшается при
    // удалении, и «добавили два, удалили первый, добавили ещё» давало два одинаковых
    // имени. В WPF-версии это починено в 1.15.0.
    name: name || ('Слой ' + layerSeq),
    visible: true,
    opacity: 1,
    canvas: makeLayerCanvas(w, h)
  };
}

/** Активный слой - тот, куда ложится краска. */
function activeLayer() {
  if (state.activeLayer >= state.layers.length) state.activeLayer = state.layers.length - 1;
  if (state.activeLayer < 0) state.activeLayer = 0;
  return state.layers[state.activeLayer];
}

/** Контекст активного слоя. */
function lctx() {
  return activeLayer().canvas.getContext('2d');
}

/** Слой текущего жеста: тот, на котором нажали кнопку мыши. */
function gestureLayer() {
  if (state.strokeLayerId != null) {
    const l = state.layers.find((x) => x.id === state.strokeLayerId);
    if (l) return l;
  }
  return activeLayer();
}

/** Контекст слоя текущего жеста. Сюда идёт всё, что рисуют инструменты. */
function gctx() {
  return gestureLayer().canvas.getContext('2d');
}

/** Бумага ли слой, на котором идёт жест: от этого зависит, красит ластик или вычитает. */
function isPaperGesture() {
  return state.layers.length > 0 && state.layers[0].id === gestureLayer().id;
}

/**
 * Контекст слоя по его номеру. Слой могли удалить, пока объект был в руках, - тогда
 * возвращаем активный, но это последнее средство: в WPF-версии подстановка активного
 * вместо исчезнувшего портила соседний слой (1.17.0), поэтому удаление слоя, с которого
 * подняли, сначала прижимает поднятое.
 */
function layerCtxById(id) {
  const l = state.layers.find((x) => x.id === id) || activeLayer();
  return l.canvas.getContext('2d');
}

function isPaperLayerId(id) {
  return state.layers.length > 0 && state.layers[0].id === id;
}

// Панель слоёв рисуется ниже; здесь - операции над стопкой.

// Потолок на стопку. Каждый слой - целый холст, и без предела «Добавить слой» на снимке
// 4000x3000 съедает по 48 МБ за нажатие, пока приложение не умрёт. Считать надо не число
// слоёв, а ПЛОЩАДЬ: на маленьком документе сто слоёв безобидны, на большом смертельны.
// В WPF-версии тот же потолок появился в 1.22.0.
const MAX_LAYER_PIXELS = 192000000;
const MAX_LAYER_COUNT = 100;

function maxLayersFor(w, h) {
  const area = Math.max(1, w * h);
  return Math.max(1, Math.min(MAX_LAYER_COUNT, Math.floor(MAX_LAYER_PIXELS / area)));
}

/** Добавить слой над активным и сделать его активным. */
function addLayer() {
  const limit = maxLayersFor(canvas.width, canvas.height);
  if (state.layers.length >= limit) {
    hint('Больше слоёв на холсте такого размера не поместится: предел ' + limit + '.');
    return null;
  }
  if (state.floating) commitFloating();
  hideSelection();
  const l = makeLayer(null, canvas.width, canvas.height);
  state.layers.splice(state.activeLayer + 1, 0, l);
  state.activeLayer = state.activeLayer + 1;
  composite();
  renderLayersPanel();
  saveHistory('Добавление слоя');
  return l;
}

/** Удалить слой. Бумагу удалить нельзя - на ней держится с полдюжины правил. */
function removeLayer(index) {
  if (index == null) index = state.activeLayer;
  // Порядок проверок обратный очевидному, и намеренно: у нового документа слой ровно
  // один, он же бумага, и проверка «в стопке один слой» съедала бы единственный случай,
  // когда объяснение про бумагу вообще срабатывает. В WPF-версии это 1.20.0.
  if (index === 0) {
    hint('Бумагу документа удалить нельзя: на ней держится фон и ластик.');
    return false;
  }
  if (state.layers.length <= 1) {
    hint('Последний слой удалить нельзя.');
    return false;
  }
  // Объект в руках подняли С КАКОГО-ТО слоя. Если удалить именно его, вернуть пиксели
  // будет некуда, и подстановка соседнего испортила бы чужой слой (WPF, 1.17.0).
  if (state.floating) commitFloating();
  hideSelection();
  state.layers.splice(index, 1);
  if (state.activeLayer >= state.layers.length) state.activeLayer = state.layers.length - 1;
  composite();
  renderLayersPanel();
  saveHistory('Удаление слоя');
  return true;
}

function setActiveLayer(index) {
  if (index < 0 || index >= state.layers.length || index === state.activeLayer) return;
  // Жест начинается на одном слое, а исполняется на отпускании: если слой сменить
  // посреди штриха, краска ушла бы не туда, где её начали класть.
  if (state.drawing) {
    hint('Слой не меняется посреди жеста: отпустите кнопку мыши.');
    return;
  }
  if (state.floating) commitFloating();
  state.activeLayer = index;
  // Смена слоя - не правка документа, записи в ленте ей делать нечего. Но позиция, на
  // которой стоит курсор, обязана помнить, где была кисть: иначе отмена возвращает не
  // тот слой, и пользователь продолжает рисовать не там, где рисовал минуту назад.
  // В WPF-версии это 1.18.0.
  const cur = state.history[state.historyIndex];
  if (cur) {
    cur.active = index;
    cur.key = layersKey(cur.layers, index);
  }
  renderLayersPanel();
}

function setLayerVisible(index, visible) {
  const l = state.layers[index];
  if (!l || l.visible === visible) return;
  if (state.floating) commitFloating();
  l.visible = visible;
  composite();
  renderLayersPanel();
  saveHistory(visible ? 'Показать слой' : 'Скрыть слой');
}

function setLayerOpacity(index, opacity) {
  const l = state.layers[index];
  if (!l) return;
  const v = Math.min(1, Math.max(0, opacity));
  if (l.opacity === v) return;
  l.opacity = v;
  composite();
  renderLayersPanel();
  saveHistory('Прозрачность слоя');
}

/** Переставить слой на одну позицию. Бумага остаётся снизу. */
function moveLayer(index, delta) {
  const to = index + delta;
  if (index <= 0 || to <= 0 || index >= state.layers.length || to >= state.layers.length) {
    // Отказ обязан назвать причину: их две, и они разные. Без слов кнопка выглядит
    // сломанной, а не упёршейся в край.
    if (index === 0 || to === 0) hint('Бумага документа всегда лежит снизу.');
    else hint('Слой уже с краю стопки: двигать его дальше некуда.');
    return false;
  }
  if (state.floating) commitFloating();
  const [l] = state.layers.splice(index, 1);
  state.layers.splice(to, 0, l);
  if (state.activeLayer === index) state.activeLayer = to;
  else if (state.activeLayer === to) state.activeLayer = index;
  composite();
  renderLayersPanel();
  saveHistory('Порядок слоёв');
  return true;
}

/**
 * Можно ли сейчас рисовать. Слой, спрятанный или выкрученный в прозрачность, молча съедал
 * бы штрихи: на экране не появляется ничего, а в ленте появляется запись и документ
 * считается изменённым. В WPF-версии это чинили дважды - 1.10.0 и 1.17.0.
 */
function canDrawOnActiveLayer() {
  const l = activeLayer();
  if (!l.visible) {
    hint('Слой «' + l.name + '» скрыт: включите его видимость, иначе рисовать некуда.');
    return false;
  }
  if (l.opacity <= 0) {
    hint('Слой «' + l.name + '» полностью прозрачен: поднимите его непрозрачность.');
    return false;
  }
  return true;
}

/**
 * Список слоёв. Сверху - верхний слой: в панели стопка показывается так же, как лежит
 * на холсте, то есть в обратном порядке относительно массива.
 */
function renderLayersPanel() {
  const list = document.getElementById('layers-list');
  if (!list) return;
  list.innerHTML = '';
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const l = state.layers[i];
    const row = document.createElement('div');
    row.className = 'layer-row'
      + (i === state.activeLayer ? ' active' : '')
      + (l.visible ? '' : ' hidden');
    row.dataset.index = String(i);
    row.onclick = () => setActiveLayer(i);

    const eye = document.createElement('button');
    eye.className = 'layer-eye';
    eye.textContent = l.visible ? '◉' : '○';
    eye.title = l.visible ? 'Скрыть слой' : 'Показать слой';
    // Щелчок по глазу не должен заодно менять активный слой: это два разных намерения.
    eye.onclick = (e) => { e.stopPropagation(); setLayerVisible(i, !l.visible); };

    const name = document.createElement('div');
    name.className = 'layer-name';
    name.textContent = l.name + (l.opacity < 1 ? '  ' + Math.round(l.opacity * 100) + '%' : '');
    name.title = l.name;

    const moves = document.createElement('div');
    const up = document.createElement('button');
    up.className = 'layer-move';
    up.textContent = '▲';
    up.title = 'Выше';
    up.disabled = i === 0 || i === state.layers.length - 1;
    up.onclick = (e) => { e.stopPropagation(); moveLayer(i, 1); };
    const down = document.createElement('button');
    down.className = 'layer-move';
    down.textContent = '▼';
    down.title = 'Ниже';
    // Ниже бумаги слоёв не бывает, и саму бумагу двигать некуда.
    down.disabled = i <= 1;
    down.onclick = (e) => { e.stopPropagation(); moveLayer(i, -1); };
    moves.appendChild(up);
    moves.appendChild(down);

    row.appendChild(eye);
    row.appendChild(name);
    row.appendChild(moves);
    list.appendChild(row);
  }

  // Ползунок показывает прозрачность АКТИВНОГО слоя. Пока он держал своё значение,
  // переключение слоя оставляло на экране чужое число - в WPF-версии это 1.19.0.
  const slider = document.getElementById('layer-opacity');
  const label = document.getElementById('layer-opacity-value');
  if (slider) {
    const pct = Math.round(activeLayer().opacity * 100);
    slider.value = String(pct);
    if (label) label.textContent = pct + '%';
  }
}

function onLayerOpacityInput(value) {
  const pct = Math.max(0, Math.min(100, parseInt(value, 10) || 0));
  const label = document.getElementById('layer-opacity-value');
  if (label) label.textContent = pct + '%';
  setLayerOpacity(state.activeLayer, pct / 100);
}

/** Бумага документа. */
function paperLayer() {
  return state.layers[0];
}

function isPaperActive() {
  return state.activeLayer === 0;
}

/**
 * Стереть область в активном слое. На бумаге это белая заливка, на слое выше - дыра.
 * Одно место на вырезание и на Delete: два одинаковых куска расходились бы со временем.
 */
function eraseRegion(x, y, w, h) {
  // Стирание уносит пиксели из битмапа так же, как их туда кладут кисти, и проверка на
  // видимость ему нужна та же: на экране не меняется ничего, а запись появляется.
  if (!canDrawOnActiveLayer()) return false;
  const g = lctx();
  g.save();
  g.globalAlpha = 1;
  if (isPaperActive()) {
    g.clearRect(x, y, w, h);
    g.fillStyle = 'white';
    g.fillRect(x, y, w, h);
  } else {
    g.clearRect(x, y, w, h);
  }
  g.restore();
  composite();
  return true;
}

/** Пересобрать видимый холст из слоёв. Звать после КАЖДОЙ правки слоя. */
function composite() {
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const l of state.layers) {
    // Слой, выкрученный в полную прозрачность, не должен быть виден вовсе - ни на
    // экране, ни в файле. В WPF-версии подкрашивание нулевой альфой чинили в 1.20.0.
    if (!l.visible || l.opacity <= 0) continue;
    ctx.globalAlpha = Math.min(1, Math.max(0, l.opacity));
    ctx.drawImage(l.canvas, 0, 0);
    // Недорисованный мазок лежит НА СВОЁМ слое, а не поверх стопки.
    if (state.previewLayerId === l.id) {
      ctx.globalAlpha = Math.min(1, Math.max(0, l.opacity)) * (state.previewAlpha || 1);
      ctx.drawImage(previewCanvas, 0, 0);
    }
  }
  ctx.restore();
}

/**
 * Преобразовать КАЖДЫЙ слой одинаково и заменить им прежний.
 *
 * Поворот, отражение, обрезка и смена размера меняют документ целиком, а документ - это
 * стопка. Пока преобразование шло по видимому холсту, оно расплющивало стопку в один слой
 * при первом же повороте. paint(g, src, w, h) рисует содержимое src в новый холст w x h.
 */
function transformLayers(w, h, paint) {
  for (const l of state.layers) {
    const next = makeLayerCanvas(w, h);
    paint(next.getContext('2d'), l.canvas, w, h);
    l.canvas = next;
  }
}

/**
 * Подогнать все слои под новый размер.
 *
 * Новое место на бумаге заливается белым, на слоях выше остаётся пустым: белая заплатка
 * там закрыла бы бумагу вместо того, чтобы показать её.
 *
 * offX/offY - куда в НОВОМ холсте попадает левый верхний угол прежнего. Ноль означает
 * прежнее поведение: содержимое остаётся в левом верхнем углу, а холст растёт вправо и
 * вниз. Тянут за левую или верхнюю сторону - холст растёт в другую сторону, и рисунок
 * обязан сдвинуться вместе с ней, иначе «растянул влево» выглядело бы как «рисунок
 * прыгнул вправо». При сжатии смещение отрицательное: лишнее просто срезается.
 */
function growLayers(w, h, offX = 0, offY = 0) {
  for (let i = 0; i < state.layers.length; i++) {
    const l = state.layers[i];
    const old = l.canvas;
    const next = makeLayerCanvas(w, h);
    const g = next.getContext('2d');
    if (i === 0) {
      g.fillStyle = 'white';
      g.fillRect(0, 0, w, h);
    }
    g.drawImage(old, offX, offY);
    l.canvas = next;
  }
}

// Инициализация белого фона: бумага белая, всё, что выше неё, - пустое.
function fillWhite() {
  if (!state.layers || !state.layers.length) {
    state.layers = [makeLayer('Бумага', canvas.width, canvas.height)];
    state.activeLayer = 0;
  }
  for (let i = 0; i < state.layers.length; i++) {
    const g = state.layers[i].canvas.getContext('2d');
    g.clearRect(0, 0, canvas.width, canvas.height);
    if (i === 0) {
      g.fillStyle = 'white';
      g.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
  composite();
}
fillWhite();
saveHistory('Исходное состояние');
// Пустой белый холст - это то, с чего программа началась, и терять здесь нечего:
// метка «сохранено» ставится сюда же. Иначе первый же saveHistory на запуске уводит
// метку в -1 (страховка про отрезанный хвост повтора считает пару 0 и -1 своим
// случаем), и только что открытая программа спрашивает про сохранение при закрытии,
// хотя пользователь ничего не делал. Так же поступает newCanvas() ниже.
state.savedHistoryIndex = state.historyIndex;
state.savedDisabledKey = disabledKey();
renderLayersPanel();

// Палитра цветов
// Палитра: пять рядов по восемь - серые, чистые, тёмные, средние, светлые. Та же, что
// в WPF-версии (MainViewModel.InitPalette), в том же порядке.
const colors = [
  '#000000','#434343','#666666','#999999','#b7b7b7','#d9d9d9','#efefef','#ffffff',
  '#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#0000ff','#9900ff','#ff00ff',
  '#980000','#b45f06','#bf9000','#38761d','#134f5c','#1155cc','#351c75','#741b47',
  '#e06666','#f6b26b','#ffd966','#93c47d','#76a5af','#6d9eeb','#8e7cc3','#c27ba0',
  '#f4cccc','#fce5cd','#fff2cc','#d9ead3','#d0e0e3','#c9daf8','#d9d2e9','#ead1dc'
];

function makeSwatch(c) {
  const s = document.createElement('div');
  s.className = 'color-swatch';
  s.style.background = c;
  s.dataset.tip = c.toUpperCase();
  s.onclick = () => setColor(c);
  return s;
}

const palette = document.getElementById('palette');
colors.forEach(c => palette.appendChild(makeSwatch(c)));

// «Последние»: до восьми, свежий первым, без повторов - как RecentColors в WPF-версии.
const RECENT_MAX = 8;
let recentColors = [];
function addRecentColor(c) {
  c = c.toLowerCase();
  recentColors = [c, ...recentColors.filter(x => x !== c)].slice(0, RECENT_MAX);
  const box = document.getElementById('recent-colors');
  box.innerHTML = '';
  recentColors.forEach(x => box.appendChild(makeSwatch(x)));
  markActiveSwatches();
}

function markActiveSwatches() {
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('active', s.style.backgroundColor === hexToRgb(state.color));
  });
}

// live - цвет ещё подбирается в окне выбора цвета: в «Последние» он попадёт, когда окно
// закроют, а не каждым промежуточным оттенком.
function setColor(c, live) {
  const changed = String(state.color).toLowerCase() !== String(c).toLowerCase();
  state.color = c;
  document.getElementById('color-preview').style.background = c;
  document.getElementById('color-input').value = c;
  if (changed && !live) addRecentColor(c);
  else markActiveSwatches();
}

// ============ PIXEL PREVIEW В СТАТУСБАРЕ ============
// Читать каждый pixel из getImageData дорого, потому что getImageData форсит
// flush GPU→CPU. Throttle через rAF — максимум один sample за кадр.
let pixelPreviewPending = false;
let pixelPreviewLastX = 0, pixelPreviewLastY = 0;
let pixelPreviewCurrentHex = '#ffffff';
function schedulePixelPreview(x, y) {
  pixelPreviewLastX = x;
  pixelPreviewLastY = y;
  if (pixelPreviewPending) return;
  pixelPreviewPending = true;
  requestAnimationFrame(samplePixelPreview);
}
// Курсор ушёл с холста - показывать нечего. Пока последний цвет оставался на месте,
// он читался как цвет под курсором, которого на холсте уже нет. Координаты в этом
// случае гаснут прочерком с самого начала, HEX - нет. В WPF-версии это 1.17.0.
function clearPixelPreview() {
  pixelPreviewCurrentHex = '#ffffff';
  const sw = document.getElementById('pixel-swatch');
  const hx = document.getElementById('pixel-hex');
  if (sw) sw.style.background = 'transparent';
  if (hx) hx.textContent = '—';
}

function samplePixelPreview() {
  pixelPreviewPending = false;
  const x = Math.floor(pixelPreviewLastX);
  const y = Math.floor(pixelPreviewLastY);
  if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) { clearPixelPreview(); return; }
  try {
    const d = ctx.getImageData(x, y, 1, 1).data;
    const hex = '#' + [d[0], d[1], d[2]].map(c => c.toString(16).padStart(2, '0')).join('');
    pixelPreviewCurrentHex = hex;
    const sw = document.getElementById('pixel-swatch');
    const hx = document.getElementById('pixel-hex');
    if (sw) sw.style.background = hex;
    if (hx) hx.textContent = hex;
  } catch (_) { /* security в кросс-доменных canvas невозможен — игнорируем */ }
}
// Клик по swatch = назначить как текущий цвет (быстрый eyedropper)
window.addEventListener('DOMContentLoaded', () => {
  const sw = document.getElementById('pixel-swatch');
  if (sw) sw.addEventListener('click', () => setColor(pixelPreviewCurrentHex));
});

// ============ ТЕМЫ ОФОРМЛЕНИЯ ============
// Тема - это набор тех же CSS-переменных (см. блок :root[data-theme=...] в стилях).
// Всё оформление ходит через них, поэтому смена сводится к атрибуту на <html>.
// Холст и то, что всплывает НАД ним, темам не подчиняются: бумага белая всегда, и
// подложка над ней обязана быть тёмной в любой теме.
const THEMES = [
  { id: 'glass',  name: 'Стеклянная', note: 'Как было: цветной градиент и стекло' },
  { id: 'formal', name: 'Строгая',    note: 'Ровный тёмный фон, приглушённый синий' },
  { id: 'light',  name: 'Светлая',    note: 'Тёмный текст на светлом' },
  { id: 'night',  name: 'Ночная',     note: 'Почти чёрный фон для тёмной комнаты' },
  { id: 'warm',   name: 'Тёплая',     note: 'Охра и кофе вместо синевы' }
];

const THEME_KEY = 'paint-pro-theme';

function currentTheme() {
  const id = document.documentElement.getAttribute('data-theme') || 'glass';
  return THEMES.some((t) => t.id === id) ? id : 'glass';
}

/**
 * Поставить тему. Неизвестное имя откатывает к исходной: файл настроек могли поправить
 * руками, а приложение без оформления - это не приложение.
 */
function setTheme(id) {
  const theme = THEMES.find((t) => t.id === id) || THEMES[0];
  if (theme.id === 'glass') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme.id);
  try { localStorage.setItem(THEME_KEY, theme.id); } catch (_) { /* приватный режим - не беда */ }
  renderThemeMenu();
  return theme.id;
}

function renderThemeMenu() {
  const box = document.getElementById('theme-menu');
  if (!box) return;
  const active = currentTheme();
  box.innerHTML = '';
  for (const t of THEMES) {
    const b = document.createElement('button');
    b.className = 'mb-dd-item';
    b.dataset.theme = t.id;
    b.title = t.note;
    const mark = document.createElement('span');
    mark.className = 'theme-mark';
    mark.textContent = t.id === active ? '✓' : '';
    const label = document.createElement('span');
    label.textContent = t.name;
    const left = document.createElement('span');
    left.appendChild(mark);
    left.appendChild(label);
    b.appendChild(left);
    b.onclick = () => setTheme(t.id);
    box.appendChild(b);
  }
}

// Выбор переживает перезапуск. Меню тем рисуется ЗДЕСЬ, а не в блоке запуска выше:
// функции всплывают наверх, а `const THEMES` - нет, и вызов оттуда находил бы функцию,
// но не находил данные. Скрипт страницы падал бы целиком.
(function restoreTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (_) { /* нет хранилища */ }
  if (saved) setTheme(saved);
  else renderThemeMenu();
})();

// ============ ПОДСКАЗКИ ============
// Отказ без слов - худший вид отказа: пользователь нажал, ничего не произошло, и понять
// почему нельзя. Здесь собраны все места, где действие законно не делает ничего.
// Показываем строку, которая гаснет сама через несколько секунд.
// Очередь операций над лентой: пересборка и восстановление кадра не должны идти
// вперемешку - обе перекладывают стопку слоёв.
let timelineChain = Promise.resolve();

let hintTimer = null;

// Одна формулировка на все рисующие инструменты: разные слова для одной и той же
// причины читались бы как разные причины.
const INK_HINT = 'Чернила прозрачные: поднимите ползунок непрозрачности выше нуля.';

function hint(text) {
  const el = document.getElementById('hint');
  if (!el) return;
  el.textContent = text;
  el.classList.add('visible');
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove('visible'), 3200);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${r}, ${g}, ${b})`;
}

// Окно выбора цвета: пока его крутят - цвет живой, закрыли - цвет идёт в «Последние»,
// если он не тот, что был до открытия.
let colorBeforePicker = null;
const colorInput = document.getElementById('color-input');
colorInput.addEventListener('click', () => { colorBeforePicker = String(state.color).toLowerCase(); });
colorInput.addEventListener('input', (e) => setColor(e.target.value, true));
colorInput.addEventListener('change', (e) => {
  const c = e.target.value.toLowerCase();
  if (c !== colorBeforePicker) addRecentColor(c);
  colorBeforePicker = null;

// Инструменты
const toolNames = {
  hand: 'Рука',
  pencil: 'Карандаш', brush: 'Кисть', marker: 'Маркер', eraser: 'Ластик',
  fill: 'Заливка', picker: 'Пипетка', text: 'Текст',
  line: 'Линия', rect: 'Прямоугольник', ellipse: 'Эллипс',
  triangle: 'Треугольник', 'right-triangle': 'Прямоугольный треугольник',
  star: 'Звезда', arrow: 'Стрелка', heart: 'Сердце',
  select: 'Выделение', quad: 'Полигон 4 точками', crop: 'Обрезка'
};

// Список фигур был скопирован инлайном в трёх местах. Один список на все ветки.
const SHAPE_TOOLS = ['line','rect','ellipse','triangle','right-triangle','star','arrow','heart'];
const DRAWING_TOOLS = ['pencil','brush','marker','eraser', ...SHAPE_TOOLS];

// Фактическая толщина мазка в пикселях холста. С 1.18.0 она равна размеру у всех
// инструментов: «300 px» у карандаша, кисти, маркера и ластика - одна и та же полоса.
// До того карандаш рисовал вдвое тоньше, а маркер в полтора раза толще заданного, и одно
// число на ползунке значило у разных инструментов разное. Функция осталась одна на все
// места, где толщина нужна (перо, повтор ленты, кружок размера), - чтобы они не разошлись.
function strokeWidthFor(tool, size) {
  return Math.max(1, size);
}

// Ворсинки кисти (1.19.0). До того кисть рисовала ровно то же, что карандаш: круглую
// сплошную линию той же толщины. Теперь мазок кисти - пучок тонких линий-ворсинок, у каждой
// свой сдвиг от центра, своя толщина в долях размера и свой оттенок - чуть светлее
// выбранного цвета: вдоль мазка идут полоски, край неровный. Ворсинка 0 - сердцевина по
// центру ровно выбранного цвета. Ворсинки смешиваются режимом darken - где их несколько,
// остаётся самая тёмная: круглый конец ворсинки с прошлого куска мазка выступает в
// следующий, и при обычном наложении вдоль ворсинок шёл пунктир при любом порядке
// рисования. С darken порядок ни на что не влияет, а сердцевина, самая тёмная, видна везде,
// где лежит. Буфер у мазка свой - слой и прошлые мазки это не трогает. Весь пучок
// лежит внутри круга размера - кружок размера не врёт. Пучок задаёт число-зерно из точки,
// где мазок начат (bristleSeedAt): один и тот же мазок ложится всегда одинаково. Зерно
// пишется в запись мазка, и пересборка ленты рисует тот же пучок. Генератор (mulberry32) и порядок
// чисел те же, что в C# (Services/Bristles.cs): одно зерно - один пучок в обеих версиях.
const BRISTLE_COUNT = 32;
const BRISTLE_MIN_SIZE = 6;      // тоньше ворсинки неразличимы - кисть рисует сплошной линией
const BRISTLE_MAX_OFFSET = 0.44;
// Ворсинки по краю пучка: каждая нечётная, равномерно по кругу. Без них случайные ворсинки в
// каком-то направлении не доставали до края, и полоса выходила уже кружка размера.
const BRISTLE_RIM_COUNT = 16;
const BRISTLE_RIM_INNER = 0.92;
const BRISTLE_MIN_WIDTH = 0.05, BRISTLE_WIDTH_SPREAD = 0.07;
const BRISTLE_CORE_WIDTH = 0.20;
const BRISTLE_CORE_MIN_PX = 3;   // тоньше пятая часть малой кисти дала бы бледную точку
const BRISTLE_SHADE_MIN = 0.0, BRISTLE_SHADE_SPREAD = 0.38; // доля пути к белому

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Зерно мазка из точки начала, с шагом в восьмую пикселя. Так же, как Bristles.SeedAt в C#.
function bristleSeedAt(x, y) {
  const ix = Math.round(x * 8) | 0, iy = Math.round(y * 8) | 0;
  return (Math.imul(ix, 73856093) ^ Math.imul(iy, 19349663)) >>> 0;
}

function bristlesFor(seed) {
  const next = mulberry32(seed);
  const out = [{ dx: 0, dy: 0, w: BRISTLE_CORE_WIDTH, shade: 0 }];
  const turn = next() * Math.PI * 2;   // поворот всего края: у каждого мазка свой
  for (let i = 1; i < BRISTLE_COUNT; i++) {
    const u = next(), a = next();
    let r, angle;
    if (i % 2 === 1) {
      // Край: свой сектор круга, внутри сектора - со сдвигом не больше четверти.
      const k = (i - 1) / 2;
      angle = turn + (k + (a - 0.5) * 0.5) * (Math.PI * 2 / BRISTLE_RIM_COUNT);
      r = BRISTLE_MAX_OFFSET * (BRISTLE_RIM_INNER + (1 - BRISTLE_RIM_INNER) * u);
    } else {
      // Середина: sqrt - чтобы по площади круга легли равномерно, а не у центра.
      angle = a * Math.PI * 2;
      r = BRISTLE_MAX_OFFSET * Math.sqrt(u);
    }
    const w = BRISTLE_MIN_WIDTH + BRISTLE_WIDTH_SPREAD * next();
    const shade = BRISTLE_SHADE_MIN + BRISTLE_SHADE_SPREAD * next();
    out.push({ dx: r * Math.cos(angle), dy: r * Math.sin(angle), w, shade });
  }
  return out;
}

// Цвет ворсинки: выбранный, сдвинутый к белому на её оттенок.
function bristleTint(hex, shade) {
  const ch = (v) => Math.round(v + (255 - v) * shade);
  const r = ch(parseInt(hex.slice(1, 3), 16));
  const g = ch(parseInt(hex.slice(3, 5), 16));
  const b = ch(parseInt(hex.slice(5, 7), 16));
  return `rgb(${r}, ${g}, ${b})`;
}

function bristlesApply(tool, bristles, size) {
  return tool === 'brush' && !!bristles && size >= BRISTLE_MIN_SIZE;
}

// Отрезок мазка. Одна функция на перо и на пересборку ленты - чтобы повтор совпал до пикселя.
function strokeSegment(g, tool, bristles, x0, y0, x1, y1, size) {
  if (!bristlesApply(tool, bristles, size)) {
    g.lineWidth = strokeWidthFor(tool, size);
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(x1, y1);
    g.stroke();
    return;
  }
  // Цвет мазка уже стоит в strokeStyle (canvas отдаёт его как #rrggbb); оттенки считаются
  // от него и запоминаются в самом пучке - на каждое движение мыши не пересчитывать.
  const base = g.strokeStyle;
  const op = g.globalCompositeOperation;
  g.globalCompositeOperation = 'darken';
  for (const b of bristles) {
    const dx = b.dx * size, dy = b.dy * size;
    if (b.tintOf !== base) {
      b.tint = /^#[0-9a-f]{6}$/i.test(base) ? bristleTint(base, b.shade) : base;
      b.tintOf = base;
    }
    g.strokeStyle = b.tint;
    g.lineWidth = Math.max(b.dx === 0 && b.dy === 0 ? BRISTLE_CORE_MIN_PX : 1, b.w * size);
    g.beginPath();
    g.moveTo(x0 + dx, y0 + dy);
    g.lineTo(x1 + dx, y1 + dy);
    g.stroke();
  }
  g.strokeStyle = base;
  g.globalCompositeOperation = op;
}

// Отпечаток на нажатии: крошечный отрезок, как у всех штрихов, - у кисти у каждой ворсинки.
function strokeDot(g, tool, bristles, x, y, size) {
  strokeSegment(g, tool, bristles, x, y, x + 0.01, y + 0.01, size);
}

// Кружок размера кисти. До 1.18.0 это был курсор-картинка, а у курсоров в Chromium
// потолок около 128 точек: кружок зажимался в 96 и на кисти 300 px был втрое меньше
// настоящей. Теперь это обычный элемент поверх холста, любого размера; курсор - крестик
// в центре. Диаметр - толщина инструмента, умноженная на масштаб: пользователь видит мазок
// в экранных точках.
const brushRing = document.getElementById('brush-ring');
let ringPoint = null; // где мышь над холстом, в точках относительно холста; null - не над ним

function brushRingDiameter() {
  return strokeWidthFor(state.tool, state.size) * (state.zoom || 1);
}

// Самый большой кружок, который ещё помещается в курсор-картинку: у Chromium потолок
// курсора 128 точек, минус поля под обводку.
const CURSOR_RING_MAX = 120;

/**
 * Курсор-картинка: кружок и крестик в одной картинке. Её рисует система вместе с
 * указателем, без задержки. Элемент поверх холста отстаёт от указателя на кадр-другой -
 * кружок заметно тянулся за крестиком (замечание к 1.18.0), - поэтому он нужен только
 * там, куда курсор-картинка не дотягивается.
 */
function ringCursorCss(d) {
  const pad = 4;
  const sz = Math.ceil(d + pad * 2);
  const c = sz / 2;
  const r = (d / 2).toFixed(2);
  const cross = `<path d='M${c - 5} ${c}H${c + 5}M${c} ${c - 5}V${c + 5}' stroke='white' stroke-width='3'/>`
    + `<path d='M${c - 5} ${c}H${c + 5}M${c} ${c - 5}V${c + 5}' stroke='black' stroke-width='1'/>`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${sz}' height='${sz}' viewBox='0 0 ${sz} ${sz}'>`
    + `<circle cx='${c}' cy='${c}' r='${r}' fill='none' stroke='white' stroke-width='2.4'/>`
    + `<circle cx='${c}' cy='${c}' r='${r}' fill='none' stroke='black' stroke-width='1'/>`
    + cross + `</svg>`;
  return `url("data:image/svg+xml;utf8,${svg}") ${c} ${c}, crosshair`;
}

function updateBrushCursor() {
  const on = DRAWING_TOOLS.includes(state.tool);
  if (!on) {
    canvas.style.cursor = '';
    brushRing.style.display = 'none';
    return;
  }
  const d = brushRingDiameter();
  // Небольшой кружок - в курсоре, без задержки. Большой - элементом, а системный
  // указатель прячется, и крестик рисуется в том же элементе: тогда кружок и крестик
  // движутся вместе, а не один догоняет другой.
  if (d <= CURSOR_RING_MAX) {
    canvas.style.cursor = ringCursorCss(d);
    brushRing.style.display = 'none';
    return;
  }
  canvas.style.cursor = 'none';
  if (!ringPoint) {
    brushRing.style.display = 'none';
    return;
  }
  brushRing.style.display = 'block';
  brushRing.style.width = d + 'px';
  brushRing.style.height = d + 'px';
  brushRing.style.left = (canvas.offsetLeft + ringPoint.x) + 'px';
  brushRing.style.top = (canvas.offsetTop + ringPoint.y) + 'px';
}

function moveBrushRing(e) {
  const r = canvas.getBoundingClientRect();
  ringPoint = { x: e.clientX - r.left, y: e.clientY - r.top };
  updateBrushCursor();
}

canvas.addEventListener('mousemove', moveBrushRing);
canvas.addEventListener('mouseenter', moveBrushRing);
canvas.addEventListener('mouseleave', () => {
  // Кисть тянут за край, не отпуская кнопку: кружок идёт за мышью до отпускания.
  if (state.drawing) return;
  ringPoint = null;
  updateBrushCursor();
});
document.addEventListener('mousemove', (e) => { if (state.drawing && ringPoint) moveBrushRing(e); });
document.addEventListener('mouseup', () => {
  // Отпустили за краем холста - кружок там больше не нужен.
  if (!ringPoint) return;
  const r = canvas.getBoundingClientRect();
  if (ringPoint.x < 0 || ringPoint.y < 0 || ringPoint.x > r.width || ringPoint.y > r.height) {
    ringPoint = null;
    updateBrushCursor();
  }
});

document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    // Если был активный floating (кроме select/quad) - применяем.
    // quad оставляет floating живым, чтобы можно было дальше тащить углы.
    if (state.floating && btn.dataset.tool !== 'select' && btn.dataset.tool !== 'quad') {
      commitFloating();
    }
    // Если был активный текст - применяем
    if (textEditor.style.display === 'block') {
      commitText();
    }
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tool = btn.dataset.tool;
    syncSizeForTool();
    // Сброс обычного выделения при смене
    if (state.tool !== 'select' && state.tool !== 'crop' && state.tool !== 'quad') {
      commitSelection();
      hideSelection();
    }
    if (state.tool !== 'crop') {
      state.cropping = false;
      cropControls.style.display = 'none';
    }
    // Сбрасываем inline-курсор, чтобы CSS-класс мог сработать для нерисующих
    // инструментов. Для рисующих updateBrushCursor() поставит свой кружок.
    canvas.style.cursor = '';
    canvas.className = 'tool-' + state.tool;
    updateBrushCursor();
  });
});

// Размер.
// brushSize - общий размер для рисующих/фигурных инструментов, чтобы при
// переключении ластик -> фигура не "залипал" размер ластика. Ластик хранит
// свой размер отдельно (eraserSize).
const BRUSH_GROUP = ['pencil','brush','marker', ...SHAPE_TOOLS];

const sizeInput = document.getElementById('size-input');

const MIN_TOOL_SIZE = parseInt(sizeInput.min);
const MAX_TOOL_SIZE = parseInt(sizeInput.max);

/** Есть ли у текущего инструмента размер вообще. У заливки, пипетки и текста - нет. */
function toolHasSize() {
  return state.tool === 'eraser' || BRUSH_GROUP.includes(state.tool);
}

/**
 * ЕДИНСТВЕННАЯ точка смены размера инструмента.
 *
 * Размер живёт в пяти местах сразу: state.size, отдельная память кисти или ластика,
 * две подписи и рисованный курсор. Пока путей было два (ползунок и вызов из кода),
 * любой новый способ - колесо мыши - обязан был повторить всю пятёрку, и забытое
 * звено выглядело бы как «размер сменился, а кружок курсора прежний».
 *
 * Возвращает установленный размер: вызывающему важно знать, упёрлись ли в предел.
 */
function setToolSize(v) {
  v = Math.round(v);
  v = Math.min(Math.max(v, MIN_TOOL_SIZE), MAX_TOOL_SIZE);
  state.size = v;
  if (state.tool === 'eraser') state.eraserSize = v;
  else if (BRUSH_GROUP.includes(state.tool)) state.brushSize = v;
  sizeInput.value = v;
  document.getElementById('size-display').textContent = v + ' px';
  updateBrushCursor();
  return v;
}

sizeInput.addEventListener('input', (e) => setToolSize(parseInt(e.target.value)));

function syncSizeForTool() {
  // У инструмента без размера показывать нечего - только курсор перерисовать.
  if (!toolHasSize()) { updateBrushCursor(); return; }
  // Достаём отложенный размер этого инструмента и проводим его через общую точку.
  setToolSize(state.tool === 'eraser' ? state.eraserSize : state.brushSize);
}

// Прозрачность
document.getElementById('opacity-input').addEventListener('input', (e) => {
  state.opacity = parseInt(e.target.value) / 100;
  document.getElementById('opacity-display').textContent = e.target.value + '%';
});

// Заливка фигур. Флажок «Заливать фигуры» - как в WPF-версии: залитая фигура там
// рисуется заливкой и обводкой поверх, это режим 'both'. 'solid' остаётся для кода.
function setFillMode(m) {
  if (!['outline', 'solid', 'both'].includes(m)) return;
  state.fillMode = m;
  document.getElementById('fill-shapes').checked = m !== 'outline';
}

// Координаты
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

// Мышь
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
// Жест заканчивается ОТПУСКАНИЕМ кнопки, а не уходом курсора с холста.
//
// Раньше здесь висел `canvas.addEventListener('mouseleave', onUp)`, и он врал дважды.
// Во-первых, рамка выделения и её ручки лежат поверх холста отдельными элементами: пока
// тянешь ручку, курсор то и дело оказывается над ней, и для canvas это тот же mouseleave.
// Ресайз срывался, стоило отклониться от линии на пару пикселей, - вести мышь приходилось
// идеально по траектории. Во-вторых, мазок обрывался на краю холста и не продолжался,
// когда курсор возвращался обратно, хотя кнопка всё это время оставалась зажатой; в
// WPF-версии мышь на время жеста захватывается (Skia.CaptureMouse), и там ничего не
// обрывалось - расхождение между версиями.
//
// Отпускание за пределами холста ловит документ: до него событие с canvas доходит
// всплытием, поэтому проверка state.drawing отсекает второй вызов на том же жесте.
document.addEventListener('mouseup', (e) => {
  if (state.drawing) onUp(e);
});

// Кнопку могли отпустить там, где нас не слышно: за краем окна или под чужим окном,
// вышедшим вперёд. mouseup тогда не придёт совсем, и жест остался бы висеть открытым -
// превью тянулось бы за курсором до следующего щелчка, а рамка выделения продолжала бы
// растягиваться сама по себе. Ловим это двумя способами: первым же движением с уже
// отпущенной кнопкой (buttons === 0) и потерей фокуса окном. В WPF-версии ровно этот
// случай ловит Skia.LostMouseCapture - см. CanvasGestureTests.
let lastMousePoint = { clientX: 0, clientY: 0 };
document.addEventListener('mousemove', (e) => {
  lastMousePoint = { clientX: e.clientX, clientY: e.clientY };
  if (e.buttons === 0) endStrandedGesture(e);
}, true);
window.addEventListener('blur', () => endStrandedGesture(lastMousePoint));

/** Закрыть жест, отпускания которого мы не увидели. Точка нужна только фигурам. */
function endStrandedGesture(point) {
  if (state.resizingFloating) { state.resizingFloating = false; state.resizeHandle = null; }
  if (state.rotatingFloating) { state.rotatingFloating = false; state.rotationStart = null; }
  if (state.warpingQuad) { state.warpingQuad = false; state.warpCornerIdx = null; }
  state.draggingFloating = false;
  if (state.drawing) onUp(point);
}
canvas.addEventListener('mouseleave', () => {
  clearPixelPreview();
  document.getElementById('pos').textContent = '—';
});
// mousedown приходит для любой кнопки. Правый клик кистью ставил точку и писал
// запись в историю, а вместе с ним вылезало системное контекстное меню.
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function onDown(e) {
  if (e.button !== 0) return;
  if (state.tool === 'hand') return;
  // Кадр истории ещё едет: холст сейчас показывает состояние ДО отмены, и штрих,
  // начатый в это окно, затёрло бы приходящей картинкой. Пропускаем жест целиком.
  if (state.restoring) return;
  const {x, y} = getPos(e);
  state.startX = x;
  state.startY = y;
  state.lastX = x;
  state.lastY = y;

  const t = state.tool;

  // Выделение - проверка, кликнул ли внутри
  if ((t === 'select' || t === 'crop' || t === 'quad') && state.floating && hitFloating(x, y)) {
    ensureOriginalQuadErased();
    state.draggingFloating = true;
    state.dragOffsetX = x - state.floating.x;
    state.dragOffsetY = y - state.floating.y;
    return;
  }
  if ((t === 'select' || t === 'crop' || t === 'quad') && state.floating) {
    // Клик вне floating - применяем
    commitFloating();
  }
  if ((t === 'select' || t === 'crop') && state.selection) {
    const s = state.selection;
    if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
      if (t === 'select' && state.selectionReady) {
        // Поднимаем выделение в floating (drawImage = композитинг с прозрачностью),
        // чтобы двигалось только нарисованное, без белой подложки.
        const f = promoteSelectionToFloating();
        if (f) {
          state.draggingFloating = true;
          state.dragOffsetX = x - f.x;
          state.dragOffsetY = y - f.y;
        }
        return;
      }
    } else {
      commitSelection();
      hideSelection();
    }
  }

  // При других инструментах, если есть floating - применяем.
  // Пипетка - исключение: сэмплит из композита (canvas + floating), сам
  // floating оставляет нетронутым, иначе клик пипеткой бы рушил вставленную
  // картинку.
  if (state.floating && t !== 'select' && t !== 'crop' && t !== 'quad' && t !== 'picker') {
    commitFloating();
  }

  // Спрятанный или полностью прозрачный слой краску съедает молча: на экране не меняется
  // ничего, а запись в ленте появляется. Спрашиваем ДО начала жеста, а не на отпускании:
  // иначе превью штриха уже нарисуется на экране и обманет.
  if ((DRAWING_TOOLS.includes(t) || t === 'fill' || t === 'text') && !canDrawOnActiveLayer()) {
    return;
  }
  state.strokeLayerId = activeLayer().id;
  state.strokePoints = [x, y];
  state.strokeSizes = [state.size];
  // Пучок ворсинок на мазок свой: одинаковые полоски на всех мазках читались бы как узор.
  // Зерно - из точки начала, а не случайное: тот же мазок ложится так же. nextBrushSeed -
  // для проверок: задать зерно явно.
  if (t === 'brush') {
    state.strokeSeed = state.nextBrushSeed != null ? state.nextBrushSeed >>> 0 : bristleSeedAt(x, y);
    state.strokeBristles = bristlesFor(state.strokeSeed);
  } else {
    state.strokeSeed = null;
    state.strokeBristles = null;
  }

  state.drawing = true;
  // На время рисования bbox прячем handles в selection-overlay — иначе при tiny drag
  // курсор попадает на handle, события не доходят до canvas, и selection застывает.
  if (t === 'select' || t === 'quad' || t === 'crop') {
    selOverlay.classList.add('drawing');
  }

  if (t === 'pencil' || t === 'brush' || t === 'marker') {
    beginPreviewStroke(t);
    applyStrokeStyle(previewCtx);
    strokeDot(previewCtx, t, state.strokeBristles, x, y, state.size);
  } else if (SHAPE_TOOLS.includes(t)) {
    beginPreviewStroke(t);
  } else if (t === 'eraser') {
    // Ластик рисует белым - как в классическом Paint. Так нет проблем с
    // полупрозрачными пикселями и сохранение в PNG/JPEG даёт ожидаемый
    // белый фон.
    const g = gctx();
    g.save();
    g.globalAlpha = 1;
    // На бумаге ластик КРАСИТ белым - как в классическом Paint, и тогда сохранение в
    // PNG/JPEG даёт ожидаемый белый фон. На слое выше бумаги он ВЫЧИТАЕТ: белая краска
    // там закрыла бы то, что лежит ниже, вместо того чтобы открыть его.
    if (isPaperGesture()) {
      g.fillStyle = 'white';
    } else {
      g.globalCompositeOperation = 'destination-out';
      g.fillStyle = '#000';
    }
    g.beginPath();
    g.arc(x, y, state.size / 2, 0, Math.PI * 2);
    g.fill();
    g.restore();
    composite();
  } else if (t === 'fill') {
    // Не безусловный saveHistory: заливка бывает пустой (кликнули по области, уже
    // залитой этим же цветом), а запись нужна только если пиксели изменились. Пустая
    // включает признак несохранённой работы, и приложение спрашивает про сохранение
    // после действия, которое ничего не сделало. В WPF-версии это починено в 1.7.0.
    // Прозрачность в нуле - заливка не положит ни одного пикселя. Молча это выглядит
    // как сломанный инструмент; в WPF-версии то же самое объясняется с 1.20.0.
    if (state.opacity <= 0) {
      hint(INK_HINT);
    } else if (floodFill(Math.floor(x), Math.floor(y), state.color)) {
      saveHistory('Заливка', {
        kind: 'fill', x: Math.floor(x), y: Math.floor(y),
        color: state.color, opacity: state.opacity, layerId: state.strokeLayerId
      });
    }
    state.drawing = false;
  } else if (t === 'picker') {
    // Сэмплим из композита: основной холст + текущий floating сверху. Так
    // пользователь подбирает цвет ровно того, что видит, не теряя плавающий
    // объект.
    let sampleCtx = ctx;
    if (state.floating) {
      const composite = document.createElement('canvas');
      composite.width = canvas.width;
      composite.height = canvas.height;
      const cc = composite.getContext('2d');
      cc.drawImage(canvas, 0, 0);
      // Через общий рендер, а не голым drawImage: иначе пипетка берёт цвет
      // из неповёрнутого прямоугольника, а не из того, что видит пользователь.
      drawFloatingOnto(cc);
      sampleCtx = cc;
    }
    // Клик у правой или нижней кромки даёт после Math.floor координату, равную размеру
    // холста: getImageData отдаёт нули, и пипетка брала чёрный вместо цвета под курсором.
    // Ровно та же кромка, что чинилась в floodFill.
    const px = Math.min(canvas.width - 1, Math.max(0, Math.floor(x)));
    const py = Math.min(canvas.height - 1, Math.max(0, Math.floor(y)));
    const pixel = sampleCtx.getImageData(px, py, 1, 1).data;
    const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    setColor(hex);
    state.drawing = false;
  } else if (t === 'text') {
    // Применяем предыдущий текст, если был
    if (textEditor.style.display === 'block') commitText();
    startTextEdit(x, y);
    state.drawing = false;
  }
}

function onMove(e) {
  const {x, y} = getPos(e);
  document.getElementById('pos').textContent = `${Math.round(x)}, ${Math.round(y)}`;
  // Pixel preview только когда не идёт активный drag — getImageData дорогой
  if (!state.drawing && !state.draggingFloating && !state.resizingFloating &&
      !state.rotatingFloating && !state.warpingQuad) {
    schedulePixelPreview(x, y);
  }

  // Перетаскивание floating объекта (для quad — сдвигаем и все 4 угла вместе)
  if (state.draggingFloating && state.floating) {
    const nx = x - state.dragOffsetX;
    const ny = y - state.dragOffsetY;
    if (state.floating.quad) {
      const dx = nx - state.floating.x;
      const dy = ny - state.floating.y;
      state.floating.quad.forEach(p => { p.x += dx; p.y += dy; });
    }
    state.floating.x = nx;
    state.floating.y = ny;
    renderFloating();
    return;
  }

  // Resize floating
  if (state.resizingFloating && state.floating) {
    resizeFloating(x, y);
    return;
  }

  // В режиме выделения: показываем move-cursor когда мышь над активным floating
  if (state.tool === 'select' || state.tool === 'quad') {
    if (state.floating && hitFloating(x, y)) {
      canvas.style.cursor = 'move';
    } else if (!state.drawing) {
      canvas.style.cursor = 'crosshair';
    }
  }

  if (!state.drawing) return;

  const t = state.tool;

  if (t === 'pencil' || t === 'brush' || t === 'marker') {
    // Толщина - заново на каждом движении: колесо посреди штриха меняет размер, и до
    // 1.17.0 линия шла прежней толщиной до отпускания кнопки. Цвет остаётся тем, что
    // снят на нажатии. Размер записывается у каждой точки - по нему штрих повторяется
    // при пересборке ленты.
    strokeSegment(previewCtx, t, state.strokeBristles, state.lastX, state.lastY, x, y, state.size);
    state.lastX = x;
    state.lastY = y;
    if (state.strokePoints) state.strokePoints.push(x, y);
    if (state.strokeSizes) state.strokeSizes.push(state.size);
    composite();
  } else if (t === 'eraser') {
    // Плавное "стирание" - рисуем белой линией между предыдущей и текущей точкой
    const g = gctx();
    g.save();
    g.globalAlpha = 1;
    g.lineWidth = state.size;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    if (isPaperGesture()) {
      g.strokeStyle = 'white';
    } else {
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = '#000';
    }
    g.beginPath();
    g.moveTo(state.lastX, state.lastY);
    g.lineTo(x, y);
    g.stroke();
    g.restore();
    if (state.strokePoints) state.strokePoints.push(x, y);
    // Ластик толщину на экране менял и раньше, но в запись уходил один размер, и
    // пересборка ленты рисовала такой штрих иначе, чем он был нарисован.
    if (state.strokeSizes) state.strokeSizes.push(state.size);
    composite();
    state.lastX = x;
    state.lastY = y;
  } else if (SHAPE_TOOLS.includes(t)) {
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    drawShape(previewCtx, t, state.startX, state.startY, x, y);
    composite();
  } else if (t === 'select' || t === 'crop' || t === 'quad') {
    const sx = Math.min(state.startX, x);
    const sy = Math.min(state.startY, y);
    const sw = Math.abs(x - state.startX);
    const sh = Math.abs(y - state.startY);
    state.selection = {x: sx, y: sy, w: sw, h: sh};
    updateSelectionOverlay();
    document.getElementById('sel-size').textContent = `${Math.round(sw)} × ${Math.round(sh)}`;
  }
}

function onUp(e) {
  if (state.draggingFloating) {
    state.draggingFloating = false;
    return;
  }
  if (state.resizingFloating) {
    state.resizingFloating = false;
    state.resizeHandle = null;
    return;
  }
  if (!state.drawing) return;
  state.drawing = false;
  selOverlay.classList.remove('drawing');

  const t = state.tool;

  if (t === 'pencil' || t === 'brush' || t === 'marker') {
    mergePreviewStroke(t);
    // Ползунок прозрачности начинается с нуля, дотянуть до него - одно движение.
    // Мазок при этом не кладёт ни одного пикселя, и молча это неотличимо от поломки.
    if (state.opacity <= 0) hint(INK_HINT);
    saveHistory(t === 'marker' ? 'Маркер' : 'Штрих', {
      kind: 'stroke', tool: t, points: state.strokePoints.slice(),
      sizes: state.strokeSizes.slice(),
      color: state.color, size: state.strokeSizes[0], opacity: state.opacity,
      seed: state.strokeSeed,
      layerId: state.strokeLayerId
    });
  } else if (t === 'eraser') {
    saveHistory('Ластик', {
      kind: 'erase', points: state.strokePoints.slice(),
      sizes: state.strokeSizes.slice(),
      size: state.strokeSizes[0], layerId: state.strokeLayerId
    });
  } else if (SHAPE_TOOLS.includes(t)) {
    const {x, y} = getPos(e);
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    drawShape(previewCtx, t, state.startX, state.startY, x, y);
    mergePreviewStroke(t);
    if (state.opacity <= 0) hint(INK_HINT);
    saveHistory('Фигура', {
      kind: 'shape', tool: t,
      x0: state.startX, y0: state.startY, x1: x, y1: y,
      color: state.color, size: state.size, opacity: state.opacity,
      fillMode: state.fillMode, layerId: state.strokeLayerId
    });
  } else if (t === 'select') {
    const sel = normalizeSelection();
    if (sel && sel.w > 2 && sel.h > 2) {
      // Помечаем, что выделение готово к перемещению. Сам подъём пикселей и стирание
      // фона происходят при клике внутрь (promoteSelectionToFloating), а не сейчас —
      // так холст не трогается, пока пользователь не начал двигать.
      state.selectionReady = true;
    } else {
      // Нижняя граница у рамки есть, и она разумна. Но пока рамка пропадала молча, это
      // выглядело так, будто выделение просто не работает.
      if (sel && (sel.w > 0 || sel.h > 0)) hint('Рамка слишком мала: протяните её шире.');
      hideSelection();
    }
  } else if (t === 'crop') {
    const sel = normalizeSelection();
    if (sel && sel.w > 2 && sel.h > 2) {
      state.cropping = true;
      showCropControls();
    } else {
      if (sel && (sel.w > 0 || sel.h > 0)) hint('Рамка обрезки слишком мала: протяните её шире.');
      hideSelection();
    }
  } else if (t === 'quad') {
    // Polygon-selection. promote БЕЗ стирания bbox — pickup идентичен canvas,
    // визуально нет «дырки». originalQuad НЕ сохраняем сразу — он будет сделан
    // как snapshot ТЕКУЩЕЙ формы при первом translate/scale/rotate. Так пользователь
    // может свободно менять форму corner-drag без побочного стирания canvas.
    const sel = normalizeSelection();
    if (sel && sel.w >= 20 && sel.h >= 20) {
      const f = promoteSelectionToFloating({ eraseBbox: false });
      if (f) {
        f.quad = [
          { x: f.x,       y: f.y       },
          { x: f.x + f.w, y: f.y       },
          { x: f.x + f.w, y: f.y + f.h },
          { x: f.x,       y: f.y + f.h }
        ];
        f.originalQuad = null; // snapshot будет сделан в ensureOriginalQuadErased
        // Снимок берём заново: quad появился уже после promote, и без этого
        // «подняли и не тронули» выглядело бы как изменение формы.
        rememberFloatingOrigin(f);
        renderFloating();
      }
    } else {
      if (sel && (sel.w > 0 || sel.h > 0)) hint('Для полигона нужна рамка не меньше 20 на 20 пикселей.');
      hideSelection();
    }
  }
}

// ============ ПРОЗРАЧНОСТЬ: ОДНО НАЛОЖЕНИЕ НА МАЗОК ============
// Инвариант: ctx.globalAlpha всегда 1 вне пар save/restore. Прозрачность
// накладывается ровно один раз - когда готовый мазок переносится с previewCanvas
// на холст. Прежний applyBrushStyle писал state.opacity прямо в ctx и не возвращал
// обратно, а globalAlpha - состояние контекста, а не операции: значение оставалось
// висеть, и следующий Ctrl+Z, «Очистить холст», поворот, отражение или открытие
// файла рисовали полупрозрачно. Одна отмена после мазка с прозрачностью 40%
// делала весь лист прозрачным на 60%.
//
// Побочная выгода та же, ради которой так уже был сделан маркер: перекрытия
// round-cap в стыках сегментов не складываются, и мазок при opacity<1 не
// превращается в цепочку тёмных пятен.

// Итоговая альфа мазка. Маркер всегда бледнее заданного - он маркер.
function strokeAlphaFor(tool) {
  return tool === 'marker' ? state.opacity * 0.4 : state.opacity;
}

// Начать мазок в буфере: рисуем непрозрачно, а видимую прозрачность на время
// рисования даёт CSS-слой previewCanvas.
function beginPreviewStroke(tool) {
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCtx.globalAlpha = 1;
  previewCanvas.style.opacity = String(strokeAlphaFor(tool));
  // Мазок по нижнему слою во время протяжки лежал ПОВЕРХ верхних, а на отпускании нырял
  // под них: картинка прыгала в момент, когда пользователь уже отвёл руку. Поэтому на
  // время жеста превью убирается из отдельного холста и подкладывается в сборку ровно
  // туда, где лежит его слой. В WPF-версии это 1.12.0.
  state.previewLayerId = gestureLayer().id;
  state.previewAlpha = strokeAlphaFor(tool);
  previewCanvas.style.visibility = 'hidden';
  composite();
}

// Перенести готовый мазок из буфера на холст. Единственное место, где
// прозрачность вообще применяется к ctx.
function mergePreviewStroke(tool) {
  const g = gctx();
  g.save();
  g.globalAlpha = strokeAlphaFor(tool);
  g.drawImage(previewCanvas, 0, 0);
  g.restore();
  state.previewLayerId = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCanvas.style.opacity = '';
  previewCanvas.style.visibility = '';
  composite();
}

function applyStrokeStyle(g) {
  g.strokeStyle = state.color;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.globalAlpha = 1;
  g.lineWidth = strokeWidthFor(state.tool, state.size);
}

// Рисует всегда в previewCanvas и всегда непрозрачно: альфу накладывает
// mergePreviewStroke. У режима «контур + заливка» это заодно убирает двойное
// наложение на границе, где обводка ложилась поверх заливки.
function drawShape(context, type, x1, y1, x2, y2) {
  context.strokeStyle = state.color;
  context.fillStyle = state.color;
  context.lineWidth = state.size;
  context.lineCap = 'round';
  context.lineJoin = 'round';
  context.globalAlpha = 1;

  const doFill = state.fillMode === 'solid' || state.fillMode === 'both';
  const doStroke = state.fillMode === 'outline' || state.fillMode === 'both';

  context.beginPath();

  if (type === 'line') {
    context.moveTo(x1, y1);
    context.lineTo(x2, y2);
    context.stroke();
  } else if (type === 'rect') {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    context.rect(x, y, w, h);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'ellipse') {
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
    context.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'triangle') {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    context.moveTo(x + w / 2, y);
    context.lineTo(x, y + h);
    context.lineTo(x + w, y + h);
    context.closePath();
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'right-triangle') {
    // Прямой угол ставится по направлению жеста: катеты выходят из точки старта,
    // а гипотенуза ложится ровно на линию, которую ведёт мышь. Габарит здесь
    // намеренно не нормализуется - в отличие от равнобедренного треугольника,
    // которому направление безразлично, здесь оно и решает, куда смотрит угол.
    context.moveTo(x1, y1);
    context.lineTo(x1, y2);
    context.lineTo(x2, y2);
    context.closePath();
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'star') {
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const r = Math.min(Math.abs(x2 - x1), Math.abs(y2 - y1)) / 2;
    drawStar(context, cx, cy, 5, r, r * 0.4);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'arrow') {
    const headLen = Math.max(15, state.size * 3);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    context.moveTo(x1, y1);
    context.lineTo(x2, y2);
    context.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
    context.moveTo(x2, y2);
    context.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
    context.stroke();
  } else if (type === 'heart') {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    drawHeart(context, x, y, w, h);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  }
}

function drawStar(c, cx, cy, spikes, outer, inner) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  c.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    c.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    c.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  c.lineTo(cx, cy - outer);
  c.closePath();
}

function drawHeart(c, x, y, w, h) {
  const topCurveHeight = h * 0.3;
  c.moveTo(x + w / 2, y + topCurveHeight);
  c.bezierCurveTo(x + w / 2, y, x, y, x, y + topCurveHeight);
  c.bezierCurveTo(x, y + (h + topCurveHeight) / 2, x + w / 2, y + (h + topCurveHeight) / 1.3, x + w / 2, y + h);
  c.bezierCurveTo(x + w / 2, y + (h + topCurveHeight) / 1.3, x + w, y + (h + topCurveHeight) / 2, x + w, y + topCurveHeight);
  c.bezierCurveTo(x + w, y, x + w / 2, y, x + w / 2, y + topCurveHeight);
  c.closePath();
}

// Заливка (flood fill) с учётом прозрачности.
// Возвращает true, если хоть один пиксель изменился: по этому вызывающий код решает,
// писать ли запись в историю.
function floodFill(x, y, fillHex) {
  const w = canvas.width, h = canvas.height;
  // Клик у самого правого или нижнего края даёт после Math.floor координату, равную
  // размеру холста: getPixel читает за буфер и возвращает undefined, заливать нечего.
  if (x < 0 || y < 0 || x >= w || y >= h) return false;

  // Читаем СБОРКУ - пользователь целится в то, что видит, - а кладём в активный слой.
  // Иначе клик по пикселю верхнего слоя заливал бы по цвету бумаги под ним.
  const img = ctx.getImageData(0, 0, w, h);
  const data = img.data;
  const alpha = state.opacity;

  const target = getPixel(data, x, y, w);
  const fillRgb = hexToRgbArr(fillHex);

  // Если цвет заливки такой же как целевой при непрозрачности 100% - выходим
  if (alpha >= 1 && colorsMatch(target, fillRgb)) return false;

  // Флаги посещённых пикселей. Без них при непрозрачности меньше 100% и цвете
  // заливки, близком к исходному, смешанный результат остаётся в пределах
  // допуска colorsMatch, пиксель совпадает с target снова и соседи кладут его
  // в стек заново - стек растёт бесконечно и приложение зависает.
  // Стек плоский (x, y, x, y, ...), а не массив пар: на заливке во весь экран
  // пар набегают миллионы, и каждая - отдельный объект для сборщика мусора.
  // Одна карта на два вопроса вместо двух массивов: бит 1 - «смотрели», бит 2 - «закрасили».
  // Просмотренный пиксель - ещё не залитый: обход помечает и те, что не подошли по цвету,
  // а класть в слой надо ровно закрашенные. Две отдельные карты стоили по четверти холста
  // каждая; в WPF-версии ту же карту в 1.22.0 сжали до битов по той же причине.
  const seen = new Uint8Array(w * h);
  const SEEN = 1, TOUCHED = 2;
  const stack = [x, y];
  let filled = 0;
  // Габарит закрашенного: заплатка заводится по нему, а не во весь холст.
  let minX = w, minY = h, maxX = -1, maxY = -1;
  while (stack.length) {
    const cy = stack.pop();
    const cx = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const seenIdx = cy * w + cx;
    if (seen[seenIdx] & SEEN) continue;
    seen[seenIdx] |= SEEN;
    const p = getPixel(data, cx, cy, w);
    if (!colorsMatch(p, target)) continue;
    // Смешиваем с учётом прозрачности: new = bg * (1-a) + fill * a
    const r = Math.round(p[0] * (1 - alpha) + fillRgb[0] * alpha);
    const g = Math.round(p[1] * (1 - alpha) + fillRgb[1] * alpha);
    const b = Math.round(p[2] * (1 - alpha) + fillRgb[2] * alpha);
    setPixel(data, cx, cy, w, [r, g, b]);
    seen[seenIdx] |= TOUCHED;
    if (cx < minX) minX = cx;
    if (cy < minY) minY = cy;
    if (cx > maxX) maxX = cx;
    if (cy > maxY) maxY = cy;
    filled++;
    stack.push(cx + 1, cy, cx - 1, cy, cx, cy + 1, cx, cy - 1);
  }
  if (!filled) return false;
  // Кладём только залитое, и заплатку заводим ПО ГАБАРИТУ закрашенного, а не во весь
  // холст: заливка внутри рамки трогает малую часть картинки, а холст под заплатку
  // просился целиком. putImageData тут не годится - она заменила бы и незакрашенные
  // пиксели внутри габарита, расплющив стопку.
  const pw = maxX - minX + 1;
  const ph = maxY - minY + 1;
  const patch = makeLayerCanvas(pw, ph);
  const pg = patch.getContext('2d');
  const pid = pg.createImageData(pw, ph);
  const pd = pid.data;
  for (let py = 0; py < ph; py++) {
    for (let px = 0; px < pw; px++) {
      const src = (py + minY) * w + (px + minX);
      if (!(seen[src] & TOUCHED)) continue;
      const j = src * 4;
      const k = (py * pw + px) * 4;
      pd[k] = data[j]; pd[k + 1] = data[j + 1]; pd[k + 2] = data[j + 2]; pd[k + 3] = 255;
    }
  }
  pg.putImageData(pid, 0, 0);
  const g = lctx();
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.drawImage(patch, minX, minY);
  g.restore();
  composite();
  return true;
}

function getPixel(d, x, y, w) {
  const i = (y * w + x) * 4;
  return [d[i], d[i+1], d[i+2], d[i+3]];
}

function setPixel(d, x, y, w, c) {
  const i = (y * w + x) * 4;
  d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2]; d[i+3] = 255;
}

function colorsMatch(a, b, tol = 2) {
  return Math.abs(a[0] - b[0]) <= tol && Math.abs(a[1] - b[1]) <= tol && Math.abs(a[2] - b[2]) <= tol;
}

function hexToRgbArr(hex) {
  return [parseInt(hex.slice(1,3), 16), parseInt(hex.slice(3,5), 16), parseInt(hex.slice(5,7), 16)];
}

// Выделение UI
function updateSelectionOverlay() {
  if (!state.selection) { hideSelection(); return; }
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  const wPx = state.selection.w * scaleX;
  const hPx = state.selection.h * scaleY;
  selOverlay.style.display = 'block';
  selOverlay.style.left = (state.selection.x * scaleX) + 'px';
  selOverlay.style.top = (state.selection.y * scaleY) + 'px';
  selOverlay.style.width = wPx + 'px';
  selOverlay.style.height = hPx + 'px';
  // На малых выделениях скрываем side-handles, чтобы corner'ы не наезжали друг на друга
  selOverlay.classList.toggle('small-x', wPx < 50);
  selOverlay.classList.toggle('small-y', hPx < 50);
}

// Приводим выделение к целым пикселям и зажимаем границами холста сразу, как
// только пользователь отпустил мышь. Дробные границы дважды пересэмплировали
// картинку: подъём во floating округлял размер снимка, а укладка обратно рисовала
// его в дробный прямоугольник, и выделение мылилось от одного перетаскивания.
// Заодно это чинит рамку, уехавшую за край: mousemove координаты не ограничивал,
// и протяжка мимо холста давала выделение с отрицательным x.
function normalizeSelection() {
  if (!state.selection) return null;
  const sel = state.selection;
  const x = Math.max(0, Math.min(canvas.width, Math.round(sel.x)));
  const y = Math.max(0, Math.min(canvas.height, Math.round(sel.y)));
  const w = Math.max(0, Math.min(canvas.width - x, Math.round(sel.x + sel.w) - x));
  const h = Math.max(0, Math.min(canvas.height - y, Math.round(sel.y + sel.h) - y));
  state.selection = { x, y, w, h };
  updateSelectionOverlay();
  document.getElementById('sel-size').textContent = `${w} × ${h}`;
  return state.selection;
}

function hideSelection() {
  selOverlay.style.display = 'none';
  state.selection = null;
  state.selectionReady = false;
  document.getElementById('sel-size').textContent = '—';
}

function commitSelection() {
  state.selectionReady = false;
}

function showCropControls() {
  if (!state.selection) return;
  cropControls.style.display = 'flex';
  positionCropControls();
}

// Кнопки «Применить / Отмена» привязаны к нижнему краю выделения и обязаны ехать
// вместе с ним при зуме, панораме и прокрутке. Раньше позиция считалась один раз,
// при показе, и кнопки отрывались от рамки на первом же изменении масштаба.
function positionCropControls() {
  if (cropControls.style.display !== 'flex' || !state.selection) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  cropControls.style.left = (state.selection.x * scaleX) + 'px';
  cropControls.style.top = ((state.selection.y + state.selection.h) * scaleY + 8) + 'px';
}

// Всё, что нарисовано поверх холста в экранных координатах: рамка выделения, рамка
// плавающего объекта, кнопки обрезки, редактор текста с тулбаром. Все они считаются
// от одного и того же getBoundingClientRect, значит и звать их надо одним вызовом.
// Пока список был скопирован в четыре места, два из них отставали: обработчик
// resize не знал про редактор текста, а про кнопки обрезки не знал никто.
function updateOverlays() {
  updateSelectionOverlay();
  updateFloatingFrame();
  positionCropControls();
  positionTextOverlay();
}

// Потолок размера холста. Лишний ноль в поле ширины давал canvas.width = 99999:
// буфер такого размера браузер молча не выделяет, холст становится нерисуемым, а
// рисунок пропадает без предупреждения и без возможности вернуть. Пределы те же,
// что в WPF-версии (ResizeCanvasCommand.MaxDimension / MaxPixels).
const MAX_CANVAS_SIDE = 20000;
const MAX_CANVAS_PIXELS = 120000000;
// Нижняя граница для поля ввода. Перетаскивание ручки холста зажимается своим
// минимумом в clampCanvasSize: отказывать посреди жеста некуда.
const MIN_CANVAS_SIDE = 10;

function canvasSizeAllowed(w, h) {
  return w >= 1 && h >= 1
      && w <= MAX_CANVAS_SIDE && h <= MAX_CANVAS_SIDE
      && w * h <= MAX_CANVAS_PIXELS;
}

// Зажать размер в допустимые пределы, сохранив пропорции. Нужно при перетаскивании
// ручки холста: там отказывать посреди жеста некуда, проще не дать выйти за край.
function clampCanvasSize(w, h) {
  w = Math.min(Math.max(50, w), MAX_CANVAS_SIDE);
  h = Math.min(Math.max(50, h), MAX_CANVAS_SIDE);
  if (w * h > MAX_CANVAS_PIXELS) {
    const k = Math.sqrt(MAX_CANVAS_PIXELS / (w * h));
    w = Math.max(50, Math.floor(w * k));
    h = Math.max(50, Math.floor(h * k));
  }
  return { w, h };
}

// Единственная точка смены размера холста. У <canvas> буферный размер
// (width/height) и экранный (style.width/height) независимы: присвоение
// width сбрасывает буфер, но CSS-размер остаётся прежним, и картинка
// оказывается растянутой в старую рамку. Поэтому applyZoom() здесь обязателен,
// и звать его руками на каждом вызывающем месте больше не нужно.
function setCanvasSize(w, h) {
  // Проверка размера стояла в диалоге и в ручке, а здесь - нигде: любой новый вызов
  // повторил бы ошибку заново. Вырожденный размер оставляет холсты слоёв нулевыми, и
  // дальше падает КАЖДАЯ операция - приложение не чинится ничем, кроме перезапуска.
  w = Math.round(Number(w));
  h = Math.round(Number(h));
  if (!isFinite(w) || !isFinite(h) || w < 1 || h < 1) return false;
  canvas.width = w;
  canvas.height = h;
  previewCanvas.width = w;
  previewCanvas.height = h;
  // Слой обязан быть того же размера, что документ: рисовать по слою за его краем
  // нельзя, а холст меняют поворот, обрезка, открытие файла и смена размера.
  // В WPF-версии слой, восстановленный в размерах прежнего холста, чинили в 1.13.0.
  for (const l of state.layers) {
    if (l.canvas.width !== w || l.canvas.height !== h) {
      const next = makeLayerCanvas(w, h);
      next.getContext('2d').drawImage(l.canvas, 0, 0);
      l.canvas = next;
    }
  }
  applyZoom();
  return true;
}

function applyCrop() {
  if (!state.selection) return;
  // Сначала зафиксировать плавающий объект, чтобы он попал в обрезку, а не
  // потерялся вне новых границ.
  if (state.floating) commitFloating();
  const s = state.selection;
  // Округляем до целых пикселей до всех вычислений: getImageData дробные
  // аргументы округляет, а canvas.width их отбрасывает - на выделении шириной
  // 100.7 буфер стал бы 100, а снимок 101, и правый столбец обрезался бы.
  const cx = Math.max(0, Math.round(s.x));
  const cy = Math.max(0, Math.round(s.y));
  const cw = Math.max(1, Math.min(Math.round(s.w), canvas.width - cx));
  const ch = Math.max(1, Math.min(Math.round(s.h), canvas.height - cy));
  transformLayers(cw, ch, (g, src) => g.drawImage(src, -cx, -cy));
  setCanvasSize(cw, ch);
  composite();
  updateCanvasInfo();
  hideSelection();
  cropControls.style.display = 'none';
  state.cropping = false;
  saveHistory('Обрезка');
}

function cancelCrop() {
  hideSelection();
  cropControls.style.display = 'none';
  state.cropping = false;
}

// История undo/redo. Каждая запись — { url, label }: url для восстановления,
// label для списка в панели «История изменений».
// Сколько байт держит история. Длина base64-строки и есть её вес в памяти.
function historyBytes() {
  let total = 0;
  for (const entry of state.history) {
    total += entry.url.length;
    for (const l of entry.layers) total += l.url.length;
  }
  return total;
}

/**
 * Поставить стопку слоёв ровно такой, какой её запомнил кадр.
 *
 * Слоёв в кадре сколько угодно, и каждый грузится своей картинкой. Ждём все: собрать
 * стопку из половины загруженных значит показать не тот документ. Битый кадр случиться
 * не должен, но повиснуть на нём насовсем - хуже, поэтому onerror отдаёт пустой слой, а
 * не оставляет холст запертым.
 */
function applyStack(entry) {
  if (!entry || !entry.layers) return Promise.resolve();
  const loads = entry.layers.map((meta) => new Promise((done) => {
    const img = new Image();
    img.onload = () => done(img);
    img.onerror = () => done(null);
    img.src = meta.url;
  }));
  return Promise.all(loads).then((imgs) => {
    if (canvas.width !== entry.w || canvas.height !== entry.h) {
      setCanvasSize(entry.w, entry.h);
      updateCanvasInfo();
    }
    // Холсты слоёв ПЕРЕИСПОЛЬЗУЕМ, когда стопка того же размера: пересоздание просило по
    // холсту на каждый слой, и на время подмены в памяти жили обе стопки сразу - двойной
    // пик на каждой отмене. Чистим и рисуем в те же.
    const reuse = state.layers.length === entry.layers.length
      && state.layers.every((l) => l.canvas.width === entry.w && l.canvas.height === entry.h);
    state.layers = entry.layers.map((meta, i) => {
      const l = reuse ? state.layers[i] : makeLayer(meta.name, entry.w, entry.h);
      if (meta.id != null) l.id = meta.id;
      l.name = meta.name;
      l.visible = meta.visible;
      l.opacity = meta.opacity;
      const g = l.canvas.getContext('2d');
      g.clearRect(0, 0, entry.w, entry.h);
      if (imgs[i]) g.drawImage(imgs[i], 0, 0);
      return l;
    });
    // Счётчик не должен выдать номер, который уже занят восстановленным слоем.
    for (const l of state.layers) if (l.id > layerSeq) layerSeq = l.id;
    state.activeLayer = Math.min(entry.active || 0, state.layers.length - 1);
    composite();
    renderLayersPanel();
  });
}

/**
 * Повторить одну складывающуюся правку поверх текущего состояния слоёв.
 *
 * Именно повторить, а не наложить сохранённые пиксели: если правку ниже выключили,
 * подложка стала другой, и заливка обязана растечься по-новому. Сохранённая заплатка
 * этого не умеет и соврала бы.
 */
/**
 * Размер у k-й точки записанного штриха. С 1.17.0 он записан у каждой точки (колесо
 * меняет размер посреди штриха); у записей постарше - один на весь штрих.
 */
function sizeAtPoint(r, k) {
  return r.sizes && r.sizes.length > k ? r.sizes[k] : r.size;
}

function replayEntry(r) {
  if (!r) return;
  const layer = state.layers.find((x) => x.id === r.layerId);
  if (!layer) return;
  const g = layer.canvas.getContext('2d');
  const isPaper = state.layers.length > 0 && state.layers[0].id === r.layerId;

  if (r.kind === 'stroke' || r.kind === 'shape') {
    // Рисуем во временный холст и кладём его целиком с нужной прозрачностью - ровно
    // так же, как это делает превью с mergePreviewStroke. Иначе перекрытия сегментов
    // внутри одного штриха темнеют, и повтор расходится с оригиналом.
    const tmp = makeLayerCanvas(canvas.width, canvas.height);
