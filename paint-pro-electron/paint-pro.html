      // хотя cancelFloating для этого и написан. В WPF-версии Escape отменяет
      // с самого начала (инвариант 11 в README).
      e.preventDefault();
      cancelFloating();
      return;
    }
    commitSelection();
    hideSelection();
    cropControls.style.display = 'none';
    state.cropping = false;
    if (textEditor.style.display === 'block') {
      textEditor.style.display = 'none';
      textEditor.innerHTML = '';
      textToolbar.classList.remove('active');
    }
  }
  if (e.key === 'Enter' && state.floating && !e.ctrlKey) {
    // Enter при плавающем = применить
    if (document.activeElement !== textEditor) {
      commitFloating();
    }
  }
});

// Перемасштабирование overlay при скролле
document.getElementById('canvas-area').addEventListener('scroll', updateOverlays);
window.addEventListener('resize', updateOverlays);

// ============ МАСШТАБИРОВАНИЕ ХОЛСТА (RESIZE) ============
// Восемь ручек по краям холста, как у выделения: четыре стороны и четыре угла.
// Контент сохраняется, пустое добавленное пространство заливается белым.
//
// Стороны делятся на две породы. Правая и нижняя двигают только край: рисунок стоит
// на месте. Левая и верхняя двигают НАЧАЛО холста, поэтому рисунок обязан сдвинуться
// вместе с ним - иначе «потянул влево» выглядит как «рисунок прыгнул вправо». Всю эту
// разницу несёт одно число - смещение, которое уходит в growLayers.

/** Куда смотрит каждая ручка. Буквы складываются: 'nw' - и влево, и вверх. */
const CANVAS_HANDLES = ['nw', 'n', 'ne', 'w', 'e', 'sw', 's', 'se'];

const CANVAS_HANDLE_CURSOR = {
  n: 'ns-resize', s: 'ns-resize', w: 'ew-resize', e: 'ew-resize',
  nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
};

/**
 * Новый размер холста и смещение рисунка для одной ручки.
 *
 * Вынесено отдельно, потому что это единственное место, где легко ошибиться знаком, и
 * единственное, что можно проверить, не двигая мышь.
 */
function canvasResizeGeometry(dir, startW, startH, dm, dn, keepRatio) {
  let w = dir.includes('e') ? startW + dm : dir.includes('w') ? startW - dm : startW;
  let h = dir.includes('s') ? startH + dn : dir.includes('n') ? startH - dn : startH;
  w = Math.max(50, Math.round(w));
  h = Math.max(50, Math.round(h));

  // Shift на углу держит пропорции. На стороне держать нечего: сторона одна.
  if (keepRatio && dir.length === 2) {
    const ratio = startW / startH;
    if (w / h > ratio) w = Math.round(h * ratio);
    else h = Math.round(w / ratio);
    w = Math.max(50, w);
    h = Math.max(50, h);
  }

  ({ w, h } = clampCanvasSize(w, h));

  // Куда попадёт прежний левый верхний угол. Считается ПОСЛЕ всех ограничений: упрись
  // размер в потолок - смещение обязано упереться вместе с ним, иначе рисунок уедет
  // дальше, чем выросла бумага.
  return {
    w, h,
    offX: dir.includes('w') ? w - startW : 0,
    offY: dir.includes('n') ? h - startH : 0,
  };
}

const resizePreview = document.getElementById('resize-preview');
const resizeTooltip = document.getElementById('resize-tooltip');

let canvasResizeState = null;

function startCanvasResize(direction, e) {
  e.preventDefault();
  e.stopPropagation();
  // Применить floating и текст, если активны
  if (state.floating) commitFloating();
  if (textEditor.style.display === 'block') commitText();

  canvasResizeState = {
    direction: direction,
    startMouseX: e.clientX,
    startMouseY: e.clientY,
    startW: canvas.width,
    startH: canvas.height,
    curW: canvas.width,
    curH: canvas.height,
    offX: 0,
    offY: 0
  };

  // Показываем превью - размер текущего холста
  const rect = canvas.getBoundingClientRect();
  resizePreview.style.display = 'block';
  resizePreview.style.width = rect.width + 'px';
  resizePreview.style.height = rect.height + 'px';

  resizeTooltip.style.display = 'block';
  updateResizeTooltip(e, canvas.width, canvas.height);

  resizePreview.style.left = '0px';
  resizePreview.style.top = '0px';
  document.body.style.cursor = CANVAS_HANDLE_CURSOR[direction] || 'nwse-resize';
}

function onCanvasResizeMove(e) {
  if (!canvasResizeState) return;
  e.preventDefault();

  const dx = e.clientX - canvasResizeState.startMouseX;
  const dy = e.clientY - canvasResizeState.startMouseY;
  // Учитываем текущий zoom - тянем в "экранных" пикселях, но меняем реальный размер холста
  const scale = state.zoom || 1;

  const g = canvasResizeGeometry(
    canvasResizeState.direction,
    canvasResizeState.startW, canvasResizeState.startH,
    Math.round(dx / scale), Math.round(dy / scale),
    e.shiftKey);

  canvasResizeState.curW = g.w;
  canvasResizeState.curH = g.h;
  canvasResizeState.offX = g.offX;
  canvasResizeState.offY = g.offY;

  // Превью-рамка в экранных пикселях. Начало координат тут - прежний левый верхний угол
  // холста, а новый холст стоит от него на -offX: тянут влево - рамка уходит влево.
  resizePreview.style.left = (-g.offX * scale) + 'px';
  resizePreview.style.top = (-g.offY * scale) + 'px';
  resizePreview.style.width = (g.w * scale) + 'px';
  resizePreview.style.height = (g.h * scale) + 'px';

  updateResizeTooltip(e, g.w, g.h);
}

function updateResizeTooltip(e, w, h) {
  resizeTooltip.textContent = `${w} × ${h} px`;
  resizeTooltip.style.left = (e.clientX + 16) + 'px';
  resizeTooltip.style.top = (e.clientY + 16) + 'px';
}

function finishCanvasResize() {
  if (!canvasResizeState) return;
  const newW = canvasResizeState.curW;
  const newH = canvasResizeState.curH;
  const oldW = canvasResizeState.startW;
  const oldH = canvasResizeState.startH;

  if (newW !== oldW || newH !== oldH) {
    // Сохраняем текущий контент, сдвинув его вслед за сдвинувшимся началом холста
    growLayers(newW, newH, canvasResizeState.offX, canvasResizeState.offY);
    setCanvasSize(newW, newH);
    composite();
    updateCanvasInfo();
    saveHistory('Размер холста');
  }

  canvasResizeState = null;
  resizePreview.style.display = 'none';
  resizeTooltip.style.display = 'none';
  document.body.style.cursor = '';
  applyZoom();
}

// Навешиваем обработчики на все восемь ручек
CANVAS_HANDLES.forEach(dir => {
  const el = document.getElementById('canvas-handle-' + dir);
  el.addEventListener('mousedown', (e) => startCanvasResize(dir, e));
});

document.addEventListener('mousemove', onCanvasResizeMove);
document.addEventListener('mouseup', finishCanvasResize);

// ============ HAND TOOL (перетаскивание холста) ============
state.panX = 0;
state.panY = 0;

function applyPan() {
  wrapper.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
  updateOverlays();
}

function resetPan() {
  state.panX = 0;
  state.panY = 0;
  applyPan();
}

(function() {
  const area = document.getElementById('canvas-area');
  let panning = false;
  let startMouseX = 0, startMouseY = 0;
  let startPanX = 0, startPanY = 0;
  let startScrollX = 0, startScrollY = 0;

  area.addEventListener('mousedown', (e) => {
    if (state.tool !== 'hand') return;
    if (e.button !== 0) return;
    panning = true;
    startMouseX = e.clientX;
    startMouseY = e.clientY;
    startPanX = state.panX;
    startPanY = state.panY;
    startScrollX = area.scrollLeft;
    startScrollY = area.scrollTop;
    canvas.classList.add('panning');
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!panning) return;
    const dx = e.clientX - startMouseX;
    const dy = e.clientY - startMouseY;
    // Сначала пытаемся прокрутить — если есть overflow
    const maxScrollX = area.scrollWidth - area.clientWidth;
    const maxScrollY = area.scrollHeight - area.clientHeight;
    let newScrollX = startScrollX - dx;
    let newScrollY = startScrollY - dy;
    let clampedX = Math.max(0, Math.min(maxScrollX, newScrollX));
    let clampedY = Math.max(0, Math.min(maxScrollY, newScrollY));
    area.scrollLeft = clampedX;
    area.scrollTop  = clampedY;
    // Остаток — двигаем через transform
    const overshootX = newScrollX - clampedX; // отрицательное если ушли влево, положительное если вправо
    const overshootY = newScrollY - clampedY;
    state.panX = startPanX - overshootX;
    state.panY = startPanY - overshootY;
    applyPan();
  });

  document.addEventListener('mouseup', () => {
    if (!panning) return;
    panning = false;
    canvas.classList.remove('panning');
  });
})();

// ============ ZOOM (масштаб отображения холста) ============
// Меняет CSS transform canvas-wrapper, не трогает реальные размеры

state.zoom = 1;
// Тот же набор, что в WPF (GeometryMath.NextZoomStep). Здесь не хватало 0.67, и одна
// и та же кнопка «уменьшить» с 75% уводила в разных версиях в разные места.
const ZOOM_STEPS = [0.1, 0.25, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 3, 4, 6, 8];

function applyZoom() {
  // setCanvasSize зовёт applyZoom и может сработать раньше, чем ниже по файлу
  // выставится state.zoom — без запасной единицы размеры ушли бы в NaN.
  const z = state.zoom || 1;
  // Используем transform: scale на canvas и preview-canvas, но wrapper "рос бы" размером
  // Проще - меняем CSS ширину/высоту canvas элементов
  canvas.style.width = (canvas.width * z) + 'px';
  canvas.style.height = (canvas.height * z) + 'px';
  previewCanvas.style.width = (canvas.width * z) + 'px';
  previewCanvas.style.height = (canvas.height * z) + 'px';
  document.getElementById('zoom-display').textContent = Math.round(z * 100) + '%';
  updateOverlays();
  // Курсор-кружок зависит от зума (пиксели холста × зум = пиксели экрана)
  if (typeof updateBrushCursor === 'function') updateBrushCursor();
}

function zoomIn() {
  const cur = state.zoom;
  const next = ZOOM_STEPS.find(s => s > cur + 0.001);
  // Кнопка нажимается, а ничего не происходит - это выглядит поломкой, хотя это потолок.
  if (!next) { hint('Больше увеличить нельзя: это предел масштаба.'); return; }
  state.zoom = next;
  applyZoom();
}

function zoomOut() {
  const cur = state.zoom;
  const reversed = [...ZOOM_STEPS].reverse();
  const next = reversed.find(s => s < cur - 0.001);
  if (!next) { hint('Меньше уменьшить нельзя: это предел масштаба.'); return; }
  state.zoom = next;
  applyZoom();
}

function zoomReset() {
  state.zoom = 1;
  applyZoom();
}

/**
 * Шаг размера за одну засечку колеса.
 *
 * Ровно один пиксель означал бы 99 засечек на весь ползунок - колесо было бы
 * бесполезно. Шаг растёт вместе с размером: у тонкого карандаша важен каждый
 * пиксель, у стопиксельной кисти - уже нет.
 */
function toolSizeStep(size) {
  return Math.max(1, Math.round(size / 10));
}

/** Курсор над самим холстом, а не над полем вокруг него. */
function pointerOverCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right &&
         e.clientY >= r.top  && e.clientY <= r.bottom;
}

// Колёсико над холстом.
//
// С Ctrl - масштаб, как было. Без Ctrl и над самим холстом - размер кисти или
// ластика, смотря что выбрано: у них своя память размера, и меняется тот, что
// сейчас в руке. Над серым полем вокруг холста колесо не трогаем: там .canvas-area
// прокручивается, и отнять прокрутку значило бы запереть увеличенный холст.
document.getElementById('canvas-area').addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
    return;
  }
  if (!pointerOverCanvas(e) || !toolHasSize()) return;

  e.preventDefault();
  const up = e.deltaY < 0;
  const before = state.size;
  const after = setToolSize(before + (up ? toolSizeStep(before) : -toolSizeStep(before)));
  // Молчаливый отказ читается как поломка: у предела надо сказать, что это предел.
  if (after === before) {
    hint(up ? `Больше некуда: ${MAX_TOOL_SIZE} px - предел размера.`
            : `Меньше некуда: ${MIN_TOOL_SIZE} px - предел размера.`);
  }
}, { passive: false });

// ============ ИНТЕГРАЦИЯ С ELECTRON ============
if (window.electronAPI) {
  // Получаем файл через меню "Файл → Открыть"
  window.electronAPI.onOpenFile((data) => {
    if (data && data.dataUrl) {
      openImageAsDocument(data.dataUrl, data.fileName);
    }
  });

  // Обрабатываем действия нативного меню
  window.electronAPI.onMenuAction((action) => {
    switch (action) {
      case 'new': newCanvas(); break;
      case 'save': saveCanvas(false); break;
      case 'save-as': saveCanvas(true); break;
      case 'undo': undo(); break;
      case 'redo': redo(); break;
      // Условий «есть выделение» тут быть не должно по той же причине, что и в
      // обработчике клавиш: без выделения копируется весь холст, а вырезание
      // объясняет, почему так не может.
      case 'copy': copySelection(); break;
      case 'cut': cutSelection(); break;
      case 'paste': pasteFromClipboard(); break;
      case 'select-all': selectAll(); break;
      case 'deselect': deselect(); break;
      case 'request-close': handleCloseRequest(); break;
      case 'zoom-in': zoomIn(); break;
      case 'zoom-out': zoomOut(); break;
      case 'zoom-reset': zoomReset(); break;
    }
  });

  // Drag & Drop файлов из проводника.
  // dragenter/dragleave стреляют и при переходе между дочерними элементами, а не
  // только на границе окна. Поэтому считаем глубину вложенности: рамка гаснет,
  // когда счётчик вернулся в ноль, а не на первом же dragleave над кнопкой.
  let dragDepth = 0;
  function showDropHint() {
    document.body.style.outline = '3px dashed var(--accent)';
    document.body.style.outlineOffset = '-6px';
  }
  function hideDropHint() {
    dragDepth = 0;
    document.body.style.outline = '';
  }

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    showDropHint();
  });

  document.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    showDropHint();
  });

  document.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) hideDropHint();
  });

  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    hideDropHint();

    const files = Array.from(e.dataTransfer.files || []);
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      const filePath = window.electronAPI.getFilePath(file);
      if (filePath) {
        const result = await window.electronAPI.readDroppedFile(filePath);
        if (result && result.error) { glassAlert('Не удалось открыть файл: ' + result.error); break; }
        if (result && result.dataUrl) {
          openImageAsDocument(result.dataUrl, result.fileName);
          break; // Открываем только первый файл
        }
      } else {
        // Fallback через FileReader
        const reader = new FileReader();
        reader.onload = (ev) => openImageAsDocument(ev.target.result, file.name);
        reader.readAsDataURL(file);
        break;
      }
    }
  });

}

// Открытие через диалог. Ошибку чтения раньше не показывал никто: main-процесс читал
// файл без try/catch, invoke отклонялся, а оба вызывающих места ждали результат без
// catch. Файл удалили после показа диалога, нет прав, отвалился сетевой диск - окно
// закрывалось, и дальше не происходило ровно ничего.
async function openViaDialog() {
  // Без Electron нативного диалога нет - берём обычное поле выбора файла. Страница
  // работает в браузере целиком: это тот же файл, просто открытый двойным щелчком.
  if (!window.electronAPI || !window.electronAPI.openFileDialog) {
    openViaFileInput();
    return;
  }
  try {
    const data = await window.electronAPI.openFileDialog();
    if (!data) return;                       // диалог отменили
    if (data.error) { glassAlert('Не удалось открыть файл: ' + data.error); return; }
    openImageAsDocument(data.dataUrl, data.fileName);
  } catch (err) {
    glassAlert('Не удалось открыть файл: ' + (err && err.message ? err.message : err));
  }
}

/** Открытие через обычное поле выбора файла: путь для браузера. */
function openViaFileInput() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  // Поле должно быть В ДОКУМЕНТЕ: по оторванному от дерева браузер диалог открывать не
  // обязан, и Ctrl+O молча не делал бы ничего. Прячем и убираем сразу после выбора.
  input.style.position = 'fixed';
  input.style.left = '-10000px';
  document.body.appendChild(input);
  const cleanup = () => { if (input.parentNode) input.parentNode.removeChild(input); };
  input.onchange = () => {
    const file = input.files && input.files[0];
    cleanup();
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => glassAlert('Не удалось прочитать файл.');
    reader.onload = () => openImageAsDocument(String(reader.result), file.name);
    reader.readAsDataURL(file);
  };
  // Диалог могли закрыть без выбора - тогда onchange не придёт вовсе.
  input.oncancel = cleanup;
  input.click();
}

// Ctrl+O и пункт «Открыть…» живут ВНЕ блока «только для Electron»: в браузере они
// нужны ровно так же, а раньше лежали внутри - и открытие файла там не работало
// вовсе, молча. Сам openViaDialog разбирается, есть мост или нет.
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
    e.preventDefault();
    openViaDialog();
  }
});

// Перекрываем пункт «Открыть…» в меню «Файл»
const openBtn = document.querySelector('.mb-dd-item[onclick*="file-input"]');
if (openBtn) openBtn.onclick = openViaDialog;

setColor('#000000');
applyZoom();
loadAppVersion();
// Начальный инструмент - карандаш (выставлен в HTML через class="active"),
// показываем соответствующий курсор-круг.
canvas.className = 'tool-' + state.tool;
updateBrushCursor();

// ============ macOS MENU BAR — DROPDOWNS + ЧАСЫ ============
(function setupMenuBar() {
  const menus = document.querySelectorAll('.mb-menu');
  if (!menus.length) return;

  function closeAll() {
    menus.forEach(m => m.classList.remove('open'));
  }

  menus.forEach(menu => {
    const btn = menu.querySelector('.mb-item');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = menu.classList.contains('open');
      closeAll();
      if (!wasOpen) menu.classList.add('open');
    });
    btn.addEventListener('mouseenter', () => {
      // Если уже открыто другое меню — переключаемся, как в macOS
      const anyOpen = document.querySelector('.mb-menu.open');
      if (anyOpen && anyOpen !== menu) {
        closeAll();
        menu.classList.add('open');
      }
    });
  });

  // Клик по пункту dropdown — закрыть
  document.querySelectorAll('.mb-dd-item').forEach(it => {
    it.addEventListener('click', () => setTimeout(closeAll, 0));
  });

  // Клик вне меню / Escape — закрыть
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.mb-menu')) closeAll();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAll();
  });

  // Часы справа
  const timeEl = document.getElementById('mb-time');
  function tick() {
    if (!timeEl) return;
    const d = new Date();
    const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    timeEl.textContent = `${days[d.getDay()]}  ${hh}:${mm}`;
  }
  tick();
  setInterval(tick, 30000);
})();

// ============ RIPPLE НА КНОПКАХ ============
(function setupRipples() {
  function spawnRipple(target, clientX, clientY) {
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.4;
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    r.style.left = (clientX - rect.left) + 'px';
    r.style.top  = (clientY - rect.top)  + 'px';
    // НЕ ставим overflow:hidden на target — это бы обрезало тултипы (.tool::after).
    // Ripple имеет мягкий radial-fade, лёгкий выход за края выглядит как glow.
    const prevPos = target.style.position;
    if (getComputedStyle(target).position === 'static') target.style.position = 'relative';
    target.appendChild(r);

    setTimeout(() => {
      if (r.parentNode) r.remove();
      if (prevPos === '') target.style.position = prevPos;
    }, 700);
  }

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const t = e.target.closest('.tool, .zoom-btn, .sidebar button, .text-toolbar button, .crop-controls button, .mb-dd-item, .menu-btn, .mb-item');
    if (!t) return;
    // Не даём кнопкам забирать фокус — иначе горячие клавиши уходят на нажатую
    // ранее кнопку и не доходят до document-level обработчика.
    e.preventDefault();
    spawnRipple(t, e.clientX, e.clientY);
  });
})();

// ============ ТУЛТИПЫ (data-tip) ============
// ============ ШИРИНА БОКОВЫХ ПАНЕЛЕЙ ============
// Обе панели можно сузить или расширить за внутренний край; ширина запоминается. Пределы
// по содержимому, чтобы ничего не налезало: слева инструменты встают в один, два или три
// столбца, справа восемь образцов палитры в ряд. На узком окне холсту остаётся не меньше
// canvasMin: сначала сужается правая панель, потом левая, а запомненная ширина не
// меняется. Правило и числа - те же, что PanelWidths в WPF-версии (это проверяет её тест).
const PANELS = { leftMin: 88, leftDefault: 142, leftMax: 208, rightMin: 260, rightDefault: 290, rightMax: 420, canvasMin: 300, chrome: 40 };
const PANELS_KEY = 'paintpro.panels';
const clampLeftPanel = (w) => Number.isFinite(w) ? Math.min(Math.max(w, PANELS.leftMin), PANELS.leftMax) : PANELS.leftDefault;
const clampRightPanel = (w) => Number.isFinite(w) ? Math.min(Math.max(w, PANELS.rightMin), PANELS.rightMax) : PANELS.rightDefault;

function fitPanels(left, right, windowWidth) {
  // Целые пиксели и вниз: уложенное укладывается так же ещё раз, без дрожи в знаках.
  left = Math.floor(clampLeftPanel(left));
  right = Math.floor(clampRightPanel(right));
  if (!Number.isFinite(windowWidth)) return [left, right];
  const room = windowWidth - PANELS.chrome - PANELS.canvasMin;
  if (left + right > room) right = Math.max(PANELS.rightMin, Math.floor(room - left));
  if (left + right > room) left = Math.max(PANELS.leftMin, Math.floor(room - right));
  return [left, right];
}

const panelPref = { left: PANELS.leftDefault, right: PANELS.rightDefault };
try {
  const saved = JSON.parse(localStorage.getItem(PANELS_KEY));
  if (saved && typeof saved === 'object') {
    panelPref.left = clampLeftPanel(Number(saved.left));
    panelPref.right = clampRightPanel(Number(saved.right));
  }
} catch (_) { /* нет хранилища или мусор - панели по умолчанию */ }

function savePanels() {
  try { localStorage.setItem(PANELS_KEY, JSON.stringify(panelPref)); } catch (_) { /* не беда */ }
}

function applyPanels() {
  const [l, r] = fitPanels(panelPref.left, panelPref.right, window.innerWidth);
  document.documentElement.style.setProperty('--tools-w', l + 'px');
  document.documentElement.style.setProperty('--side-w', r + 'px');
}
window.addEventListener('resize', applyPanels);
applyPanels();

(function setupPanelGrips() {
  for (const [id, side] of [['grip-left', 'left'], ['grip-right', 'right']]) {
    const grip = document.getElementById(id);
    const panel = document.querySelector(side === 'left' ? '.tools-panel' : '.sidebar');
    let startX = 0, startW = 0;
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      startX = e.clientX;
      startW = panel.getBoundingClientRect().width;
      grip.setPointerCapture(e.pointerId);
      grip.classList.add('dragging');
    });
    grip.addEventListener('pointermove', (e) => {
      if (!grip.hasPointerCapture(e.pointerId)) return;
      const dx = e.clientX - startX;
      // Край правой панели - левый: тянут влево - панель шире.
      if (side === 'left') panelPref.left = clampLeftPanel(startW + dx);
      else panelPref.right = clampRightPanel(startW - dx);
      applyPanels();
    });
    const end = (e) => {
      if (!grip.hasPointerCapture(e.pointerId)) return;
      grip.releasePointerCapture(e.pointerId);
      grip.classList.remove('dragging');
      savePanels();
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
    grip.addEventListener('dblclick', () => {
      if (side === 'left') panelPref.left = PANELS.leftDefault;
      else panelPref.right = PANELS.rightDefault;
      applyPanels();
      savePanels();
    });
  }
})();

(function setupTooltips() {
  const tip = document.getElementById('tip');
  if (!tip) return;
  let current = null;

  function show(target) {
    const text = target.getAttribute('data-tip');
    if (!text) return;
    current = target;
    tip.textContent = text;
    tip.classList.add('show');
    position(target);
  }
  function position(target) {
    const r = target.getBoundingClientRect();
    const left = r.left + r.width / 2;
    const top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hide() {
    current = null;
    tip.classList.remove('show');
  }

  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-tip]');
    if (!t) return;
    if (t === current) return;
    show(t);
  });
  document.addEventListener('mouseout', (e) => {
    const t = e.target.closest('[data-tip]');
    if (!t) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]');
    if (to === t) return;
    hide();
  });
  // Прячем при кликах/прокрутке/смене окна — чтобы не «висел» над открытым меню
  document.addEventListener('mousedown', hide, true);
  window.addEventListener('scroll', hide, true);
  window.addEventListener('blur', hide);
})();
</script>
