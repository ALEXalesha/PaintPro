  state.lastX = x;
  state.lastY = y;

  const t = state.tool;

  // Выделение - проверка, кликнул ли внутри
  if ((t === 'select' || t === 'crop' || t === 'quad') && state.floating && hitFloating(x, y)) {
    ensureOriginalQuadErased();
    state.draggingFloating = true;
    state.dragOffsetX = x - state.floating.x;
    state.dragOffsetY = y - state.floating.y;
    return;
  }
  if ((t === 'select' || t === 'crop' || t === 'quad') && state.floating) {
    // Клик вне floating - применяем
    commitFloating();
  }
  if ((t === 'select' || t === 'crop') && state.selection) {
    const s = state.selection;
    if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
      if (t === 'select' && state.selectionReady) {
        // Поднимаем выделение в floating (drawImage = композитинг с прозрачностью),
        // чтобы двигалось только нарисованное, без белой подложки.
        const f = promoteSelectionToFloating();
        if (f) {
          state.draggingFloating = true;
          state.dragOffsetX = x - f.x;
          state.dragOffsetY = y - f.y;
        }
        return;
      }
    } else {
      commitSelection();
      hideSelection();
    }
  }

  // При других инструментах, если есть floating - применяем.
  // Пипетка - исключение: сэмплит из композита (canvas + floating), сам
  // floating оставляет нетронутым, иначе клик пипеткой бы рушил вставленную
  // картинку.
  if (state.floating && t !== 'select' && t !== 'crop' && t !== 'quad' && t !== 'picker') {
    commitFloating();
  }

  // Спрятанный или полностью прозрачный слой краску съедает молча: на экране не меняется
  // ничего, а запись в ленте появляется. Спрашиваем ДО начала жеста, а не на отпускании:
  // иначе превью штриха уже нарисуется на экране и обманет.
  if ((DRAWING_TOOLS.includes(t) || t === 'fill' || t === 'text') && !canDrawOnActiveLayer()) {
    return;
  }
  state.strokeLayerId = activeLayer().id;
  state.strokePoints = [x, y];

  state.drawing = true;
  // На время рисования bbox прячем handles в selection-overlay — иначе при tiny drag
  // курсор попадает на handle, события не доходят до canvas, и selection застывает.
  if (t === 'select' || t === 'quad' || t === 'crop') {
    selOverlay.classList.add('drawing');
  }

  if (t === 'pencil' || t === 'brush' || t === 'marker') {
    beginPreviewStroke(t);
    applyStrokeStyle(previewCtx);
    previewCtx.beginPath();
    previewCtx.moveTo(x, y);
    previewCtx.lineTo(x + 0.01, y + 0.01);
    previewCtx.stroke();
  } else if (SHAPE_TOOLS.includes(t)) {
    beginPreviewStroke(t);
  } else if (t === 'eraser') {
    // Ластик рисует белым - как в классическом Paint. Так нет проблем с
    // полупрозрачными пикселями и сохранение в PNG/JPEG даёт ожидаемый
    // белый фон.
    const g = gctx();
    g.save();
    g.globalAlpha = 1;
    // На бумаге ластик КРАСИТ белым - как в классическом Paint, и тогда сохранение в
    // PNG/JPEG даёт ожидаемый белый фон. На слое выше бумаги он ВЫЧИТАЕТ: белая краска
    // там закрыла бы то, что лежит ниже, вместо того чтобы открыть его.
    if (isPaperGesture()) {
      g.fillStyle = 'white';
    } else {
      g.globalCompositeOperation = 'destination-out';
      g.fillStyle = '#000';
    }
    g.beginPath();
    g.arc(x, y, state.size / 2, 0, Math.PI * 2);
    g.fill();
    g.restore();
    composite();
  } else if (t === 'fill') {
    // Не безусловный saveHistory: заливка бывает пустой (кликнули по области, уже
    // залитой этим же цветом), а запись нужна только если пиксели изменились. Пустая
    // включает признак несохранённой работы, и приложение спрашивает про сохранение
    // после действия, которое ничего не сделало. В WPF-версии это починено в 1.7.0.
    // Прозрачность в нуле - заливка не положит ни одного пикселя. Молча это выглядит
    // как сломанный инструмент; в WPF-версии то же самое объясняется с 1.20.0.
    if (state.opacity <= 0) {
      hint(INK_HINT);
    } else if (floodFill(Math.floor(x), Math.floor(y), state.color)) {
      saveHistory('Заливка', {
        kind: 'fill', x: Math.floor(x), y: Math.floor(y),
        color: state.color, opacity: state.opacity, layerId: state.strokeLayerId
      });
    }
    state.drawing = false;
  } else if (t === 'picker') {
    // Сэмплим из композита: основной холст + текущий floating сверху. Так
    // пользователь подбирает цвет ровно того, что видит, не теряя плавающий
    // объект.
    let sampleCtx = ctx;
    if (state.floating) {
      const composite = document.createElement('canvas');
      composite.width = canvas.width;
      composite.height = canvas.height;
      const cc = composite.getContext('2d');
      cc.drawImage(canvas, 0, 0);
      // Через общий рендер, а не голым drawImage: иначе пипетка берёт цвет
      // из неповёрнутого прямоугольника, а не из того, что видит пользователь.
      drawFloatingOnto(cc);
      sampleCtx = cc;
    }
    // Клик у правой или нижней кромки даёт после Math.floor координату, равную размеру
    // холста: getImageData отдаёт нули, и пипетка брала чёрный вместо цвета под курсором.
    // Ровно та же кромка, что чинилась в floodFill.
    const px = Math.min(canvas.width - 1, Math.max(0, Math.floor(x)));
    const py = Math.min(canvas.height - 1, Math.max(0, Math.floor(y)));
    const pixel = sampleCtx.getImageData(px, py, 1, 1).data;
    const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    setColor(hex);
    state.drawing = false;
  } else if (t === 'text') {
    // Применяем предыдущий текст, если был
    if (textEditor.style.display === 'block') commitText();
    startTextEdit(x, y);
    state.drawing = false;
  }
}

function onMove(e) {
  const {x, y} = getPos(e);
  document.getElementById('pos').textContent = `${Math.round(x)}, ${Math.round(y)}`;
  // Pixel preview только когда не идёт активный drag — getImageData дорогой
  if (!state.drawing && !state.draggingFloating && !state.resizingFloating &&
      !state.rotatingFloating && !state.warpingQuad) {
    schedulePixelPreview(x, y);
  }

  // Перетаскивание floating объекта (для quad — сдвигаем и все 4 угла вместе)
  if (state.draggingFloating && state.floating) {
    const nx = x - state.dragOffsetX;
    const ny = y - state.dragOffsetY;
    if (state.floating.quad) {
      const dx = nx - state.floating.x;
      const dy = ny - state.floating.y;
      state.floating.quad.forEach(p => { p.x += dx; p.y += dy; });
    }
    state.floating.x = nx;
    state.floating.y = ny;
    renderFloating();
    return;
  }

  // Resize floating
  if (state.resizingFloating && state.floating) {
    resizeFloating(x, y);
    return;
  }

  // В режиме выделения: показываем move-cursor когда мышь над активным floating
  if (state.tool === 'select' || state.tool === 'quad') {
    if (state.floating && hitFloating(x, y)) {
      canvas.style.cursor = 'move';
    } else if (!state.drawing) {
      canvas.style.cursor = 'crosshair';
    }
  }

  if (!state.drawing) return;

  const t = state.tool;

  if (t === 'pencil' || t === 'brush' || t === 'marker') {
    previewCtx.beginPath();
    previewCtx.moveTo(state.lastX, state.lastY);
    previewCtx.lineTo(x, y);
    previewCtx.stroke();
    state.lastX = x;
    state.lastY = y;
    if (state.strokePoints) state.strokePoints.push(x, y);
    composite();
  } else if (t === 'eraser') {
    // Плавное "стирание" - рисуем белой линией между предыдущей и текущей точкой
    const g = gctx();
    g.save();
    g.globalAlpha = 1;
    g.lineWidth = state.size;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    if (isPaperGesture()) {
      g.strokeStyle = 'white';
    } else {
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = '#000';
    }
    g.beginPath();
    g.moveTo(state.lastX, state.lastY);
    g.lineTo(x, y);
    g.stroke();
    g.restore();
    if (state.strokePoints) state.strokePoints.push(x, y);
    composite();
    state.lastX = x;
    state.lastY = y;
  } else if (SHAPE_TOOLS.includes(t)) {
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    drawShape(previewCtx, t, state.startX, state.startY, x, y);
    composite();
  } else if (t === 'select' || t === 'crop' || t === 'quad') {
    const sx = Math.min(state.startX, x);
    const sy = Math.min(state.startY, y);
    const sw = Math.abs(x - state.startX);
    const sh = Math.abs(y - state.startY);
    state.selection = {x: sx, y: sy, w: sw, h: sh};
    updateSelectionOverlay();
    document.getElementById('sel-size').textContent = `${Math.round(sw)} × ${Math.round(sh)}`;
  }
}

function onUp(e) {
  if (state.draggingFloating) {
    state.draggingFloating = false;
    return;
  }
  if (state.resizingFloating) {
    state.resizingFloating = false;
    state.resizeHandle = null;
    return;
  }
  if (!state.drawing) return;
  state.drawing = false;
  selOverlay.classList.remove('drawing');

  const t = state.tool;

  if (t === 'pencil' || t === 'brush' || t === 'marker') {
    mergePreviewStroke(t);
    // Ползунок прозрачности начинается с нуля, дотянуть до него - одно движение.
    // Мазок при этом не кладёт ни одного пикселя, и молча это неотличимо от поломки.
    if (state.opacity <= 0) hint(INK_HINT);
    saveHistory(t === 'marker' ? 'Маркер' : 'Штрих', {
      kind: 'stroke', tool: t, points: state.strokePoints.slice(),
      color: state.color, size: state.size, opacity: state.opacity,
      layerId: state.strokeLayerId
    });
  } else if (t === 'eraser') {
    saveHistory('Ластик', {
      kind: 'erase', points: state.strokePoints.slice(),
      size: state.size, layerId: state.strokeLayerId
    });
  } else if (SHAPE_TOOLS.includes(t)) {
    const {x, y} = getPos(e);
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    drawShape(previewCtx, t, state.startX, state.startY, x, y);
    mergePreviewStroke(t);
    if (state.opacity <= 0) hint(INK_HINT);
    saveHistory('Фигура', {
      kind: 'shape', tool: t,
      x0: state.startX, y0: state.startY, x1: x, y1: y,
      color: state.color, size: state.size, opacity: state.opacity,
      fillMode: state.fillMode, layerId: state.strokeLayerId
    });
  } else if (t === 'select') {
    const sel = normalizeSelection();
    if (sel && sel.w > 2 && sel.h > 2) {
      // Помечаем, что выделение готово к перемещению. Сам подъём пикселей и стирание
      // фона происходят при клике внутрь (promoteSelectionToFloating), а не сейчас —
      // так холст не трогается, пока пользователь не начал двигать.
      state.selectionReady = true;
    } else {
      // Нижняя граница у рамки есть, и она разумна. Но пока рамка пропадала молча, это
      // выглядело так, будто выделение просто не работает.
      if (sel && (sel.w > 0 || sel.h > 0)) hint('Рамка слишком мала: протяните её шире.');
      hideSelection();
    }
  } else if (t === 'crop') {
    const sel = normalizeSelection();
    if (sel && sel.w > 2 && sel.h > 2) {
      state.cropping = true;
      showCropControls();
    } else {
      if (sel && (sel.w > 0 || sel.h > 0)) hint('Рамка обрезки слишком мала: протяните её шире.');
      hideSelection();
    }
  } else if (t === 'quad') {
    // Polygon-selection. promote БЕЗ стирания bbox — pickup идентичен canvas,
    // визуально нет «дырки». originalQuad НЕ сохраняем сразу — он будет сделан
    // как snapshot ТЕКУЩЕЙ формы при первом translate/scale/rotate. Так пользователь
    // может свободно менять форму corner-drag без побочного стирания canvas.
    const sel = normalizeSelection();
    if (sel && sel.w >= 20 && sel.h >= 20) {
      const f = promoteSelectionToFloating({ eraseBbox: false });
      if (f) {
        f.quad = [
          { x: f.x,       y: f.y       },
          { x: f.x + f.w, y: f.y       },
          { x: f.x + f.w, y: f.y + f.h },
          { x: f.x,       y: f.y + f.h }
        ];
        f.originalQuad = null; // snapshot будет сделан в ensureOriginalQuadErased
        // Снимок берём заново: quad появился уже после promote, и без этого
        // «подняли и не тронули» выглядело бы как изменение формы.
        rememberFloatingOrigin(f);
        renderFloating();
      }
    } else {
      if (sel && (sel.w > 0 || sel.h > 0)) hint('Для полигона нужна рамка не меньше 20 на 20 пикселей.');
      hideSelection();
    }
  }
}

// ============ ПРОЗРАЧНОСТЬ: ОДНО НАЛОЖЕНИЕ НА МАЗОК ============
// Инвариант: ctx.globalAlpha всегда 1 вне пар save/restore. Прозрачность
// накладывается ровно один раз - когда готовый мазок переносится с previewCanvas
// на холст. Прежний applyBrushStyle писал state.opacity прямо в ctx и не возвращал
// обратно, а globalAlpha - состояние контекста, а не операции: значение оставалось
// висеть, и следующий Ctrl+Z, «Очистить холст», поворот, отражение или открытие
// файла рисовали полупрозрачно. Одна отмена после мазка с прозрачностью 40%
// делала весь лист прозрачным на 60%.
//
// Побочная выгода та же, ради которой так уже был сделан маркер: перекрытия
// round-cap в стыках сегментов не складываются, и мазок при opacity<1 не
// превращается в цепочку тёмных пятен.

// Итоговая альфа мазка. Маркер всегда бледнее заданного - он маркер.
function strokeAlphaFor(tool) {
  return tool === 'marker' ? state.opacity * 0.4 : state.opacity;
}

// Начать мазок в буфере: рисуем непрозрачно, а видимую прозрачность на время
// рисования даёт CSS-слой previewCanvas.
function beginPreviewStroke(tool) {
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCtx.globalAlpha = 1;
  previewCanvas.style.opacity = String(strokeAlphaFor(tool));
  // Мазок по нижнему слою во время протяжки лежал ПОВЕРХ верхних, а на отпускании нырял
  // под них: картинка прыгала в момент, когда пользователь уже отвёл руку. Поэтому на
  // время жеста превью убирается из отдельного холста и подкладывается в сборку ровно
  // туда, где лежит его слой. В WPF-версии это 1.12.0.
  state.previewLayerId = gestureLayer().id;
  state.previewAlpha = strokeAlphaFor(tool);
  previewCanvas.style.visibility = 'hidden';
  composite();
}

// Перенести готовый мазок из буфера на холст. Единственное место, где
// прозрачность вообще применяется к ctx.
function mergePreviewStroke(tool) {
  const g = gctx();
  g.save();
  g.globalAlpha = strokeAlphaFor(tool);
  g.drawImage(previewCanvas, 0, 0);
  g.restore();
  state.previewLayerId = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCanvas.style.opacity = '';
  previewCanvas.style.visibility = '';
  composite();
}

function applyStrokeStyle(g) {
  g.strokeStyle = state.color;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.globalAlpha = 1;
  g.lineWidth = strokeWidthFor(state.tool, state.size);
}

// Рисует всегда в previewCanvas и всегда непрозрачно: альфу накладывает
// mergePreviewStroke. У режима «контур + заливка» это заодно убирает двойное
// наложение на границе, где обводка ложилась поверх заливки.
function drawShape(context, type, x1, y1, x2, y2) {
  context.strokeStyle = state.color;
  context.fillStyle = state.color;
  context.lineWidth = state.size;
  context.lineCap = 'round';
  context.lineJoin = 'round';
  context.globalAlpha = 1;

  const doFill = state.fillMode === 'solid' || state.fillMode === 'both';
  const doStroke = state.fillMode === 'outline' || state.fillMode === 'both';

  context.beginPath();

  if (type === 'line') {
    context.moveTo(x1, y1);
    context.lineTo(x2, y2);
    context.stroke();
  } else if (type === 'rect') {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    context.rect(x, y, w, h);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'ellipse') {
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
    context.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'triangle') {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    context.moveTo(x + w / 2, y);
    context.lineTo(x, y + h);
    context.lineTo(x + w, y + h);
    context.closePath();
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'star') {
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const r = Math.min(Math.abs(x2 - x1), Math.abs(y2 - y1)) / 2;
    drawStar(context, cx, cy, 5, r, r * 0.4);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  } else if (type === 'arrow') {
    const headLen = Math.max(15, state.size * 3);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    context.moveTo(x1, y1);
    context.lineTo(x2, y2);
    context.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
    context.moveTo(x2, y2);
    context.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
    context.stroke();
  } else if (type === 'heart') {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    drawHeart(context, x, y, w, h);
    if (doFill) context.fill();
    if (doStroke) context.stroke();
  }
}

function drawStar(c, cx, cy, spikes, outer, inner) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  c.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    c.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    c.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  c.lineTo(cx, cy - outer);
  c.closePath();
}

function drawHeart(c, x, y, w, h) {
  const topCurveHeight = h * 0.3;
  c.moveTo(x + w / 2, y + topCurveHeight);
  c.bezierCurveTo(x + w / 2, y, x, y, x, y + topCurveHeight);
  c.bezierCurveTo(x, y + (h + topCurveHeight) / 2, x + w / 2, y + (h + topCurveHeight) / 1.3, x + w / 2, y + h);
  c.bezierCurveTo(x + w / 2, y + (h + topCurveHeight) / 1.3, x + w, y + (h + topCurveHeight) / 2, x + w, y + topCurveHeight);
  c.bezierCurveTo(x + w, y, x + w / 2, y, x + w / 2, y + topCurveHeight);
  c.closePath();
}

// Заливка (flood fill) с учётом прозрачности.
// Возвращает true, если хоть один пиксель изменился: по этому вызывающий код решает,
// писать ли запись в историю.
function floodFill(x, y, fillHex) {
  const w = canvas.width, h = canvas.height;
  // Клик у самого правого или нижнего края даёт после Math.floor координату, равную
  // размеру холста: getPixel читает за буфер и возвращает undefined, заливать нечего.
  if (x < 0 || y < 0 || x >= w || y >= h) return false;

  // Читаем СБОРКУ - пользователь целится в то, что видит, - а кладём в активный слой.
  // Иначе клик по пикселю верхнего слоя заливал бы по цвету бумаги под ним.
  const img = ctx.getImageData(0, 0, w, h);
  const data = img.data;
  const alpha = state.opacity;

  const target = getPixel(data, x, y, w);
  const fillRgb = hexToRgbArr(fillHex);

  // Если цвет заливки такой же как целевой при непрозрачности 100% - выходим
  if (alpha >= 1 && colorsMatch(target, fillRgb)) return false;

  // Флаги посещённых пикселей. Без них при непрозрачности меньше 100% и цвете
  // заливки, близком к исходному, смешанный результат остаётся в пределах
  // допуска colorsMatch, пиксель совпадает с target снова и соседи кладут его
  // в стек заново - стек растёт бесконечно и приложение зависает.
  // Стек плоский (x, y, x, y, ...), а не массив пар: на заливке во весь экран
  // пар набегают миллионы, и каждая - отдельный объект для сборщика мусора.
  // Одна карта на два вопроса вместо двух массивов: бит 1 - «смотрели», бит 2 - «закрасили».
  // Просмотренный пиксель - ещё не залитый: обход помечает и те, что не подошли по цвету,
  // а класть в слой надо ровно закрашенные. Две отдельные карты стоили по четверти холста
  // каждая; в WPF-версии ту же карту в 1.22.0 сжали до битов по той же причине.
  const seen = new Uint8Array(w * h);
  const SEEN = 1, TOUCHED = 2;
  const stack = [x, y];
  let filled = 0;
  // Габарит закрашенного: заплатка заводится по нему, а не во весь холст.
  let minX = w, minY = h, maxX = -1, maxY = -1;
  while (stack.length) {
    const cy = stack.pop();
    const cx = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const seenIdx = cy * w + cx;
    if (seen[seenIdx] & SEEN) continue;
    seen[seenIdx] |= SEEN;
    const p = getPixel(data, cx, cy, w);
    if (!colorsMatch(p, target)) continue;
    // Смешиваем с учётом прозрачности: new = bg * (1-a) + fill * a
    const r = Math.round(p[0] * (1 - alpha) + fillRgb[0] * alpha);
    const g = Math.round(p[1] * (1 - alpha) + fillRgb[1] * alpha);
    const b = Math.round(p[2] * (1 - alpha) + fillRgb[2] * alpha);
    setPixel(data, cx, cy, w, [r, g, b]);
    seen[seenIdx] |= TOUCHED;
    if (cx < minX) minX = cx;
    if (cy < minY) minY = cy;
    if (cx > maxX) maxX = cx;
    if (cy > maxY) maxY = cy;
    filled++;
    stack.push(cx + 1, cy, cx - 1, cy, cx, cy + 1, cx, cy - 1);
  }
  if (!filled) return false;
  // Кладём только залитое, и заплатку заводим ПО ГАБАРИТУ закрашенного, а не во весь
  // холст: заливка внутри рамки трогает малую часть картинки, а холст под заплатку
  // просился целиком. putImageData тут не годится - она заменила бы и незакрашенные
  // пиксели внутри габарита, расплющив стопку.
  const pw = maxX - minX + 1;
  const ph = maxY - minY + 1;
  const patch = makeLayerCanvas(pw, ph);
  const pg = patch.getContext('2d');
  const pid = pg.createImageData(pw, ph);
  const pd = pid.data;
  for (let py = 0; py < ph; py++) {
    for (let px = 0; px < pw; px++) {
      const src = (py + minY) * w + (px + minX);
      if (!(seen[src] & TOUCHED)) continue;
      const j = src * 4;
      const k = (py * pw + px) * 4;
      pd[k] = data[j]; pd[k + 1] = data[j + 1]; pd[k + 2] = data[j + 2]; pd[k + 3] = 255;
    }
  }
  pg.putImageData(pid, 0, 0);
  const g = lctx();
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.drawImage(patch, minX, minY);
  g.restore();
  composite();
  return true;
}

function getPixel(d, x, y, w) {
  const i = (y * w + x) * 4;
  return [d[i], d[i+1], d[i+2], d[i+3]];
}

function setPixel(d, x, y, w, c) {
  const i = (y * w + x) * 4;
  d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2]; d[i+3] = 255;
}

function colorsMatch(a, b, tol = 2) {
  return Math.abs(a[0] - b[0]) <= tol && Math.abs(a[1] - b[1]) <= tol && Math.abs(a[2] - b[2]) <= tol;
}

function hexToRgbArr(hex) {
  return [parseInt(hex.slice(1,3), 16), parseInt(hex.slice(3,5), 16), parseInt(hex.slice(5,7), 16)];
}

// Выделение UI
function updateSelectionOverlay() {
  if (!state.selection) { hideSelection(); return; }
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  const wPx = state.selection.w * scaleX;
  const hPx = state.selection.h * scaleY;
  selOverlay.style.display = 'block';
  selOverlay.style.left = (state.selection.x * scaleX) + 'px';
  selOverlay.style.top = (state.selection.y * scaleY) + 'px';
  selOverlay.style.width = wPx + 'px';
  selOverlay.style.height = hPx + 'px';
  // На малых выделениях скрываем side-handles, чтобы corner'ы не наезжали друг на друга
  selOverlay.classList.toggle('small-x', wPx < 50);
  selOverlay.classList.toggle('small-y', hPx < 50);
}

// Приводим выделение к целым пикселям и зажимаем границами холста сразу, как
// только пользователь отпустил мышь. Дробные границы дважды пересэмплировали
// картинку: подъём во floating округлял размер снимка, а укладка обратно рисовала
// его в дробный прямоугольник, и выделение мылилось от одного перетаскивания.
// Заодно это чинит рамку, уехавшую за край: mousemove координаты не ограничивал,
// и протяжка мимо холста давала выделение с отрицательным x.
function normalizeSelection() {
  if (!state.selection) return null;
  const sel = state.selection;
  const x = Math.max(0, Math.min(canvas.width, Math.round(sel.x)));
  const y = Math.max(0, Math.min(canvas.height, Math.round(sel.y)));
  const w = Math.max(0, Math.min(canvas.width - x, Math.round(sel.x + sel.w) - x));
  const h = Math.max(0, Math.min(canvas.height - y, Math.round(sel.y + sel.h) - y));
  state.selection = { x, y, w, h };
  updateSelectionOverlay();
  document.getElementById('sel-size').textContent = `${w} × ${h}`;
  return state.selection;
}

function hideSelection() {
  selOverlay.style.display = 'none';
  state.selection = null;
  state.selectionReady = false;
  document.getElementById('sel-size').textContent = '—';
}

function commitSelection() {
  state.selectionReady = false;
}

function showCropControls() {
  if (!state.selection) return;
  cropControls.style.display = 'flex';
  positionCropControls();
}

// Кнопки «Применить / Отмена» привязаны к нижнему краю выделения и обязаны ехать
// вместе с ним при зуме, панораме и прокрутке. Раньше позиция считалась один раз,
// при показе, и кнопки отрывались от рамки на первом же изменении масштаба.
function positionCropControls() {
  if (cropControls.style.display !== 'flex' || !state.selection) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  cropControls.style.left = (state.selection.x * scaleX) + 'px';
  cropControls.style.top = ((state.selection.y + state.selection.h) * scaleY + 8) + 'px';
}

// Всё, что нарисовано поверх холста в экранных координатах: рамка выделения, рамка
// плавающего объекта, кнопки обрезки, редактор текста с тулбаром. Все они считаются
// от одного и того же getBoundingClientRect, значит и звать их надо одним вызовом.
// Пока список был скопирован в четыре места, два из них отставали: обработчик
// resize не знал про редактор текста, а про кнопки обрезки не знал никто.
function updateOverlays() {
  updateSelectionOverlay();
  updateFloatingFrame();
  positionCropControls();
  positionTextOverlay();
}

// Потолок размера холста. Лишний ноль в поле ширины давал canvas.width = 99999:
// буфер такого размера браузер молча не выделяет, холст становится нерисуемым, а
// рисунок пропадает без предупреждения и без возможности вернуть. Пределы те же,
// что в WPF-версии (ResizeCanvasCommand.MaxDimension / MaxPixels).
const MAX_CANVAS_SIDE = 20000;
const MAX_CANVAS_PIXELS = 120000000;
// Нижняя граница для поля ввода. Перетаскивание ручки холста зажимается своим
// минимумом в clampCanvasSize: отказывать посреди жеста некуда.
const MIN_CANVAS_SIDE = 10;

function canvasSizeAllowed(w, h) {
  return w >= 1 && h >= 1
      && w <= MAX_CANVAS_SIDE && h <= MAX_CANVAS_SIDE
      && w * h <= MAX_CANVAS_PIXELS;
}

// Зажать размер в допустимые пределы, сохранив пропорции. Нужно при перетаскивании
// ручки холста: там отказывать посреди жеста некуда, проще не дать выйти за край.
function clampCanvasSize(w, h) {
  w = Math.min(Math.max(50, w), MAX_CANVAS_SIDE);
  h = Math.min(Math.max(50, h), MAX_CANVAS_SIDE);
  if (w * h > MAX_CANVAS_PIXELS) {
    const k = Math.sqrt(MAX_CANVAS_PIXELS / (w * h));
    w = Math.max(50, Math.floor(w * k));
    h = Math.max(50, Math.floor(h * k));
  }
  return { w, h };
}

// Единственная точка смены размера холста. У <canvas> буферный размер
// (width/height) и экранный (style.width/height) независимы: присвоение
// width сбрасывает буфер, но CSS-размер остаётся прежним, и картинка
// оказывается растянутой в старую рамку. Поэтому applyZoom() здесь обязателен,
// и звать его руками на каждом вызывающем месте больше не нужно.
function setCanvasSize(w, h) {
  // Проверка размера стояла в диалоге и в ручке, а здесь - нигде: любой новый вызов
  // повторил бы ошибку заново. Вырожденный размер оставляет холсты слоёв нулевыми, и
  // дальше падает КАЖДАЯ операция - приложение не чинится ничем, кроме перезапуска.
  w = Math.round(Number(w));
  h = Math.round(Number(h));
  if (!isFinite(w) || !isFinite(h) || w < 1 || h < 1) return false;
  canvas.width = w;
  canvas.height = h;
  previewCanvas.width = w;
  previewCanvas.height = h;
  // Слой обязан быть того же размера, что документ: рисовать по слою за его краем
  // нельзя, а холст меняют поворот, обрезка, открытие файла и смена размера.
  // В WPF-версии слой, восстановленный в размерах прежнего холста, чинили в 1.13.0.
  for (const l of state.layers) {
    if (l.canvas.width !== w || l.canvas.height !== h) {
      const next = makeLayerCanvas(w, h);
      next.getContext('2d').drawImage(l.canvas, 0, 0);
      l.canvas = next;
    }
  }
  applyZoom();
  return true;
}

function applyCrop() {
  if (!state.selection) return;
  // Сначала зафиксировать плавающий объект, чтобы он попал в обрезку, а не
  // потерялся вне новых границ.
  if (state.floating) commitFloating();
  const s = state.selection;
  // Округляем до целых пикселей до всех вычислений: getImageData дробные
  // аргументы округляет, а canvas.width их отбрасывает - на выделении шириной
  // 100.7 буфер стал бы 100, а снимок 101, и правый столбец обрезался бы.
  const cx = Math.max(0, Math.round(s.x));
  const cy = Math.max(0, Math.round(s.y));
  const cw = Math.max(1, Math.min(Math.round(s.w), canvas.width - cx));
  const ch = Math.max(1, Math.min(Math.round(s.h), canvas.height - cy));
  transformLayers(cw, ch, (g, src) => g.drawImage(src, -cx, -cy));
  setCanvasSize(cw, ch);
  composite();
  updateCanvasInfo();
  hideSelection();
  cropControls.style.display = 'none';
  state.cropping = false;
  saveHistory('Обрезка');
}

function cancelCrop() {
  hideSelection();
  cropControls.style.display = 'none';
  state.cropping = false;
}

// История undo/redo. Каждая запись — { url, label }: url для восстановления,
// label для списка в панели «История изменений».
// Сколько байт держит история. Длина base64-строки и есть её вес в памяти.
function historyBytes() {
  let total = 0;
  for (const entry of state.history) {
    total += entry.url.length;
    for (const l of entry.layers) total += l.url.length;
  }
  return total;
}

/**
 * Поставить стопку слоёв ровно такой, какой её запомнил кадр.
 *
 * Слоёв в кадре сколько угодно, и каждый грузится своей картинкой. Ждём все: собрать
 * стопку из половины загруженных значит показать не тот документ. Битый кадр случиться
 * не должен, но повиснуть на нём насовсем - хуже, поэтому onerror отдаёт пустой слой, а
 * не оставляет холст запертым.
 */
function applyStack(entry) {
  if (!entry || !entry.layers) return Promise.resolve();
  const loads = entry.layers.map((meta) => new Promise((done) => {
    const img = new Image();
    img.onload = () => done(img);
    img.onerror = () => done(null);
    img.src = meta.url;
  }));
  return Promise.all(loads).then((imgs) => {
    if (canvas.width !== entry.w || canvas.height !== entry.h) {
      setCanvasSize(entry.w, entry.h);
      updateCanvasInfo();
    }
    // Холсты слоёв ПЕРЕИСПОЛЬЗУЕМ, когда стопка того же размера: пересоздание просило по
    // холсту на каждый слой, и на время подмены в памяти жили обе стопки сразу - двойной
    // пик на каждой отмене. Чистим и рисуем в те же.
    const reuse = state.layers.length === entry.layers.length
      && state.layers.every((l) => l.canvas.width === entry.w && l.canvas.height === entry.h);
    state.layers = entry.layers.map((meta, i) => {
      const l = reuse ? state.layers[i] : makeLayer(meta.name, entry.w, entry.h);
      if (meta.id != null) l.id = meta.id;
      l.name = meta.name;
      l.visible = meta.visible;
      l.opacity = meta.opacity;
      const g = l.canvas.getContext('2d');
      g.clearRect(0, 0, entry.w, entry.h);
      if (imgs[i]) g.drawImage(imgs[i], 0, 0);
      return l;
    });
    // Счётчик не должен выдать номер, который уже занят восстановленным слоем.
    for (const l of state.layers) if (l.id > layerSeq) layerSeq = l.id;
    state.activeLayer = Math.min(entry.active || 0, state.layers.length - 1);
    composite();
    renderLayersPanel();
  });
}

/**
 * Повторить одну складывающуюся правку поверх текущего состояния слоёв.
 *
 * Именно повторить, а не наложить сохранённые пиксели: если правку ниже выключили,
 * подложка стала другой, и заливка обязана растечься по-новому. Сохранённая заплатка
 * этого не умеет и соврала бы.
 */
function replayEntry(r) {
  if (!r) return;
  const layer = state.layers.find((x) => x.id === r.layerId);
  if (!layer) return;
  const g = layer.canvas.getContext('2d');
  const isPaper = state.layers.length > 0 && state.layers[0].id === r.layerId;

  if (r.kind === 'stroke' || r.kind === 'shape') {
    // Рисуем во временный холст и кладём его целиком с нужной прозрачностью - ровно
    // так же, как это делает превью с mergePreviewStroke. Иначе перекрытия сегментов
    // внутри одного штриха темнеют, и повтор расходится с оригиналом.
    const tmp = makeLayerCanvas(canvas.width, canvas.height);
    const tg = tmp.getContext('2d');
    tg.strokeStyle = r.color;
    tg.fillStyle = r.color;
    tg.lineWidth = strokeWidthFor(r.tool, r.size);
    tg.lineCap = 'round';
    tg.lineJoin = 'round';
    if (r.kind === 'stroke') {
      // Повторяем ровно так, как рисовал оригинал: точка на нажатии, потом КАЖДЫЙ отрезок
      // своим путём. Один сплошной путь дал бы почти то же самое - но именно почти:
      // сглаживание на стыках считается иначе, и первый же прогон разошёлся на 18
      // пикселей в начале штриха. «Почти» здесь недопустимо: на пересборке стоит
      // обещание «выключить и включить обратно возвращает документ ДО ПИКСЕЛЯ».
      const p = r.points;
      tg.beginPath();
      tg.moveTo(p[0], p[1]);
      tg.lineTo(p[0] + 0.01, p[1] + 0.01);
      tg.stroke();
      for (let i = 2; i < p.length; i += 2) {
        tg.beginPath();
        tg.moveTo(p[i - 2], p[i - 1]);
        tg.lineTo(p[i], p[i + 1]);
        tg.stroke();
      }
    } else {
      // drawShape берёт цвет, толщину и режим заливки из СОСТОЯНИЯ, а не из контекста.
      // Повтор обязан рисовать записанными настройками, а не сегодняшними, поэтому на
      // время вызова подставляем свои. Первый прогон фаззера поймал ровно это: фигура,
      // повторённая нынешним цветом кисти, расходилась с оригиналом.
      const saved = { color: state.color, size: state.size, fillMode: state.fillMode };
      state.color = r.color;
      state.size = r.size;
      state.fillMode = r.fillMode;
      drawShape(tg, r.tool, r.x0, r.y0, r.x1, r.y1);
      state.color = saved.color;
      state.size = saved.size;
      state.fillMode = saved.fillMode;
    }
    g.save();
    // Прозрачность мазка задаётся ЕГО записью, а не текущим положением ползунка:
    // повтор обязан повторить, а не подставить сегодняшние настройки. Формула та же,
    // что в strokeAlphaFor, только со своими числами.
    g.globalAlpha = r.tool === 'marker' ? r.opacity * 0.4 : r.opacity;
    g.drawImage(tmp, 0, 0);
    g.restore();
    return;
  }

  if (r.kind === 'erase') {
    g.save();
    g.globalAlpha = 1;
    g.lineWidth = r.size;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    if (isPaper) {
      g.strokeStyle = 'white';
      g.fillStyle = 'white';
    } else {
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = '#000';
      g.fillStyle = '#000';
    }
    // Точка на нажатии и КАЖДЫЙ отрезок своим путём - ровно как рисовал оригинал.
    // Сплошной путь давал почти то же самое, расходясь на стыках.
    const p = r.points;
    g.beginPath();
    g.arc(p[0], p[1], r.size / 2, 0, Math.PI * 2);
    g.fill();
    for (let i = 2; i < p.length; i += 2) {
      g.beginPath();
      g.moveTo(p[i - 2], p[i - 1]);
      g.lineTo(p[i], p[i + 1]);
      g.stroke();
    }
    g.restore();
    return;
  }

  if (r.kind === 'text') {
    g.save();
    g.font = r.font;
    g.fillStyle = r.color;
    g.globalAlpha = r.opacity;
    g.textBaseline = 'top';
    const lines = String(r.text).split('\n');
    lines.forEach((line, i) => {
      g.fillText(line, r.x, r.y + i * r.lineHeight);
      if (r.underline) {
        const m = g.measureText(line);
        g.fillRect(r.x, r.y + i * r.lineHeight + r.fontSize + 2, m.width, Math.max(1, r.fontSize / 20));
      }
    });
    g.restore();
    return;
  }

  if (r.kind === 'fill') {
    // Заливка читает СБОРКУ, поэтому пересобираем перед ней: подложка могла измениться
    // ровно потому, что правку ниже выключили.
    composite();
    const savedColor = state.color;
    const savedOpacity = state.opacity;
    const savedActive = state.activeLayer;
    state.color = r.color;
    state.opacity = r.opacity;
    const idx = state.layers.findIndex((x) => x.id === r.layerId);
    if (idx >= 0) state.activeLayer = idx;
    floodFill(r.x, r.y, r.color);
    state.color = savedColor;
    state.opacity = savedOpacity;
    state.activeLayer = savedActive;
  }
}

/** Отпечаток стопки без пикселей: то, чего не видно в сборке, но что меняет документ. */
function layersKey(stack, active) {
  return active + '|' + stack.map((l) =>
    l.name + ':' + (l.visible ? 1 : 0) + ':' + l.opacity.toFixed(3)).join('|');
}

/** Снимок стопки: имена, видимость, прозрачность и пиксели каждого слоя. */
function snapshotLayers() {
  return state.layers.map((l) => ({
    // Номер слоя обязан пережить восстановление кадра: описание правки ссылается на
    // слой именно по нему, и с новыми номерами повтор не нашёл бы, куда рисовать.
    id: l.id,
    name: l.name,
    visible: l.visible,
    opacity: l.opacity,
    url: l.canvas.toDataURL()
  }));
}

function saveHistory(label, replay) {
  // Сборка обязана быть свежей до снятия кадра: сравнение «изменилось ли что-нибудь»
  // идёт по ней, и устаревшая сборка отсеяла бы настоящую правку.
  composite();
  const url = canvas.toDataURL();
  // Правка, не изменившая ни одного пикселя, в ленту не попадает. Прозрачный мазок,
  // фигура нулевого размера, заливка тем цветом, что уже под курсором - всё это давало
  // запись, отмена которой ничего не отменяла. В WPF-версии то же самое делает
  // IDocumentCommand.ChangedAnything (1.20.0); там ради этого каждая команда сравнивает
  // пиксели сама, здесь достаточно сравнить кадр с текущим - он всё равно уже посчитан.
  //
  // Проверка стоит ДО обрезки хвоста: пустой жест после отмены не должен отнимать
  // возможность повтора, раз он не добавляет ничего взамен.
  // Сравнивать только сборку мало: скрытый слой, прозрачность и порядок стопки картинку
  // не меняют, а документ - меняют. Отпечаток кадра включает свойства слоёв.
  const stack = snapshotLayers();
  const key = layersKey(stack, state.activeLayer);
  const current = state.history[state.historyIndex];
  if (current && current.url === url && current.key === key) return;
  // Сохранённое состояние могло лежать в срезаемом хвосте повтора: вернуться к нему уже
  // нельзя, а новая запись сейчас встанет ровно на его номер. Пока метка оставалась на
  // месте, «нарисовали → Ctrl+S → Ctrl+Z → нарисовали заново» давало historyIndex, равный
  // метке, при другом содержимом файла: окно закрывалось без вопроса и уносило работу.
  // В WPF-версии то же самое делает HistoryManager.Push (1.9.0), здесь - строка ниже (1.10.0).
  if (state.savedHistoryIndex > state.historyIndex) state.savedHistoryIndex = -1;
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push({
    // Стойкий номер записи: место в ленте съезжает при переполнении, он - нет.
    seq: ++historySeq,
    url,
    key,
    label: label || 'Изменение',
    w: canvas.width,
    h: canvas.height,
    active: state.activeLayer,
    layers: stack,
    // Описание правки для ПОВТОРА. Есть только у складывающихся правок - штриха,
    // фигуры, надписи, заливки и стирания. Их можно пропустить при пересборке, и
    // получится ровно «как если бы этой правки не делали». Всё остальное кладёт
    // ГОТОВЫЙ снимок и пропуску не поддаётся: см. canToggleEntry.
    replay: replay || null,
    enabled: true
  });
  // Самый свежий кадр не выбрасываем никогда, каким бы тяжёлым он ни был: потерять
  // отмену только что сделанной правки хуже, чем занять память.
  let bytes = historyBytes();
  while (state.history.length > 1 &&
         (state.history.length > MAX_HISTORY || bytes > MAX_HISTORY_BYTES)) {
    bytes -= state.history[0].url.length;
    state.history.shift();
    // Все индексы съехали на один. Метка «здесь было сохранено» должна ехать
    // вместе с ними, иначе после переполнения сохранённый файл считается изменённым.
    state.savedHistoryIndex--;
  }
  state.historyIndex = state.history.length - 1;
  renderHistoryPanel();
}

/**
 * Можно ли выключить запись ленты.
 *
 * Деление проходит не по «нарисованное против холста», а по тому, КАК правка ложится на
 * картинку. Штрих, фигура, надпись, заливка и стирание СКЛАДЫВАЮТСЯ с тем, что на слое, -
 * пропустить любую из них при пересборке можно, и получится ровно «как если бы этой правки
 * не делали». А прижатие поднятого, вставка, поворот, отражение, кадрирование, смена
 * размера, открытие файла, очистка и действия со слоями кладут ГОТОВЫЙ снимок: при
 * пересборке они положат его поверх вместе с тем, что пользователь выключил, и выключатель
 * начал бы врать.
 *
 * Поэтому галочка есть у складывающейся правки и только пока ниже неё нет ни одной пишущей
 * снимок. Это строже, чем кажется, и намеренно: соврать хуже, чем отказать.
 * В WPF-версии то же самое - HistoryManager.CanToggle (1.23.0).
 */
function canToggleEntry(i) {
  const e = state.history[i];
  if (!e || !e.replay) return false;
  // Пересборка начинается с последнего снимка ВЫШЕ записи и проигрывает всё, что ниже.
  // Если такого снимка нет - а его не остаётся, когда переполнение ленты выбрасывает
  // начало, - базой пришлось бы взять саму эту запись, то есть состояние УЖЕ с ней.
  // Пропустить её тогда нельзя, и галочка обещала бы несбыточное.
  let hasBase = false;
  for (let j = 0; j < i; j++) {
    if (!state.history[j].replay) { hasBase = true; break; }
  }
  if (!hasBase) return false;
  for (let j = i + 1; j < state.history.length; j++) {
    if (!state.history[j].replay) return false;
  }
  return true;
}

/** Почему у записи нет галочки. */
function whyNoToggle(i) {
  const e = state.history[i];
  if (!e) return '';
  if (!e.replay) {
    return 'Эта правка кладёт готовый снимок холста, а не складывается с ним: '
         + 'пропустить её при пересборке нельзя.';
  }
  let hasBase = false;
  for (let j = 0; j < i; j++) {
    if (!state.history[j].replay) { hasBase = true; break; }
  }
  if (!hasBase) {
    return 'Начало ленты уже забыто: состояния до этой правки не осталось, '
         + 'и пересобрать документ без неё нечем.';
  }
  return 'Ниже есть правка, кладущая готовый снимок холста: она перекрыла бы результат.';
}

/**
 * Пересобрать документ с учётом выключенных записей.
 *
 * Идём от последней записи со снимком (или от начала ленты) и ПОВТОРЯЕМ каждую
 * складывающуюся правку заново, пропуская выключенные. Снимки повторённых записей
 * устарели - снимаем их заново, иначе первый же Ctrl+Z вернул бы пиксели по устаревшему.
 * В WPF-версии тому же служит IDocumentCommand.ForgetBefore.
 */
async function rebuildTimeline() {
  // Пересборка и восстановление кадра оба перекладывают стопку слоёв, и вперемешку они
  // портят друг друга: отмена посреди пересборки оставляла на холсте кадр, на котором
  // курсор уже не стоит. Поэтому очередь: следующая операция ждёт предыдущую.
  timelineChain = timelineChain.then(doRebuildTimeline, doRebuildTimeline);
  return timelineChain;
}

async function doRebuildTimeline() {
  let base = 0;
  for (let i = state.historyIndex; i >= 0; i--) {
    if (!state.history[i].replay) { base = i; break; }
  }
  state.restoring = true;
  await applyStack(state.history[base]);
  for (let i = base + 1; i < state.history.length; i++) {
    const e = state.history[i];
    if (e.enabled !== false) replayEntry(e.replay);
    composite();
    e.layers = snapshotLayers();
    e.url = canvas.toDataURL();
    e.key = layersKey(e.layers, e.active || 0);
    e.w = canvas.width;
    e.h = canvas.height;
  }
  // Курсор читаем ЗАНОВО: пока шла пересборка, его могли увести отменой, и показать
  // надо тот кадр, на котором он стоит сейчас.
  const generation = ++restoreGeneration;
  await applyStack(state.history[state.historyIndex]);
  if (generation === restoreGeneration) state.restoring = false;
  renderHistoryPanel();
}

/** Снять или вернуть галочку у записи ленты. */
async function setEntryEnabled(i, enabled) {
  if (!canToggleEntry(i)) {
    hint(whyNoToggle(i));
    return false;
  }
  const e = state.history[i];
  if (e.enabled === enabled) return true;
  e.enabled = enabled;
  await rebuildTimeline();
  return true;
}

function toggleEntry(i) {
  const e = state.history[i];
  if (!e) return;
  setEntryEnabled(i, e.enabled === false);
}

/**
 * Отпечаток набора выключенных записей: он тоже меняет картинку.
 *
 * Считается по СТОЙКОМУ номеру записи, а не по её месту в ленте. Переполнение выбрасывает
 * начало ленты, и все места съезжают: отпечаток по местам менялся сам собой, и сохранённый
 * документ объявлялся изменённым без единого действия пользователя.
 */
function disabledKey() {
  return state.history.filter((e) => e.enabled === false).map((e) => e.seq).join(',');
}

function undo() {
  if (state.historyIndex > 0) {
    state.historyIndex--;
    restoreHistory();
    renderHistoryPanel();
  }
}

function redo() {
  if (state.historyIndex < state.history.length - 1) {
    state.historyIndex++;
    restoreHistory();
    renderHistoryPanel();
  }
}

// Прыжок в произвольную точку истории (клик по строке в панели).
function jumpHistory(index) {
  if (index < 0 || index >= state.history.length || index === state.historyIndex) return;
  state.historyIndex = index;
  restoreHistory();
  renderHistoryPanel();
}

// Перерисовать список истории: текущая позиция подсвечена, «будущие» (для повтора) приглушены.
function renderHistoryPanel() {
  const list = document.getElementById('history-list');
  if (!list) return;
  list.innerHTML = '';
  for (let i = 0; i < state.history.length; i++) {
    const entry = state.history[i];
    // Подпись берём из самой записи, а не по индексу: после переполнения
    // MAX_HISTORY нулевую запись вытесняет обычная правка, и жёсткое
    // «Исходное состояние» для i === 0 начинало врать.
    const label = (entry && entry.label) ? entry.label : 'Изменение';
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.dataset.index = String(i);

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.className = 'hist-check';
    box.checked = entry.enabled !== false;
    const can = canToggleEntry(i);
    box.disabled = !can;
    box.title = can
      ? 'Снять - и эта правка перестанет применяться, а идущие после неё останутся'
      : whyNoToggle(i);
    // Щелчок по галочке не должен заодно перегонять документ к этой позиции: снять
    // правку и прийти к ней - разные намерения.
    box.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!can) { e.preventDefault(); hint(whyNoToggle(i)); return; }
      setEntryEnabled(i, box.checked);
    });

    const div = document.createElement('div');
    div.className = 'hist-item' + (i === state.historyIndex ? ' current' : '')
                                + (i > state.historyIndex ? ' future' : '')
                                + (entry.enabled === false ? ' off' : '');
    div.textContent = label;
    div.title = label;
    div.addEventListener('click', () => jumpHistory(i));

    row.appendChild(box);
    row.appendChild(div);
    list.appendChild(row);
  }
  // Прокручиваем ТОЛЬКО сам список, а не страницу. scrollIntoView тащит за собой все
  // прокручиваемые родители: боковая панель длинная, и каждый штрих уводил её вниз, к
  // ленте, - панель слоёв уезжала из виду прямо во время рисования. Видно это только
  // руками, в запущенном приложении.
  const cur = list.querySelector('.hist-item.current');
  if (cur) {
    // Считаем по фактическим прямоугольникам, а не по offsetTop: тот меряется от
    // ближайшего позиционированного предка, а им список быть не обязан.
    const row = cur.parentElement || cur;
    const r = row.getBoundingClientRect();
    const lr = list.getBoundingClientRect();
    if (r.top < lr.top) list.scrollTop -= (lr.top - r.top);
    else if (r.bottom > lr.bottom) list.scrollTop += (r.bottom - lr.bottom);
  }
}

// Свернуть/развернуть панель истории.
function toggleHistoryPanel() {
  const list = document.getElementById('history-list');
  const caret = document.getElementById('hist-caret');
  if (!list) return;
  const collapsed = list.classList.toggle('collapsed');
  if (caret) caret.textContent = collapsed ? '▸' : '▾';
}

// Счётчик поколений восстановления. Загрузка кадра истории идёт через img.onload,
// то есть асинхронно: несколько быстрых Ctrl+Z могут завершиться не в том порядке
// и оставить на холсте не то состояние. Кадр применяется только если он всё ещё
// самый свежий из запрошенных.
let restoreGeneration = 0;

// Обещание, которым кончится текущее восстановление. Всё, что читает холст целиком
// (сохранение), обязано его дождаться: до onload на холсте лежит состояние ДО отмены,
// и Ctrl+S сразу после Ctrl+Z записал бы в файл отменённое. Новый штрих в то же окно
// был бы затёрт приходящим кадром, поэтому onDown при restoring просто не начинает жест.
let restorePending = Promise.resolve();

function restoreHistory() {
  // Активный floating-объект относится к "до-undo" моменту, после restoreHistory
  // его не должно остаться (иначе drag/rotate ссылается на отсутствующую дырку).
  cancelFloating();
  hideSelection();
  const generation = ++restoreGeneration;
  state.restoring = true;
  const entry = state.history[state.historyIndex];
  restorePending = timelineChain.then(() => new Promise((resolve) => {
    // Флаг снимает только самый свежий запрос: кадр, который успели обогнать, никого
    // уже не интересует, а снятый им флаг открыл бы холст посреди следующего кадра.
    const finish = () => {
      if (generation === restoreGeneration) state.restoring = false;
      resolve();
    };
    if (!entry || !entry.layers) { finish(); return; }

    applyStack(entry).then(() => {
      finish();
    });
  }));
  timelineChain = restorePending.catch(() => {});
  return restorePending;
}

// Файлы
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  // Тот же путь, что и у Electron-диалога: «Открыть» заменяет документ, а не кладёт
  // картинку поверх нарисованного.
  reader.onload = (ev) => openImageAsDocument(ev.target.result, file.name);
  reader.readAsDataURL(file);
  // Сбросить, чтобы можно было загрузить тот же файл снова
  e.target.value = '';
});

// ============ ПЛАВАЮЩИЙ ОБЪЕКТ (floating) ============
// Используем отдельный canvas, который рендерится поверх основного через
// CSS-позиционирование. drawImage поддерживает прозрачность, в отличие от putImageData.
//
// Поворот и quad-полигон хранятся прямо на state.floating:
//   - rotation: угол в радианах вокруг центра bbox (f.x+f.w/2, f.y+f.h/2)
//   - quad: null или [{x,y}×4] (tl,tr,br,bl) в координатах канваса. Если quad —
//     полигон работает как clipping-маска поверх pickup'а; изображение НЕ
//     деформируется. Это polygon-selection: можно вырезать треугольник
//     (две точки совпадают), ромб, трапецию — пиксели остаются на месте.

function createFloatingFromCanvas(srcCanvas, x, y, w, h, type = 'image') {
  commitFloating(); // сначала применить предыдущий, если был
  state.floating = {
    type: type,
    canvas: srcCanvas,
    x: x, y: y,
    w: w || srcCanvas.width,
    h: h || srcCanvas.height,
    naturalW: srcCanvas.width,
    naturalH: srcCanvas.height,
    rotation: 0,
    quad: null
  };
  renderFloating();
  // Переключаемся на select для перемещения, если был активный другой tool
  if (state.tool !== 'select' && state.tool !== 'quad') {
    document.querySelector('[data-tool="select"]').click();
  }
}

function createFloatingFromImage(img, x, y) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  createFloatingFromCanvas(c, x, y);
}

// Поднять текущее обычное выделение в floating. Используется при rotate/scale/quad
// без явного pickup. НЕ вызывает saveHistory: это промежуточная операция (как pickup
// при cursor-tool), окончательный snapshot создаётся при commitFloating.
//
// opts.eraseBbox = true (default) — стираем bbox-область на canvas, оставляем pickup
//   во floating. При cancel preCanvas восстанавливает оригинал.
// opts.eraseBbox = false — НЕ стираем canvas. Используется для quad-полигона:
//   при commit мы стираем только polygon-форму (originalQuad), а bbox остаётся целым.
// Сделать белый фон холста прозрачным на pickup-картинке. Тогда при перемещении
// выделения двигается только нарисованное, а не белый прямоугольник, перекрывающий
// то, что под ним. drawImage (в renderFloating/commitFloating) уважает прозрачность.
// Прозрачным делается только фон ВОКРУГ рисунка: заливка идёт от краёв pickup'а
// внутрь и останавливается на первом небелом пикселе. Проход «весь белый подряд»
// был проще, но пробивал дыры в самой картинке - блик на фото, белую заливку
// фигуры, глаз на рисунке, - и сквозь них просвечивало то, что лежит ниже.
function keyOutWhite(cnv, tol) {
  tol = (tol == null) ? 8 : tol;
  const w = cnv.width, h = cnv.height;
  if (!w || !h) return;
  const g = cnv.getContext('2d');
  const id = g.getImageData(0, 0, w, h);
  const d = id.data;
  const lo = 255 - tol;
  const seen = new Uint8Array(w * h);
  // Стартуем со всей рамки pickup'а, стек плоский (x, y, x, y, ...).
  const stack = [];
  for (let x = 0; x < w; x++) stack.push(x, 0, x, h - 1);
  for (let y = 0; y < h; y++) stack.push(0, y, w - 1, y);
  while (stack.length) {
    const cy = stack.pop();
    const cx = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const s = cy * w + cx;
    if (seen[s]) continue;
    seen[s] = 1;
    const i = s * 4;
    if (d[i + 3] === 0) continue; // уже прозрачный - дальше не идём
    if (d[i] < lo || d[i + 1] < lo || d[i + 2] < lo) continue; // край рисунка
    d[i + 3] = 0;
    stack.push(cx + 1, cy, cx - 1, cy, cx, cy + 1, cx, cy - 1);
  }
  g.putImageData(id, 0, 0);
}

function promoteSelectionToFloating(opts) {
  opts = opts || {};
  const eraseBbox = opts.eraseBbox !== false;
  // Подъём ВЫКУСЫВАЕТ пиксели из слоя - то же самое, что делает стирание, и проверка на
  // видимость ему нужна та же. Без неё скрытый слой менялся молча: на экране не двигалось
  // ничего, а дыра в нём оставалась.
  if (!canDrawOnActiveLayer()) return null;
  if (!state.selection) return null;
  const s = state.selection;
  if (s.w < 2 || s.h < 2) return null;
  const pickup = document.createElement('canvas');
  pickup.width = Math.round(s.w);
  pickup.height = Math.round(s.h);
  // Из сборки, а не из слоя: пользователь тащит то, что видит на экране.
  pickup.getContext('2d').drawImage(canvas, s.x, s.y, s.w, s.h, 0, 0, pickup.width, pickup.height);
  // Прямоугольное выделение поднимаем «без белого»: фон становится прозрачным.
  // Для quad (eraseBbox=false) форму задаёт сам полигон-клип, кеинг не нужен.
  if (eraseBbox) keyOutWhite(pickup);
  // Снимок «до» принадлежит СЛОЮ, с которого подняли, а не сборке: вернуть его на
  // видимый холст значило бы впечатать в активный слой всё, что лежит на остальных.
  //
  // И снимается он ПО ГАБАРИТУ выделения, а не со всего слоя: меняется только эта область,
  // остальное возвращать неоткуда и незачем. Слой целиком стоил размера холста за каждый
  // подъём. Исключение - многоугольник: его форму можно растянуть ЗА исходный габарит
  // раньше, чем случится стирание (ensureOriginalQuadErased снимает форму на первом
  // движении), и тогда габарита не хватило бы. Там берём слой целиком - редкий случай.
  const srcLayer = activeLayer();
  const g = srcLayer.canvas.getContext('2d');
  const bx = Math.max(0, Math.floor(s.x));
  const by = Math.max(0, Math.floor(s.y));
  const bw = Math.min(canvas.width - bx, Math.ceil(s.w) + 1);
  const bh = Math.min(canvas.height - by, Math.ceil(s.h) + 1);
  const backup = eraseBbox
    ? { data: g.getImageData(bx, by, bw, bh), x: bx, y: by }
    : { data: g.getImageData(0, 0, canvas.width, canvas.height), x: 0, y: 0 };
  if (eraseBbox) {
    g.save();
    g.globalAlpha = 1;
    // На бумаге под поднятым остаётся белое, на слое выше - дыра: там фона нет,
    // и белая заплатка закрыла бы то, что лежит ниже.
    if (isPaperActive()) {
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = 'white';
      g.fillRect(s.x, s.y, s.w, s.h);
    } else {
      g.clearRect(s.x, s.y, s.w, s.h);
    }
    g.restore();
    composite();
  }
  state.floating = {
    type: 'image',
    canvas: pickup,
    x: s.x, y: s.y, w: s.w, h: s.h,
    naturalW: pickup.width, naturalH: pickup.height,
    rotation: 0,
    quad: null,
    preCanvas: backup,
    // Слой, с которого подняли. Пока объект в руках, слой могут удалить или сменить
    // активный - и вернуть пиксели надо ровно туда, откуда их взяли.
    srcLayerId: srcLayer.id
  };
  hideSelection();
  rememberFloatingOrigin(state.floating);
  renderFloating();
  return state.floating;
}

// Рисует pickup-картинку, обрезанную полигоном из 4 точек.
// Pickup рисуется в (drawX, drawY) размером (drawW, drawH) и НЕ деформируется под
// форму quad'а — quad работает как clip-маска. Однако drawW/drawH позволяют scale
// (через resize-handles bbox'а), а rotation — равномерно повернуть pickup вокруг
// центра bbox. Так resize/rotate действуют на pickup ВМЕСТЕ с маской, а drag
// одного quad-corner — только на маску.
function drawClippedQuad(g, img, quad, drawX, drawY, drawW, drawH, rotation) {
  g.save();
  g.beginPath();
  g.moveTo(quad[0].x, quad[0].y);
  g.lineTo(quad[1].x, quad[1].y);
  g.lineTo(quad[2].x, quad[2].y);
  g.lineTo(quad[3].x, quad[3].y);
  g.closePath();
  g.clip();
  if (rotation) {
    const cx = drawX + drawW / 2;
    const cy = drawY + drawH / 2;
    g.translate(cx, cy);
    g.rotate(rotation);
    g.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    g.drawImage(img, drawX, drawY, drawW, drawH);
  }
  g.restore();
}

// Нарисовать текущий floating в произвольный контекст в координатах холста -
// ровно так, как его видит пользователь (с поворотом и клипом по quad).
// Один общий рендер на все места: превью, фиксацию, пипетку и копирование.
// Пока эти три ветки были скопированы по коду, о повороте забывали то в одной,
// то в другой.
function drawFloatingOnto(g) {
  const f = state.floating;
  if (!f) return;
  if (f.quad) {
    drawClippedQuad(g, f.canvas, f.quad, f.x, f.y, f.w, f.h, f.rotation || 0);
  } else if (f.rotation) {
    g.save();
    g.translate(f.x + f.w / 2, f.y + f.h / 2);
    g.rotate(f.rotation);
    g.drawImage(f.canvas, -f.w / 2, -f.h / 2, f.w, f.h);
    g.restore();
  } else {
    g.drawImage(f.canvas, f.x, f.y, f.w, f.h);
  }
}

// Габарит того, что реально нарисовано, в координатах холста. Это не bbox
// (f.x/f.y/f.w/f.h): у повёрнутого прямоугольника углы вылезают за него,
// а quad, наоборот, бывает уже. Нужен при копировании, чтобы не срезать края.
function floatingBounds(f) {
  let pts;
  if (f.quad) {
    pts = f.quad;
  } else {
    pts = [
      { x: f.x, y: f.y }, { x: f.x + f.w, y: f.y },
      { x: f.x + f.w, y: f.y + f.h }, { x: f.x, y: f.y + f.h }
    ];
    if (f.rotation) {
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      const c = Math.cos(f.rotation), s = Math.sin(f.rotation);
      pts = pts.map(p => ({
        x: cx + c * (p.x - cx) - s * (p.y - cy),
        y: cy + s * (p.x - cx) + c * (p.y - cy)
      }));
    }
  }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  return { x: minX, y: minY, w: Math.max(...xs) - minX, h: Math.max(...ys) - minY };
}

function renderFloating() {
  // previewCanvas делят мазок и плавающий объект: без сброса объект унаследовал бы
  // прозрачность недорисованного мазка.
  previewCanvas.style.opacity = '';
  // А ещё - его подкладку под слой: то, что пользователь держит в руках, обязано быть
  // видно поверх всего, даже если его слой спрятан или прозрачен (WPF, 1.20.0).
  state.previewLayerId = null;
  previewCanvas.style.visibility = '';
  if (!state.floating) {
    floatingFrame.classList.remove('active', 'quad-mode');
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    hideQuadControls();
    return;
  }
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  drawFloatingOnto(previewCtx);
  updateFloatingFrame();
}

function updateFloatingFrame() {
  if (!state.floating) {
    floatingFrame.classList.remove('active', 'quad-mode');
    hideQuadControls();
    return;
  }
  const f = state.floating;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;

  // Общая часть: позиция и размер bbox + опциональный CSS-поворот рамки.
  // Resize-handles и rotate-handle висят внутри frame'а и поворачиваются вместе с ним.
  const wPx = f.w * scaleX;
  const hPx = f.h * scaleY;
  floatingFrame.classList.add('active');
  floatingFrame.classList.toggle('quad-mode', !!f.quad);
  floatingFrame.classList.toggle('rotated', !!f.rotation);
  floatingFrame.classList.toggle('small-x', wPx < 50);
  floatingFrame.classList.toggle('small-y', hPx < 50);
  floatingFrame.style.left = (f.x * scaleX) + 'px';
  floatingFrame.style.top = (f.y * scaleY) + 'px';
  floatingFrame.style.width = wPx + 'px';
  floatingFrame.style.height = hPx + 'px';
  floatingFrame.style.transformOrigin = '50% 50%';
  floatingFrame.style.transform = f.rotation ? `rotate(${f.rotation}rad)` : '';

  if (f.quad) {
    showQuadControls(f.quad, scaleX, scaleY);
  } else {
    hideQuadControls();
  }
}

function showQuadControls(quad, scaleX, scaleY) {
  // Перерисовать SVG-контур и позиции точек. SVG растягиваем под canvas (в screen-px).
  const rect = canvas.getBoundingClientRect();
  quadOutline.classList.add('active');
  quadOutline.setAttribute('width', rect.width);
  quadOutline.setAttribute('height', rect.height);
  quadOutline.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  quadOutline.style.width = rect.width + 'px';
  quadOutline.style.height = rect.height + 'px';
  const pts = quad.map(p => `${p.x * scaleX},${p.y * scaleY}`).join(' ');
  quadOutlinePoly.setAttribute('points', pts);
  quadCornerEls.forEach((el, i) => {
    el.classList.add('active');
    el.style.left = (quad[i].x * scaleX) + 'px';
    el.style.top = (quad[i].y * scaleY) + 'px';
  });
}

function hideQuadControls() {
  quadOutline.classList.remove('active');
  quadCornerEls.forEach(el => el.classList.remove('active'));
}

// Стереть исходную область quad на main canvas. Lazy: вызывается при первом
// translate/scale/rotate. Snapshot ТЕКУЩЕЙ формы quad сохраняется в originalQuad,
// и стирается именно она (не bbox!). Так пользователь может corner-drag'ом сделать
// треугольник, затем move — и на canvas останется "всё минус треугольник", а не
// "всё минус прямоугольник bbox".
function ensureOriginalQuadErased() {
  const f = state.floating;
  if (!f || !f.quad || f.originalQuadErased) return;
  // Snapshot текущей формы quad как originalQuad — стираем именно её
  f.originalQuad = f.quad.map(p => ({ x: p.x, y: p.y }));
  const g = layerCtxById(f.srcLayerId);
  g.save();
  g.globalAlpha = 1;
  g.beginPath();
  g.moveTo(f.originalQuad[0].x, f.originalQuad[0].y);
  for (let i = 1; i < 4; i++) g.lineTo(f.originalQuad[i].x, f.originalQuad[i].y);
  g.closePath();
  if (isPaperLayerId(f.srcLayerId)) {
    g.fillStyle = 'white';
  } else {
    g.globalCompositeOperation = 'destination-out';
    g.fillStyle = '#000';
  }
  g.fill();
  g.restore();
  composite();
  f.originalQuadErased = true;
}

// Снимок положения пикапа сразу после подъёма. Нужен, чтобы отличить «подняли и
// положили обратно, не сдвинув» от настоящего перемещения.
function rememberFloatingOrigin(f) {
  if (!f) return;
  f.origin = {
    x: f.x, y: f.y, w: f.w, h: f.h,
    rotation: f.rotation || 0,
    quad: f.quad ? f.quad.map(p => ({ x: p.x, y: p.y })) : null
  };
}

// Сдвинулся ли пикап хоть как-нибудь с момента подъёма. Сравниваем геометрию, а не
// ставим флаг в пяти обработчиках drag'а: флаг забыть легко, а забытый - значит
// молча потерянная запись в истории.
function floatingMoved(f) {
  if (!f.preCanvas) return true;   // вставка или открытая картинка: пиксели новые
  const o = f.origin;
  if (!o) return true;
  if (f.x !== o.x || f.y !== o.y || f.w !== o.w || f.h !== o.h) return true;
  if ((f.rotation || 0) !== o.rotation) return true;
  const q = f.quad, oq = o.quad;
  if (!!q !== !!oq) return true;
  if (q && oq) {
    for (let i = 0; i < q.length; i++) {
      if (q[i].x !== oq[i].x || q[i].y !== oq[i].y) return true;
    }
  }
  return false;
}

function commitFloating() {
  if (!state.floating) return;
  const f = state.floating;
  // Подняли и положили обратно, не сдвинув: клик внутрь выделения и клик мимо.
  // Холст обязан остаться прежним до пикселя, а в истории и в признаке
  // несохранённой работы такому событию делать нечего. cancelFloating
  // возвращает preCanvas, то есть ровно дополитное состояние.
  if (!floatingMoved(f)) {
    cancelFloating();
    return;
  }
  // Для quad: гарантируем что текущая shape стёрта (если был idle commit без translate).
  // Если квад был перенесён/изменён до commit — стирание уже произошло раньше.
  if (f.quad) ensureOriginalQuadErased();
  const g = layerCtxById(f.srcLayerId);
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  drawFloatingOnto(g);
  g.restore();
  composite();
  state.floating = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  floatingFrame.classList.remove('active', 'quad-mode');
  floatingFrame.style.transform = '';
  hideQuadControls();
  saveHistory('Перемещение');
}

function cancelFloating() {
  // Если есть backup (promote из selection) — возвращаем canvas в дополитное состояние
  if (state.floating && state.floating.preCanvas) {
    const b = state.floating.preCanvas;
    layerCtxById(state.floating.srcLayerId).putImageData(b.data, b.x, b.y);
    composite();
  }
  state.floating = null;
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  floatingFrame.classList.remove('active', 'quad-mode');
  floatingFrame.style.transform = '';
  hideQuadControls();
}

// Убрать floating, НЕ возвращая пиксели на место: то, что было под ним,
// остаётся стёртым. Этим отличается от cancelFloating, который делает ровно
// обратное - откатывает подъём. Возвращает true, если холст при этом
// изменился, то есть нужна запись в историю (у только что вставленной
// картинки под ней ничего не стиралось, и писать нечего).
function deleteFloating() {
  const f = state.floating;
  if (!f) return false;
  const hadQuad = !!f.quad;
  // Форма quad стирается лениво, при первом перемещении. Если его не было -
  // стираем сейчас, иначе «вырезать» оставило бы полигон на холсте.
  if (hadQuad) ensureOriginalQuadErased();
  const changed = !!f.preCanvas || hadQuad;
  f.preCanvas = null; // подавляем restore внутри cancelFloating
  cancelFloating();
  return changed;
}

// Проверка, попал ли клик в floating (с учётом rotation и quad).
function hitFloating(x, y) {
  if (!state.floating) return null;
  const f = state.floating;
  if (f.quad) {
    return pointInPolygon(x, y, f.quad) ? 'body' : null;
  }
  if (!f.rotation) {
    return (x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h) ? 'body' : null;
  }
  // Поворачиваем точку в локальную систему floating
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  const cos = Math.cos(-f.rotation), sin = Math.sin(-f.rotation);
  const lx = cos * (x - cx) - sin * (y - cy) + f.w / 2;
  const ly = sin * (x - cx) + cos * (y - cy) + f.h / 2;
  return (lx >= 0 && lx <= f.w && ly >= 0 && ly <= f.h) ? 'body' : null;
}

// Ray casting test для произвольного polygon
function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// ============ RESIZE FLOATING ============
// Anchor-based math: противоположная ручке точка фиксирована в мировой системе,
// мышь приводится к локальной системе (-rotation), считаются новые w/h, центр
// возвращается обратно в мир (+rotation). Это работает для любого угла поворота
// и для quad — точки масштабируются вокруг того же якоря.

function resizeFloating(x, y) {
  const f = state.floating;
  const h = state.resizeHandle;
  if (!f || !h) return;

  const orig = state.floatingOriginal;
  const shift = state.shiftKey || false;
  const rot = orig.rotation || 0;
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  const cosNeg = Math.cos(-rot), sinNeg = Math.sin(-rot);

  // 1) anchor в локальной системе bbox: противоположная ручке точка
  let axL, ayL;
  if (h.includes('w')) axL = orig.w; else if (h.includes('e')) axL = 0; else axL = orig.w / 2;
  if (h.includes('n')) ayL = orig.h; else if (h.includes('s')) ayL = 0; else ayL = orig.h / 2;

  // 2) anchor в мировой системе: поворачиваем вектор от центра bbox
  const origCx = orig.x + orig.w / 2;
  const origCy = orig.y + orig.h / 2;
  const vx = axL - orig.w / 2;
  const vy = ayL - orig.h / 2;
  const axW = origCx + cosR * vx - sinR * vy;
  const ayW = origCy + sinR * vx + cosR * vy;

  // 3) локальная позиция мыши относительно anchor (поворот -rot)
  const dxW = x - axW;
  const dyW = y - ayW;
  const lx = cosNeg * dxW - sinNeg * dyW;
  const ly = sinNeg * dxW + cosNeg * dyW;

  // 4) новые размеры в локальной системе (знак зависит от того, по какую сторону anchor)
  let newW, newH;
  if (h.includes('w')) newW = Math.max(10, -lx);
  else if (h.includes('e')) newW = Math.max(10, lx);
  else newW = orig.w;
  if (h.includes('n')) newH = Math.max(10, -ly);
  else if (h.includes('s')) newH = Math.max(10, ly);
  else newH = orig.h;

  // 5) shift = пропорция (для угловых ручек)
  if (shift && h.length === 2) {
    const ratio = orig.w / orig.h;
    if (newW / newH > ratio) newW = newH * ratio;
    else newH = newW / ratio;
  }

  // 6) новый центр floating в мире: anchor + повернутый локальный вектор к центру
  let lcx, lcy;
  if (h.includes('w')) lcx = -newW / 2;
  else if (h.includes('e')) lcx = newW / 2;
  else lcx = 0;
  if (h.includes('n')) lcy = -newH / 2;
  else if (h.includes('s')) lcy = newH / 2;
  else lcy = 0;
  const newCx = axW + cosR * lcx - sinR * lcy;
  const newCy = ayW + sinR * lcx + cosR * lcy;

  // 7) если quad — scale 4 точки относительно anchor world (в локальной системе)
  if (orig.quad) {
    const sx = newW / orig.w;
    const sy = newH / orig.h;
    f.quad = orig.quad.map(p => {
      const px = p.x - axW;
      const py = p.y - ayW;
      const plx = cosNeg * px - sinNeg * py;
      const ply = sinNeg * px + cosNeg * py;
      const splx = plx * sx;
      const sply = ply * sy;
      const wx = cosR * splx - sinR * sply;
      const wy = sinR * splx + cosR * sply;
      return { x: axW + wx, y: ayW + wy };
    });
  }

  f.x = newCx - newW / 2;
  f.y = newCy - newH / 2;
  f.w = newW;
  f.h = newH;
  renderFloating();
}

// Обработчики ручек resize — только во floating-frame (на selection-overlay их нет,
// чтобы не перехватывать клик пользователя по canvas при создании нового выделения).
// Для resize обычного select сначала нажимай rotate-handle (promote → floating),
// и дальше уже full pixel-resize.
document.querySelectorAll('.resize-handle').forEach(h => {
  h.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    // Handle на selection-overlay: сначала promote во floating (без вращения),
    // потом стартуем обычный resize. Это и есть «масштабирование выделения».
    if (h.dataset.on === 'selection' && !state.floating) {
      if (!state.selection || !state.selectionReady) return;
      const f = promoteSelectionToFloating();
      if (!f) return;
    }
    if (!state.floating) return;
    ensureOriginalQuadErased();
    state.resizingFloating = true;
    state.resizeHandle = h.dataset.handle;
    state.floatingOriginal = {
      x: state.floating.x, y: state.floating.y,
      w: state.floating.w, h: state.floating.h,
      rotation: state.floating.rotation || 0,
      quad: state.floating.quad ? state.floating.quad.map(p => ({ x: p.x, y: p.y })) : null
    };
  });
});

// Обработчик rotate handle на floating-frame
floatingRotateHandle.addEventListener('mousedown', (e) => {
  if (!state.floating) return;
  e.stopPropagation();
  e.preventDefault();
  startRotateDrag(e);
});

// Обработчик rotate handle на selection-overlay: если есть только selection (без floating),
// поднимаем её во floating и начинаем поворот сразу.
selectionRotateHandle.addEventListener('mousedown', (e) => {
  e.stopPropagation();
  e.preventDefault();
  if (!state.floating) {
    if (!state.selection || !state.selectionReady) return;
    const f = promoteSelectionToFloating();
    if (!f) return;
  }
  startRotateDrag(e);
});


function startRotateDrag(e) {
  ensureOriginalQuadErased();
  const f = state.floating;
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  const { x, y } = getPos(e);
  state.rotatingFloating = true;
  state.rotationStart = {
    initialMouseAngle: Math.atan2(y - cy, x - cx),
    initialRotation: f.rotation || 0,
    centerX: cx,
    centerY: cy,
    // Запоминаем исходные quad-точки для поворота от того же центра без накопления ошибок
    origQuad: f.quad ? f.quad.map(p => ({ x: p.x, y: p.y })) : null
  };
}

// Drag угловой точки quad. НЕ стираем оригинал — corner-drag меняет форму clip-маски,
// но pickup остаётся на месте, и canvas под ним нетронут. Стирание происходит только
// при translate/scale/rotate (operations что реально двигают/трансформируют pickup).
quadCornerEls.forEach(el => {
  el.addEventListener('mousedown', (e) => {
    if (!state.floating || !state.floating.quad) return;
    e.stopPropagation();
    e.preventDefault();
    state.warpingQuad = true;
    state.warpCornerIdx = parseInt(el.dataset.corner, 10);
  });
});

// Глобальные mousemove/mouseup для всех drag-операций над floating
document.addEventListener('mousemove', (e) => {
  if (state.resizingFloating) {
    const { x, y } = getPos(e);
    state.shiftKey = e.shiftKey;
    resizeFloating(x, y);
    return;
  }
  if (state.rotatingFloating && state.floating) {
    const f = state.floating;
    const rs = state.rotationStart;
    const cx = rs.centerX, cy = rs.centerY;
    const { x, y } = getPos(e);
    const angle = Math.atan2(y - cy, x - cx);
    let next = rs.initialRotation + (angle - rs.initialMouseAngle);
    if (e.shiftKey) {
      const step = Math.PI / 12;
      next = Math.round(next / step) * step;
    }
    f.rotation = next;
    // Если активен quad — поворачиваем 4 точки от исходных позиций вокруг (cx,cy)
    if (rs.origQuad) {
      const delta = next - rs.initialRotation;
      const c = Math.cos(delta), s = Math.sin(delta);
      f.quad = rs.origQuad.map(p => ({
        x: cx + c * (p.x - cx) - s * (p.y - cy),
        y: cy + s * (p.x - cx) + c * (p.y - cy)
      }));
    }
    renderFloating();
    return;
  }
  if (state.warpingQuad && state.floating && state.floating.quad) {
    const { x, y } = getPos(e);
    state.floating.quad[state.warpCornerIdx] = { x, y };
    renderFloating();
    return;
  }
});
document.addEventListener('mouseup', () => {
  if (state.resizingFloating) {
    state.resizingFloating = false;
    state.resizeHandle = null;
  }
  if (state.rotatingFloating) {
    state.rotatingFloating = false;
    state.rotationStart = null;
  }
  if (state.warpingQuad) {
    state.warpingQuad = false;
    state.warpCornerIdx = null;
  }
  if (state.draggingFloating) {
    state.draggingFloating = false;
  }
});

// ============ ТЕКСТОВЫЙ РЕДАКТОР ============

let currentTextX = 0, currentTextY = 0;

function startTextEdit(x, y) {
  currentTextX = x;
  currentTextY = y;

  textEditor.innerHTML = '';
  textEditor.style.display = 'block';
  positionTextEditor();
  textEditor.style.color = state.color;
  textEditor.style.opacity = state.opacity;
  const fontSize = clampTextSize(document.getElementById('text-size').value);
  textEditor.style.fontSize = fontSize + 'px';
  textEditor.style.fontFamily = document.getElementById('text-font').value;
  textEditor.style.minWidth = '80px';
  textEditor.style.minHeight = (fontSize * 1.3) + 'px';

  // Применяем активные стили
  document.querySelectorAll('#text-bold, #text-italic, #text-underline').forEach(b => {
    textEditor.style[b.id === 'text-bold' ? 'fontWeight' : b.id === 'text-italic' ? 'fontStyle' : 'textDecoration'] =
      b.classList.contains('active') ?
        (b.id === 'text-bold' ? 'bold' : b.id === 'text-italic' ? 'italic' : 'underline') :
        'normal';
  });

  // Показываем тулбар
  textToolbar.classList.add('active');
  positionTextToolbar();

  // Фокус
  setTimeout(() => textEditor.focus(), 10);
}

// Редактор задаёт размеры в пикселях холста, а живёт в экранных. Позицию раньше
// умножали на зум, а размер шрифта - нет: на масштабе 200% буквы в рамке были
// вдвое мельче тех, что ложились на холст, а смена зума оставляла рамку на старом
// месте. Масштабируем элемент целиком одним transform - тогда и padding, по
// которому commitText считает смещение, остаётся в координатах холста.
function positionTextEditor() {
  const rect = canvas.getBoundingClientRect();
  const z = rect.width / canvas.width;
  textEditor.style.transformOrigin = '0 0';
  textEditor.style.transform = `scale(${z})`;
  textEditor.style.left = (currentTextX * z) + 'px';
  textEditor.style.top = (currentTextY * z) + 'px';
}

// Рамка и её тулбар держатся за одну точку холста, значит двигаются вместе.
function positionTextOverlay() {
  if (textEditor.style.display !== 'block') return;
  positionTextEditor();
  positionTextToolbar();
}

function positionTextToolbar() {
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  textToolbar.style.left = (currentTextX * scaleX) + 'px';
  textToolbar.style.top = Math.max(0, currentTextY * scaleY - 50) + 'px';
}

function commitText() {
  if (textEditor.style.display !== 'block') return;
  const text = textEditor.innerText.trim();
  if (text && state.opacity <= 0) hint(INK_HINT);
  if (text) {
    const fontSize = clampTextSize(document.getElementById('text-size').value);
    const fontFamily = document.getElementById('text-font').value;
    const bold = document.getElementById('text-bold').classList.contains('active');
    const italic = document.getElementById('text-italic').classList.contains('active');
    const underline = document.getElementById('text-underline').classList.contains('active');

    let fontStr = '';
    if (italic) fontStr += 'italic ';
    if (bold) fontStr += 'bold ';
    fontStr += fontSize + 'px ' + fontFamily;

    const g = gctx();
    g.save();
    g.font = fontStr;
    g.fillStyle = state.color;
    g.globalAlpha = state.opacity;
    g.textBaseline = 'top';

    // Многострочный текст
    const lines = text.split('\n');
    const lineHeight = fontSize * 1.2;
    // textEditor padding = 4 6
    const offX = 6;
    const offY = 4;
    lines.forEach((line, i) => {
      g.fillText(line, currentTextX + offX, currentTextY + offY + i * lineHeight);
      if (underline) {
        const metrics = g.measureText(line);
