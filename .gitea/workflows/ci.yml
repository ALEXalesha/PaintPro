# Проверки на домашнем Gitea. Копия .github/workflows/ci.yml, отличие одно: задачи
# идут на раннер ПК (метка windows), а не на windows-latest / ubuntu-latest - такие метки
# есть только у раннера ноутбука, и без него задачи висели в очереди и отменялись.
# Раз папка .gitea/workflows есть, Gitea берёт проверки только отсюда: выпуски и Pages -
# дело GitHub, здесь их нет. Меняя проверки, править оба файла.

# Проверки на каждый пуш: Electron-версия и C#-версия отдельными задачами.
#
# Раннер именно windows: медленнее и дороже линукса, но быстрый набор водит мышью по
# настоящему Chromium, а медленный запускает настоящий Electron. Проверять сборку,
# которую никто не соберёт под Windows, смысла нет - приложение только под неё и есть.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  electron:
    name: Electron
    runs-on: windows
    timeout-minutes: 30
    defaults:
      run:
        working-directory: paint-pro-electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paint-pro-electron/package-lock.json

      - name: Зависимости
        run: npm ci

      # Playwright ставит свой Chromium: системного на раннере может не быть, а набор
      # открывает страницу именно в нём.
      - name: Chromium для Playwright
        run: npx playwright install --with-deps chromium

      # До проверок, а не после: web.spec.js проверяет именно собранный файл.
      - name: Сборка одного файла для браузера
        run: npm run build:web

      - name: Проверки страницы
        run: npm test

      # Проверки настоящего приложения (npm run test:app) здесь не идут: они открывают
      # окна Electron на экране ПК. Их гоняют перед выпуском и на GitHub.

      - name: Забрать собранный файл
        uses: actions/upload-artifact@v4
        with:
          name: paint-pro-web
          path: paint-pro-electron/dist/paint-pro-*-web.html
          if-no-files-found: error

      # Отчёт Playwright нужен ровно тогда, когда что-то упало: по нему видно, на каком
      # шаге и с какой картинкой.
      - name: Отчёт, если упало
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: paint-pro-electron/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  csharp:
    name: C# (WPF)
    runs-on: windows
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # .NET на ПК уже стоит; setup-dotnet ставил бы его в Program Files, а прав на
      # это у раннера нет.

      # WPF и SkiaSharp есть только под Windows, отсюда и раннер. Тесты слоя
      # представления держат свой STA-поток (WpfRunner), окна на экран не выводят.
      - name: Тесты xUnit
        run: dotnet test tests/PaintPro.Tests -c Release --nologo
