name: Bug report
description: Something in Paint Pro does not do what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Russian or English, both are fine.

        If you can reproduce it in the [browser demo](https://alexalesha.github.io/PaintPro/),
        say so - that rules out everything Electron adds and makes the report much easier to act on.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Pick the selection tool, drag a region
        2. Drag the bottom-right handle
        3. The frame freezes although the button is still down
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Bottom right corner of the window, or the title of the browser tab.
      placeholder: "1.15.0"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build
      options:
        - Installer
        - Portable
        - Browser (single HTML file or the live demo)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshot, canvas size, the file you opened. Optional.
